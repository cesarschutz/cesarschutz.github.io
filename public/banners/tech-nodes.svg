<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <circle cx="800" cy="400" r="560" fill="url(#glow)"/>

  <!-- constelação discreta na faixa inferior (o centro fica limpo para o texto) -->
  <g stroke="#00a0e5" stroke-opacity="0.14" stroke-width="1.5" fill="none">
    <path d="M60 700 L280 640 L520 690 L760 630 L1010 680 L1260 620 L1520 670"/>
    <path d="M280 640 L520 690 M760 630 L1010 680 M1260 620 L1010 680"/>
  </g>
  <g fill="#00a0e5" opacity="0.35">
    <circle cx="280" cy="640" r="4"/>
    <circle cx="520" cy="690" r="4"/>
    <circle cx="760" cy="630" r="4"/>
    <circle cx="1010" cy="680" r="4"/>
    <circle cx="1260" cy="620" r="4"/>
  </g>

  <!-- traço sutil no topo -->
  <g stroke="#00a0e5" stroke-opacity="0.1" stroke-width="1.5" fill="none">
    <path d="M120 120 L400 160 L700 110 L1000 150 L1300 105 L1560 140"/>
  </g>
  <g fill="#7fd4f5" opacity="0.22">
    <circle cx="400" cy="160" r="3"/>
    <circle cx="1000" cy="150" r="3"/>
    <circle cx="1300" cy="105" r="3"/>
  </g>

  <!-- estrelas mínimas -->
  <g fill="#7fd4f5" opacity="0.2">
    <circle cx="180" cy="300" r="1.8"/><circle cx="1440" cy="260" r="1.8"/>
    <circle cx="90" cy="500" r="1.8"/><circle cx="1520" cy="470" r="1.8"/>
    <circle cx="320" cy="90" r="1.8"/><circle cx="1180" cy="740" r="1.8"/>
  </g>
</svg>
