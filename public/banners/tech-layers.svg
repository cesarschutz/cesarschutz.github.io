<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#021c2b"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="800" fill="url(#bg3)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="600" ry="330" fill="url(#glow3)"/>

  <!-- pilha isométrica pequena e discreta no canto inferior esquerdo -->
  <g transform="translate(-190,330) scale(0.55)" stroke-linejoin="round">
    <g>
      <polygon points="800,560 1080,470 800,380 520,470" fill="#032c42" stroke="#00a0e5" stroke-opacity="0.3" stroke-width="2.5"/>
      <polygon points="520,470 800,560 800,610 520,520" fill="#021c2b" stroke="#00a0e5" stroke-opacity="0.18" stroke-width="2"/>
      <polygon points="1080,470 800,560 800,610 1080,520" fill="#01131b" stroke="#00a0e5" stroke-opacity="0.18" stroke-width="2"/>
    </g>
    <g transform="translate(0,-130)">
      <polygon points="800,560 1080,470 800,380 520,470" fill="#043751" stroke="#00a0e5" stroke-opacity="0.35" stroke-width="2.5"/>
      <polygon points="520,470 800,560 800,600 520,510" fill="#032c42" stroke="#00a0e5" stroke-opacity="0.2" stroke-width="2"/>
      <polygon points="1080,470 800,560 800,600 1080,510" fill="#021c2b" stroke="#00a0e5" stroke-opacity="0.2" stroke-width="2"/>
    </g>
    <g transform="translate(0,-260)">
      <polygon points="800,560 1080,470 800,380 520,470" fill="#04435f" stroke="#00a0e5" stroke-opacity="0.45" stroke-width="2.5"/>
      <polygon points="520,470 800,560 800,600 520,510" fill="#043751" stroke="#00a0e5" stroke-opacity="0.22" stroke-width="2"/>
      <polygon points="1080,470 800,560 800,600 1080,510" fill="#032c42" stroke="#00a0e5" stroke-opacity="0.22" stroke-width="2"/>
    </g>
  </g>

  <!-- eco da pilha, menor ainda, no canto superior direito -->
  <g transform="translate(980,-120) scale(0.38)" stroke-linejoin="round" opacity="0.6">
    <g>
      <polygon points="800,560 1080,470 800,380 520,470" fill="#032c42" stroke="#00a0e5" stroke-opacity="0.3" stroke-width="2.5"/>
    </g>
    <g transform="translate(0,-130)">
      <polygon points="800,560 1080,470 800,380 520,470" fill="#043751" stroke="#00a0e5" stroke-opacity="0.35" stroke-width="2.5"/>
    </g>
  </g>

  <g fill="#7fd4f5" opacity="0.2">
    <circle cx="320" cy="140" r="1.8"/><circle cx="1200" cy="700" r="1.8"/>
    <circle cx="1480" cy="420" r="1.8"/><circle cx="150" cy="260" r="1.8"/>
    <circle cx="700" cy="90" r="1.8"/>
  </g>
</svg>
