<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.5" stop-color="#032c42"/>
      <stop offset="1" stop-color="#010e14"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="800" fill="url(#bg2)"/>
  <circle cx="800" cy="400" r="540" fill="url(#glow2)"/>

  <!-- trilhas de circuito rentes às bordas (centro limpo para o texto) -->
  <g stroke="#00a0e5" fill="none" stroke-linecap="round" stroke-width="2">
    <g stroke-opacity="0.2">
      <path d="M0 120 H360 L440 180 H720"/>
      <path d="M1600 100 H1240 L1160 160 H960"/>
      <path d="M0 690 H300 L400 620 H620"/>
      <path d="M1600 660 H1300 L1200 720 H980"/>
    </g>
    <g stroke-opacity="0.12">
      <path d="M0 180 H240 L300 230 H480"/>
      <path d="M1600 200 H1400 L1330 150 H1180"/>
      <path d="M0 620 H180 L250 670 H420"/>
      <path d="M1600 740 H1420 L1350 690 H1200"/>
    </g>
  </g>

  <!-- pads nas pontas das trilhas -->
  <g fill="#010e14" stroke="#00a0e5" stroke-width="2" stroke-opacity="0.4">
    <circle cx="720" cy="180" r="6"/>
    <circle cx="960" cy="160" r="6"/>
    <circle cx="620" cy="620" r="6"/>
    <circle cx="980" cy="720" r="6"/>
    <circle cx="480" cy="230" r="5" stroke-opacity="0.25"/>
    <circle cx="1180" cy="150" r="5" stroke-opacity="0.25"/>
    <circle cx="420" cy="670" r="5" stroke-opacity="0.25"/>
    <circle cx="1200" cy="690" r="5" stroke-opacity="0.25"/>
  </g>
  <g fill="#00a0e5" opacity="0.35">
    <circle cx="720" cy="180" r="2.5"/>
    <circle cx="960" cy="160" r="2.5"/>
    <circle cx="620" cy="620" r="2.5"/>
    <circle cx="980" cy="720" r="2.5"/>
  </g>

  <g fill="#7fd4f5" opacity="0.2">
    <circle cx="200" cy="400" r="1.8"/><circle cx="1420" cy="420" r="1.8"/>
    <circle cx="320" cy="80" r="1.8"/><circle cx="1250" cy="770" r="1.8"/>
  </g>
</svg>
