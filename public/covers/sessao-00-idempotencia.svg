<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- duas tentativas entram, uma só grava (zona segura x 450-1200 / y 260-540) -->
  <g stroke="#00a0e5" stroke-width="10" stroke-linecap="round">
    <path d="M480 350 H680"/>
  </g>
  <path d="M722 350 l-30 -18 v36 Z" fill="#00a0e5"/>
  <g stroke="#7fd4f5" stroke-width="9" stroke-linecap="round" stroke-dasharray="20 16" opacity="0.75">
    <path d="M480 450 H680"/>
  </g>
  <path d="M722 450 l-30 -18 v36 Z" fill="#7fd4f5" opacity="0.75"/>

  <!-- caixa 1x -->
  <rect x="740" y="300" width="200" height="200" rx="28" fill="#032c42" stroke="#00a0e5" stroke-width="10"/>
  <text x="840" y="432" font-family="ui-monospace, Menlo, monospace" font-size="92" font-weight="800" fill="#7fd4f5" text-anchor="middle">1×</text>

  <!-- só uma sai, confirmada -->
  <path d="M958 400 H1050" stroke="#00a0e5" stroke-width="10" stroke-linecap="round"/>
  <path d="M1092 400 l-30 -18 v36 Z" fill="#00a0e5"/>
  <circle cx="1150" cy="400" r="52" fill="#0a2a1c" stroke="#2e9e5b" stroke-width="9"/>
  <path d="M1126 400 l16 18 l32 -38" fill="none" stroke="#7fe0a8" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1300" cy="290" r="2"/>
    <circle cx="1380" cy="500" r="2.5"/><circle cx="300" cy="510" r="2"/>
  </g>
</svg>
