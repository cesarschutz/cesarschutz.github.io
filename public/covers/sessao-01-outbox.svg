<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- banco com outbox → relay → efeito externo (zona segura x 450-1200 / y 260-540) -->
  <!-- cilindro do banco -->
  <g fill="#032c42" stroke="#00a0e5" stroke-width="9">
    <path d="M520 310 v190 a110 34 0 0 0 220 0 v-190"/>
    <ellipse cx="630" cy="310" rx="110" ry="34"/>
  </g>
  <!-- envelope (outbox) dentro do banco -->
  <g>
    <rect x="575" y="390" width="110" height="74" rx="10" fill="#04283d" stroke="#7fd4f5" stroke-width="7"/>
    <path d="M575 396 l55 40 l55 -40" fill="none" stroke="#7fd4f5" stroke-width="7" stroke-linejoin="round"/>
  </g>

  <!-- relay: seta tracejada -->
  <path d="M770 400 H960" stroke="#7fd4f5" stroke-width="9" stroke-linecap="round" stroke-dasharray="22 18"/>
  <path d="M1002 400 l-30 -18 v36 Z" fill="#7fd4f5"/>

  <!-- nuvem (efeito externo) -->
  <path d="M1060 470 a52 52 0 0 1 6 -103 a72 72 0 0 1 138 -18 a58 58 0 0 1 24 121 Z"
        fill="#032c42" stroke="#00a0e5" stroke-width="9" stroke-linejoin="round"/>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1330" cy="300" r="2"/>
    <circle cx="1380" cy="500" r="2.5"/><circle cx="300" cy="510" r="2"/>
  </g>
</svg>
