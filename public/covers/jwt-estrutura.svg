<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- três blocos do token (faixa segura y 260-540) -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="76" font-weight="800" text-anchor="middle">
    <rect x="505" y="290" width="170" height="170" rx="22" fill="#032c42" stroke="#00a0e5" stroke-width="9"/>
    <text x="590" y="402" fill="#00a0e5">H</text>

    <text x="712" y="410" fill="#7fd4f5" font-size="96">.</text>

    <rect x="750" y="290" width="170" height="170" rx="22" fill="#0a2a1c" stroke="#2e9e5b" stroke-width="9"/>
    <text x="835" y="402" fill="#7fe0a8">P</text>

    <text x="957" y="410" fill="#7fd4f5" font-size="96">.</text>

    <rect x="995" y="290" width="170" height="170" rx="22" fill="#2b1a08" stroke="#e07a1f" stroke-width="9"/>
    <text x="1080" y="402" fill="#f5b878">S</text>
  </g>
  <text x="800" y="535" font-family="ui-monospace, Menlo, monospace" font-size="40" font-weight="700" fill="#7fd4f5" opacity="0.85" text-anchor="middle">JWT</text>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1300" cy="300" r="2"/>
    <circle cx="1380" cy="500" r="2.5"/><circle cx="280" cy="500" r="2"/>
  </g>
</svg>
