<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="seta" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#00a0e5"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="420" rx="620" ry="330" fill="url(#glow)"/>

  <!-- embrulho do proxy (camada externa sendo aberta) -->
  <g>
    <rect x="220" y="250" width="560" height="300" rx="24" fill="#032c42" stroke="#00a0e5" stroke-width="6" stroke-dasharray="18 10"/>
    <text x="500" y="330" font-family="ui-monospace, monospace" font-size="30" fill="#7fd4f5" opacity="0.8" text-anchor="middle">MeuServico$$SpringCGLIB$$0</text>
    <rect x="330" y="380" width="340" height="110" rx="16" fill="#00577e" stroke="#7fd4f5" stroke-width="4"/>
    <text x="500" y="447" font-family="ui-monospace, monospace" font-size="34" fill="#ffffff" text-anchor="middle">MeuServico</text>
  </g>

  <!-- seta com o utilitário -->
  <path d="M800 400 H960" stroke="#00a0e5" stroke-width="6" marker-end="url(#seta)"/>
  <text x="880" y="360" font-family="ui-monospace, monospace" font-size="26" fill="#7fd4f5" text-anchor="middle">getTargetClass()</text>

  <!-- classe real revelada -->
  <g>
    <rect x="1000" y="330" width="400" height="140" rx="20" fill="#032c42" stroke="#00a0e5" stroke-width="6"/>
    <text x="1200" y="395" font-family="ui-monospace, monospace" font-size="38" fill="#00a0e5" text-anchor="middle">MeuServico</text>
    <text x="1200" y="440" font-family="-apple-system, sans-serif" font-size="26" fill="#7fd4f5" opacity="0.75" text-anchor="middle">a classe real</text>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="240" cy="150" r="2.5"/><circle cx="900" cy="120" r="2"/>
    <circle cx="1460" cy="660" r="2.5"/><circle cx="1520" cy="200" r="2"/>
    <circle cx="140" cy="680" r="2.5"/><circle cx="700" cy="700" r="2"/>
  </g>
</svg>
