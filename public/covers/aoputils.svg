<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- casca do proxy sendo aberta (faixa segura y 260-540) -->
  <g fill="none" stroke="#00a0e5" stroke-linecap="round">
    <path d="M490 290 a140 140 0 0 0 0 220" stroke-width="12" stroke-dasharray="28 20"/>
    <path d="M565 270 a165 165 0 0 0 0 260" stroke-width="10" stroke-dasharray="22 18" opacity="0.55"/>
  </g>

  <!-- seta de desembrulho -->
  <path d="M625 400 H770" stroke="#7fd4f5" stroke-width="11" stroke-linecap="round"/>
  <path d="M812 400 l-30 -18 v36 Z" fill="#7fd4f5"/>

  <!-- objeto alvo revelado -->
  <rect x="845" y="295" width="280" height="210" rx="26" fill="#0a2a1c" stroke="#2e9e5b" stroke-width="10"/>
  <g stroke="#7fe0a8" stroke-width="11" stroke-linecap="round" opacity="0.9">
    <path d="M898 365 H1072"/>
    <path d="M898 437 H1008"/>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1300" cy="300" r="2"/>
    <circle cx="1380" cy="500" r="2.5"/><circle cx="300" cy="500" r="2"/>
  </g>
</svg>
