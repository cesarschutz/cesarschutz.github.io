<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- xícara de café acima da linha (faixa segura y 260-540) -->
  <g stroke="#7fd4f5" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M737 268 h126 v52 a63 63 0 0 1 -126 0 Z" fill="#032c42"/>
    <path d="M863 280 h30 a27 27 0 0 1 0 54 h-34"/>
  </g>

  <!-- linha do tempo com marcos LTS -->
  <path d="M480 445 H1120" stroke="#00a0e5" stroke-width="9" stroke-linecap="round"/>
  <g font-family="ui-monospace, Menlo, monospace" font-weight="800" text-anchor="middle">
    <circle cx="540" cy="445" r="40" fill="#032c42" stroke="#00a0e5" stroke-width="8"/>
    <text x="540" y="461" font-size="42" fill="#7fd4f5">8</text>

    <circle cx="705" cy="445" r="40" fill="#032c42" stroke="#00a0e5" stroke-width="8"/>
    <text x="705" y="461" font-size="42" fill="#7fd4f5">11</text>

    <circle cx="870" cy="445" r="40" fill="#032c42" stroke="#00a0e5" stroke-width="8"/>
    <text x="870" y="461" font-size="42" fill="#7fd4f5">17</text>

    <circle cx="1040" cy="445" r="48" fill="#00a0e5"/>
    <text x="1040" y="463" font-size="48" fill="#01131b">21</text>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1300" cy="300" r="2"/>
    <circle cx="1380" cy="510" r="2.5"/><circle cx="300" cy="510" r="2"/>
  </g>
</svg>
