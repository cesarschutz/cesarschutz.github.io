<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="seta" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#00a0e5"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="430" rx="640" ry="330" fill="url(#glow)"/>

  <!-- trilha de versões LTS -->
  <path d="M200 560 C420 560 420 300 640 300 S860 560 1080 560 1300 300 1440 300"
        fill="none" stroke="#00a0e5" stroke-width="6" stroke-opacity="0.55"
        stroke-dasharray="2 14" stroke-linecap="round" marker-end="url(#seta)"/>

  <g font-family="-apple-system, 'Segoe UI', sans-serif" font-weight="800" text-anchor="middle">
    <g>
      <circle cx="200" cy="560" r="56" fill="#032c42" stroke="#00a0e5" stroke-width="5"/>
      <text x="200" y="582" font-size="56" fill="#7fd4f5">8</text>
    </g>
    <g>
      <circle cx="640" cy="300" r="56" fill="#032c42" stroke="#00a0e5" stroke-width="5"/>
      <text x="640" y="322" font-size="56" fill="#7fd4f5">11</text>
    </g>
    <g>
      <circle cx="1080" cy="560" r="56" fill="#032c42" stroke="#00a0e5" stroke-width="5"/>
      <text x="1080" y="582" font-size="56" fill="#7fd4f5">17</text>
    </g>
    <g>
      <circle cx="1440" cy="300" r="64" fill="#00577e" stroke="#00a0e5" stroke-width="6"/>
      <text x="1440" y="324" font-size="60" fill="#ffffff">21</text>
    </g>
    <text x="330" y="240" font-size="40" fill="#7fd4f5" opacity="0.5">25 →</text>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="300" cy="140" r="2.5"/><circle cx="900" cy="110" r="2"/>
    <circle cx="1250" cy="150" r="2.5"/><circle cx="1500" cy="620" r="2"/>
    <circle cx="700" cy="700" r="2.5"/><circle cx="150" cy="330" r="2"/>
  </g>
</svg>
