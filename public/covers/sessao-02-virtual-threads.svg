<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="420" rx="620" ry="330" fill="url(#glow)"/>

  <!-- muitas virtual threads (fios finos) -->
  <g stroke="#7fd4f5" stroke-width="3" fill="none" stroke-opacity="0.65">
    <path d="M180 180 C440 180 520 300 760 306"/>
    <path d="M160 250 C420 250 540 316 760 322"/>
    <path d="M190 330 C430 330 560 334 760 338"/>
    <path d="M170 420 C430 420 560 352 760 354"/>
    <path d="M180 500 C440 500 540 370 760 370"/>
    <path d="M160 580 C430 580 550 388 760 386"/>
    <path d="M190 650 C450 650 560 404 760 402"/>
  </g>

  <!-- poucas carriers (trilhos grossos) -->
  <g stroke="#00a0e5" stroke-width="14" stroke-linecap="round">
    <path d="M780 320 H1280"/>
    <path d="M780 370 H1280"/>
    <path d="M780 420 H1180" stroke-opacity="0.45"/>
  </g>
  <text x="1030" y="290" font-family="-apple-system, sans-serif" font-size="32" fill="#7fd4f5" opacity="0.7" text-anchor="middle">carriers</text>

  <!-- alfinete pregando um trilho -->
  <g>
    <path d="M1180 420 l70 -110" stroke="#d9534f" stroke-width="8" stroke-linecap="round"/>
    <circle cx="1262" cy="292" r="34" fill="#d9534f"/>
    <circle cx="1250" cy="280" r="10" fill="#ffffff" fill-opacity="0.55"/>
  </g>
  <text x="1330" y="470" font-family="ui-monospace, monospace" font-size="36" fill="#d9534f" text-anchor="middle" opacity="0.9">pinned</text>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="300" cy="120" r="2.5"/><circle cx="900" cy="130" r="2"/>
    <circle cx="1400" cy="160" r="2.5"/><circle cx="1500" cy="640" r="2"/>
    <circle cx="500" cy="720" r="2.5"/><circle cx="140" cy="710" r="2"/>
  </g>
</svg>
