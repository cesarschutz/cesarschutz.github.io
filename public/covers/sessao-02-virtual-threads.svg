<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- virtual threads finas convergindo para carriers grossos; um carrier pinado
       (zona segura x 450-1200 / y 260-540) -->
  <g stroke="#7fd4f5" stroke-width="5" stroke-linecap="round" opacity="0.6">
    <path d="M470 280 H640"/>
    <path d="M500 328 H670"/>
    <path d="M470 376 H640"/>
    <path d="M500 424 H670"/>
    <path d="M470 472 H640"/>
    <path d="M500 520 H670"/>
  </g>
  <g stroke="#7fd4f5" stroke-width="3.5" opacity="0.45" fill="none">
    <path d="M640 285 C740 285 740 330 810 330"/>
    <path d="M670 335 C750 335 750 332 810 332"/>
    <path d="M640 380 C740 380 740 398 810 398"/>
    <path d="M670 428 C750 428 750 402 810 402"/>
    <path d="M640 476 C740 476 740 466 810 466"/>
    <path d="M670 524 C750 524 750 470 810 470"/>
  </g>

  <!-- carriers -->
  <g stroke="#00a0e5" stroke-width="20" stroke-linecap="round">
    <path d="M815 331 H1130"/>
    <path d="M815 400 H1130"/>
    <path d="M815 468 H1130"/>
  </g>

  <!-- alfinete vermelho pinando o carrier do meio -->
  <g>
    <path d="M1090 400 L1042 340" stroke="#d9534f" stroke-width="9" stroke-linecap="round"/>
    <circle cx="1032" cy="327" r="26" fill="#d9534f"/>
    <circle cx="1024" cy="319" r="8" fill="#e08a86"/>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1300" cy="290" r="2"/>
    <circle cx="1380" cy="500" r="2.5"/><circle cx="300" cy="510" r="2"/>
  </g>
</svg>
