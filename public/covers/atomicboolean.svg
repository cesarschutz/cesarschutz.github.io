<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="seta" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#00a0e5"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="420" rx="620" ry="330" fill="url(#glow)"/>

  <!-- interruptor central -->
  <g>
    <rect x="640" y="330" width="320" height="140" rx="70" fill="#032c42" stroke="#00a0e5" stroke-width="6"/>
    <circle cx="880" cy="400" r="54" fill="#00a0e5"/>
    <text x="720" y="415" font-family="ui-monospace, monospace" font-size="34" fill="#7fd4f5">true</text>
  </g>
  <text x="800" y="540" font-family="ui-monospace, monospace" font-size="30" fill="#7fd4f5" opacity="0.85" text-anchor="middle">AtomicBoolean stopping</text>

  <!-- thread do hook -->
  <g>
    <rect x="150" y="200" width="330" height="100" rx="18" fill="#032c42" stroke="#00a0e5" stroke-width="5"/>
    <text x="315" y="245" font-family="-apple-system, sans-serif" font-size="28" fill="#7fd4f5" text-anchor="middle">shutdown hook</text>
    <text x="315" y="283" font-family="ui-monospace, monospace" font-size="24" fill="#7fd4f5" opacity="0.7" text-anchor="middle">SIGTERM → set(true)</text>
  </g>
  <path d="M490 280 C560 320 590 350 630 375" fill="none" stroke="#00a0e5" stroke-width="5" marker-end="url(#seta)"/>

  <!-- thread do job -->
  <g>
    <rect x="1120" y="500" width="330" height="100" rx="18" fill="#032c42" stroke="#00a0e5" stroke-width="5"/>
    <text x="1285" y="545" font-family="-apple-system, sans-serif" font-size="28" fill="#7fd4f5" text-anchor="middle">loop do job</text>
    <text x="1285" y="583" font-family="ui-monospace, monospace" font-size="24" fill="#7fd4f5" opacity="0.7" text-anchor="middle">while (!get()) …</text>
  </g>
  <path d="M1110 520 C1040 480 1010 450 972 425" fill="none" stroke="#00a0e5" stroke-width="5" marker-end="url(#seta)"/>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="240" cy="620" r="2.5"/><circle cx="900" cy="120" r="2"/>
    <circle cx="1460" cy="240" r="2.5"/><circle cx="1520" cy="680" r="2"/>
    <circle cx="140" cy="450" r="2.5"/><circle cx="600" cy="700" r="2"/>
  </g>
</svg>
