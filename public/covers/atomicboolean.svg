<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- interruptor gigante (faixa segura y 260-540) -->
  <g>
    <rect x="560" y="290" width="480" height="170" rx="85" fill="#032c42" stroke="#00a0e5" stroke-width="10"/>
    <circle cx="948" cy="375" r="66" fill="#00a0e5"/>
    <text x="716" y="396" font-family="ui-monospace, Menlo, monospace" font-size="56" font-weight="800" fill="#7fd4f5" text-anchor="middle">true</text>
  </g>
  <text x="800" y="530" font-family="ui-monospace, Menlo, monospace" font-size="40" font-weight="700" fill="#7fd4f5" opacity="0.85" text-anchor="middle">AtomicBoolean</text>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1280" cy="300" r="2"/>
    <circle cx="1360" cy="500" r="2.5"/><circle cx="280" cy="500" r="2"/>
  </g>
</svg>
