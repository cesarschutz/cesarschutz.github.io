<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="seta" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#00a0e5"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="420" rx="620" ry="330" fill="url(#glow)"/>

  <!-- linha de texto livre -->
  <g>
    <rect x="140" y="330" width="520" height="140" rx="16" fill="#032c42" stroke="#7fd4f5" stroke-opacity="0.5" stroke-width="4"/>
    <text x="180" y="390" font-family="ui-monospace, monospace" font-size="26" fill="#7fd4f5" opacity="0.75">INFO Pedido 789 processado</text>
    <text x="180" y="430" font-family="ui-monospace, monospace" font-size="26" fill="#7fd4f5" opacity="0.75">para user 42 em 152ms</text>
  </g>
  <text x="400" y="540" font-family="-apple-system, sans-serif" font-size="28" fill="#7fd4f5" opacity="0.6" text-anchor="middle">texto livre + regex</text>

  <path d="M700 400 H800" stroke="#00a0e5" stroke-width="6" marker-end="url(#seta)"/>

  <!-- JSON estruturado -->
  <g>
    <rect x="860" y="240" width="580" height="330" rx="18" fill="#032c42" stroke="#00a0e5" stroke-width="6"/>
    <g font-family="ui-monospace, monospace" font-size="28">
      <text x="900" y="305" fill="#7fd4f5">{</text>
      <text x="940" y="350" fill="#00a0e5">"level"<tspan fill="#7fd4f5">: "INFO",</tspan></text>
      <text x="940" y="395" fill="#00a0e5">"orderId"<tspan fill="#7fd4f5">: 789,</tspan></text>
      <text x="940" y="440" fill="#00a0e5">"userId"<tspan fill="#7fd4f5">: "42",</tspan></text>
      <text x="940" y="485" fill="#00a0e5">"latencyMs"<tspan fill="#7fd4f5">: 152</tspan></text>
      <text x="900" y="535" fill="#7fd4f5">}</text>
    </g>
  </g>
  <text x="1150" y="640" font-family="-apple-system, sans-serif" font-size="28" fill="#7fd4f5" opacity="0.8" text-anchor="middle">campos indexados</text>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="240" cy="150" r="2.5"/><circle cx="900" cy="120" r="2"/>
    <circle cx="1460" cy="660" r="2.5"/><circle cx="1520" cy="200" r="2"/>
    <circle cx="140" cy="680" r="2.5"/><circle cx="700" cy="710" r="2"/>
  </g>
</svg>
