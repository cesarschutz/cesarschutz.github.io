<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- funil (faixa segura y 260-540): mensagens dentro, só uma sai -->
  <path d="M580 280 H1020 L880 430 V480 L720 480 V430 Z"
        fill="#032c42" stroke="#00a0e5" stroke-width="10" stroke-linejoin="round"/>

  <!-- mensagens caindo dentro do funil -->
  <g>
    <circle cx="700" cy="330" r="20" fill="#7fd4f5" opacity="0.55"/>
    <circle cx="800" cy="315" r="20" fill="#00a0e5"/>
    <circle cx="900" cy="330" r="20" fill="#7fd4f5" opacity="0.55"/>
    <circle cx="800" cy="395" r="20" fill="#00a0e5"/>
  </g>

  <!-- só uma sai embaixo -->
  <circle cx="800" cy="535" r="24" fill="#00a0e5"/>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1280" cy="300" r="2"/>
    <circle cx="1360" cy="500" r="2.5"/><circle cx="280" cy="500" r="2"/>
  </g>
</svg>
