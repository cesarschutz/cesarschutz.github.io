<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="seta" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#00a0e5"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="420" rx="620" ry="330" fill="url(#glow)"/>

  <!-- tópico SNS -->
  <g>
    <circle cx="360" cy="400" r="90" fill="#00577e" stroke="#00a0e5" stroke-width="6"/>
    <text x="360" y="412" font-family="-apple-system, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">SNS</text>
  </g>

  <!-- mensagens saindo -->
  <g fill="#7fd4f5">
    <circle cx="520" cy="330" r="10"/>
    <circle cx="560" cy="400" r="10"/>
    <circle cx="520" cy="470" r="10" fill="#d9534f"/>
  </g>

  <!-- funil de filtro -->
  <g>
    <path d="M660 260 L840 360 V440 L660 540 Z" fill="#032c42" stroke="#00a0e5" stroke-width="5"/>
    <text x="730" y="412" font-family="ui-monospace, monospace" font-size="30" fill="#7fd4f5" text-anchor="middle">filter</text>
  </g>

  <!-- filas -->
  <g font-family="ui-monospace, monospace" font-size="28" text-anchor="middle">
    <g>
      <rect x="1000" y="260" width="300" height="90" rx="16" fill="#032c42" stroke="#00a0e5" stroke-width="5"/>
      <text x="1150" y="315" fill="#7fd4f5">SQS · tipo A</text>
    </g>
    <g>
      <rect x="1000" y="450" width="300" height="90" rx="16" fill="#032c42" stroke="#00a0e5" stroke-width="5"/>
      <text x="1150" y="505" fill="#7fd4f5">SQS · tipo B</text>
    </g>
  </g>

  <g stroke="#00a0e5" stroke-width="5" fill="none">
    <path d="M845 380 C920 340 930 305 990 305" marker-end="url(#seta)"/>
    <path d="M845 420 C920 460 930 495 990 495" marker-end="url(#seta)"/>
  </g>

  <!-- mensagem barrada -->
  <g>
    <circle cx="720" cy="620" r="12" fill="#d9534f"/>
    <path d="M700 600 l40 40 M740 600 l-40 40" stroke="#d9534f" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="240" cy="160" r="2.5"/><circle cx="900" cy="120" r="2"/>
    <circle cx="1420" cy="640" r="2.5"/><circle cx="1500" cy="200" r="2"/>
    <circle cx="180" cy="660" r="2.5"/><circle cx="600" cy="710" r="2"/>
  </g>
</svg>
