<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="420" rx="620" ry="330" fill="url(#glow)"/>

  <!-- livro-razão: duas colunas (débito | crédito) -->
  <g>
    <rect x="480" y="200" width="640" height="420" rx="20" fill="#032c42" stroke="#00a0e5" stroke-width="5"/>
    <line x1="800" y1="200" x2="800" y2="620" stroke="#00a0e5" stroke-width="4" stroke-opacity="0.7"/>
    <line x1="480" y1="290" x2="1120" y2="290" stroke="#00a0e5" stroke-width="3" stroke-opacity="0.5"/>
    <text x="640" y="258" font-family="ui-monospace, monospace" font-size="38" fill="#7fd4f5" text-anchor="middle">DÉBITO</text>
    <text x="960" y="258" font-family="ui-monospace, monospace" font-size="38" fill="#7fd4f5" text-anchor="middle">CRÉDITO</text>
    <!-- linhas de lançamento imutáveis -->
    <g stroke="#7fd4f5" stroke-width="6" stroke-linecap="round" stroke-opacity="0.55">
      <line x1="530" y1="340" x2="760" y2="340"/>
      <line x1="840" y1="340" x2="1000" y2="340"/>
      <line x1="530" y1="400" x2="700" y2="400"/>
      <line x1="840" y1="400" x2="1070" y2="400"/>
      <line x1="530" y1="460" x2="740" y2="460"/>
      <line x1="840" y1="460" x2="1030" y2="460"/>
    </g>
    <!-- soma fecha -->
    <line x1="510" y1="530" x2="1090" y2="530" stroke="#00a0e5" stroke-width="3" stroke-dasharray="10 8" stroke-opacity="0.6"/>
    <text x="640" y="585" font-family="ui-monospace, monospace" font-size="40" font-weight="700" fill="#00a0e5" text-anchor="middle">Σ = X</text>
    <text x="960" y="585" font-family="ui-monospace, monospace" font-size="40" font-weight="700" fill="#00a0e5" text-anchor="middle">Σ = X</text>
  </g>

  <!-- cadeia append-only à esquerda -->
  <g stroke="#7fd4f5" stroke-opacity="0.6" stroke-width="4" fill="#032c42">
    <rect x="200" y="290" width="140" height="64" rx="12"/>
    <rect x="200" y="384" width="140" height="64" rx="12"/>
    <rect x="200" y="478" width="140" height="64" rx="12" stroke="#00a0e5" stroke-opacity="1"/>
    <path d="M270 354 v30 M270 448 v30" stroke-linecap="round"/>
  </g>
  <text x="270" y="586" font-family="ui-monospace, monospace" font-size="26" fill="#7fd4f5" opacity="0.7" text-anchor="middle">append-only</text>

  <!-- seta da cadeia para o livro -->
  <path d="M350 416 H460" stroke="#00a0e5" stroke-width="4" stroke-dasharray="8 8" stroke-opacity="0.6"/>

  <!-- selo de equilíbrio à direita -->
  <g>
    <circle cx="1310" cy="410" r="110" fill="#032c42" stroke="#00a0e5" stroke-width="5"/>
    <text x="1310" y="395" font-family="ui-monospace, monospace" font-size="44" font-weight="700" fill="#00a0e5" text-anchor="middle">Δ = 0</text>
    <text x="1310" y="450" font-family="-apple-system, sans-serif" font-size="26" fill="#7fd4f5" opacity="0.8" text-anchor="middle">sem drift</text>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="300" cy="150" r="2.5"/><circle cx="900" cy="120" r="2"/>
    <circle cx="1400" cy="160" r="2.5"/><circle cx="1500" cy="640" r="2"/>
    <circle cx="200" cy="700" r="2.5"/><circle cx="1200" cy="710" r="2"/>
  </g>
</svg>
