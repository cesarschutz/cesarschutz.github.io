<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- livro-razão: duas colunas (débito | crédito) — zona segura x 450-1200 / y 260-540 -->
  <g>
    <rect x="560" y="268" width="480" height="266" rx="18" fill="#032c42" stroke="#00a0e5" stroke-width="6"/>
    <line x1="800" y1="268" x2="800" y2="534" stroke="#00a0e5" stroke-width="4" stroke-opacity="0.7"/>
    <line x1="560" y1="332" x2="1040" y2="332" stroke="#00a0e5" stroke-width="3" stroke-opacity="0.5"/>
    <text x="680" y="312" font-family="ui-monospace, monospace" font-size="30" fill="#7fd4f5" text-anchor="middle">DÉBITO</text>
    <text x="920" y="312" font-family="ui-monospace, monospace" font-size="30" fill="#7fd4f5" text-anchor="middle">CRÉDITO</text>
    <!-- lançamentos imutáveis -->
    <g stroke="#7fd4f5" stroke-width="6" stroke-linecap="round" stroke-opacity="0.55">
      <line x1="600" y1="368" x2="760" y2="368"/>
      <line x1="840" y1="368" x2="960" y2="368"/>
      <line x1="600" y1="410" x2="720" y2="410"/>
      <line x1="840" y1="410" x2="1000" y2="410"/>
      <line x1="600" y1="452" x2="750" y2="452"/>
      <line x1="840" y1="452" x2="975" y2="452"/>
    </g>
    <!-- soma fecha -->
    <line x1="585" y1="480" x2="1015" y2="480" stroke="#00a0e5" stroke-width="3" stroke-dasharray="10 8" stroke-opacity="0.6"/>
    <text x="680" y="518" font-family="ui-monospace, monospace" font-size="32" font-weight="700" fill="#00a0e5" text-anchor="middle">Σ = X</text>
    <text x="920" y="518" font-family="ui-monospace, monospace" font-size="32" font-weight="700" fill="#00a0e5" text-anchor="middle">Σ = X</text>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1300" cy="300" r="2"/>
    <circle cx="1380" cy="500" r="2.5"/><circle cx="300" cy="500" r="2"/>
  </g>
</svg>
