<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- selo SIGTERM (motivo dentro da faixa segura y 260-540) -->
  <g>
    <circle cx="655" cy="400" r="135" fill="#032c42" stroke="#00a0e5" stroke-width="10"/>
    <text x="655" y="390" font-family="ui-monospace, Menlo, monospace" font-size="88" font-weight="800" fill="#00a0e5" text-anchor="middle">15</text>
    <text x="655" y="455" font-family="ui-monospace, Menlo, monospace" font-size="34" font-weight="700" fill="#7fd4f5" text-anchor="middle">SIGTERM</text>
  </g>

  <!-- selo SIGKILL, sobreposto -->
  <g>
    <circle cx="965" cy="415" r="118" fill="#2a1215" stroke="#d9534f" stroke-width="10"/>
    <text x="965" y="408" font-family="ui-monospace, Menlo, monospace" font-size="76" font-weight="800" fill="#d9534f" text-anchor="middle">9</text>
    <text x="965" y="466" font-family="ui-monospace, Menlo, monospace" font-size="30" font-weight="700" fill="#e08a86" text-anchor="middle">SIGKILL</text>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1280" cy="300" r="2"/>
    <circle cx="1360" cy="500" r="2.5"/><circle cx="280" cy="500" r="2"/>
  </g>
</svg>
