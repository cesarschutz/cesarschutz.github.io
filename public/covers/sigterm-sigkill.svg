<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="setaAzul" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#00a0e5"/>
    </marker>
    <marker id="setaVermelha" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#d9534f"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="420" rx="620" ry="330" fill="url(#glow)"/>

  <!-- kubelet -->
  <g>
    <rect x="180" y="330" width="280" height="140" rx="20" fill="#032c42" stroke="#00a0e5" stroke-width="5"/>
    <text x="320" y="410" font-family="ui-monospace, monospace" font-size="34" fill="#7fd4f5" text-anchor="middle">kubelet</text>
  </g>

  <!-- pod -->
  <g>
    <rect x="1060" y="280" width="360" height="240" rx="24" fill="#032c42" stroke="#00a0e5" stroke-width="6"/>
    <text x="1240" y="360" font-family="-apple-system, sans-serif" font-size="36" fill="#ffffff" text-anchor="middle">pod</text>
    <rect x="1120" y="400" width="240" height="70" rx="14" fill="#00577e" stroke="#7fd4f5" stroke-width="3"/>
    <text x="1240" y="447" font-family="ui-monospace, monospace" font-size="28" fill="#ffffff" text-anchor="middle">java · PID 1</text>
  </g>

  <!-- SIGTERM educado -->
  <path d="M470 370 C700 340 830 340 1040 360" fill="none" stroke="#00a0e5" stroke-width="6" marker-end="url(#setaAzul)"/>
  <g font-family="ui-monospace, monospace" text-anchor="middle">
    <rect x="620" y="270" width="280" height="56" rx="28" fill="#00577e" stroke="#00a0e5" stroke-width="3"/>
    <text x="760" y="307" font-size="30" fill="#ffffff">SIGTERM (15)</text>
    <text x="760" y="245" font-size="24" fill="#7fd4f5" opacity="0.75">"pode encerrar com calma"</text>
  </g>

  <!-- relógio do grace period -->
  <g>
    <circle cx="760" cy="480" r="52" fill="#032c42" stroke="#7fd4f5" stroke-width="4"/>
    <path d="M760 480 V445 M760 480 L788 495" stroke="#7fd4f5" stroke-width="5" stroke-linecap="round"/>
    <text x="760" y="580" font-family="ui-monospace, monospace" font-size="24" fill="#7fd4f5" opacity="0.75" text-anchor="middle">grace period 30s</text>
  </g>

  <!-- SIGKILL -->
  <path d="M470 440 C640 560 880 620 1090 520" fill="none" stroke="#d9534f" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#setaVermelha)"/>
  <g font-family="ui-monospace, monospace" text-anchor="middle">
    <rect x="560" y="640" width="270" height="56" rx="28" fill="#3a1518" stroke="#d9534f" stroke-width="3"/>
    <text x="695" y="677" font-size="30" fill="#d9534f">SIGKILL (9)</text>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="240" cy="150" r="2.5"/><circle cx="900" cy="120" r="2"/>
    <circle cx="1480" cy="660" r="2.5"/><circle cx="1520" cy="200" r="2"/>
    <circle cx="140" cy="680" r="2.5"/><circle cx="500" cy="180" r="2"/>
  </g>
</svg>
