<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- três trilhos de classpath (faixa segura y 260-540) -->
  <g font-family="ui-monospace, Menlo, monospace" font-weight="700" text-anchor="middle">
    <rect x="520" y="272" width="560" height="80" rx="40" fill="#032c42" stroke="#00a0e5" stroke-width="8"/>
    <text x="800" y="325" font-size="40" fill="#7fd4f5">compileOnly</text>

    <rect x="565" y="370" width="470" height="80" rx="40" fill="#0a2a1c" stroke="#2e9e5b" stroke-width="8"/>
    <text x="800" y="423" font-size="40" fill="#7fe0a8">runtimeOnly</text>

    <rect x="475" y="468" width="650" height="80" rx="40" fill="#2b1a08" stroke="#e07a1f" stroke-width="8"/>
    <text x="800" y="521" font-size="40" fill="#f5b878">implementation</text>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1280" cy="300" r="2"/>
    <circle cx="1360" cy="500" r="2.5"/><circle cx="280" cy="500" r="2"/>
  </g>
</svg>
