<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="seta" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#00a0e5"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="420" rx="620" ry="330" fill="url(#glow)"/>

  <!-- pacote de dependência -->
  <g>
    <rect x="200" y="330" width="260" height="140" rx="20" fill="#032c42" stroke="#00a0e5" stroke-width="6"/>
    <path d="M200 380 h260 M330 330 v50" stroke="#00a0e5" stroke-width="4" stroke-opacity="0.6"/>
    <text x="330" y="440" font-family="ui-monospace, monospace" font-size="30" fill="#7fd4f5" text-anchor="middle">lib.jar</text>
  </g>

  <!-- três trilhas -->
  <g stroke="#00a0e5" stroke-width="5" fill="none">
    <path d="M470 370 C620 300 700 250 830 235" marker-end="url(#seta)"/>
    <path d="M470 400 H830" marker-end="url(#seta)"/>
    <path d="M470 430 C620 500 700 550 830 565" marker-end="url(#seta)"/>
  </g>

  <!-- classpaths -->
  <g font-family="ui-monospace, monospace" text-anchor="middle">
    <g>
      <rect x="860" y="180" width="540" height="100" rx="18" fill="#032c42" stroke="#00a0e5" stroke-width="5"/>
      <text x="1130" y="222" font-size="30" fill="#00a0e5">compileOnly</text>
      <text x="1130" y="258" font-size="24" fill="#7fd4f5" opacity="0.75">compila · NÃO vai pro runtime</text>
    </g>
    <g>
      <rect x="860" y="350" width="540" height="100" rx="18" fill="#032c42" stroke="#00a0e5" stroke-width="5"/>
      <text x="1130" y="392" font-size="30" fill="#00a0e5">annotationProcessor</text>
      <text x="1130" y="428" font-size="24" fill="#7fd4f5" opacity="0.75">ferramenta do build · gera metadados</text>
    </g>
    <g>
      <rect x="860" y="520" width="540" height="100" rx="18" fill="#032c42" stroke="#00a0e5" stroke-width="5"/>
      <text x="1130" y="562" font-size="30" fill="#00a0e5">testImplementation</text>
      <text x="1130" y="598" font-size="24" fill="#7fd4f5" opacity="0.75">só nos testes</text>
    </g>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="240" cy="150" r="2.5"/><circle cx="700" cy="120" r="2"/>
    <circle cx="1500" cy="680" r="2.5"/><circle cx="1540" cy="120" r="2"/>
    <circle cx="140" cy="680" r="2.5"/><circle cx="600" cy="700" r="2"/>
  </g>
</svg>
