<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- relógio (faixa segura y 260-540) -->
  <g>
    <circle cx="720" cy="400" r="138" fill="#032c42" stroke="#00a0e5" stroke-width="11"/>
    <circle cx="720" cy="400" r="112" fill="none" stroke="#00a0e5" stroke-opacity="0.25" stroke-width="3"/>
    <g stroke="#7fd4f5" stroke-width="6" stroke-linecap="round" opacity="0.7">
      <path d="M720 292 V314"/><path d="M720 486 V508"/>
      <path d="M612 400 H634"/><path d="M806 400 H828"/>
    </g>
    <path d="M720 400 L720 320" stroke="#00a0e5" stroke-width="12" stroke-linecap="round"/>
    <path d="M720 400 L786 440" stroke="#7fd4f5" stroke-width="12" stroke-linecap="round"/>
    <circle cx="720" cy="400" r="13" fill="#00a0e5"/>
  </g>

  <!-- cadeado: concurrencyPolicy Forbid -->
  <g>
    <rect x="928" y="400" width="150" height="122" rx="20" fill="#032c42" stroke="#00a0e5" stroke-width="9"/>
    <path d="M962 400 V360 a41 41 0 0 1 82 0 V400" fill="none" stroke="#00a0e5" stroke-width="12" stroke-linecap="round"/>
    <circle cx="1003" cy="450" r="15" fill="#7fd4f5"/>
    <rect x="995" y="455" width="16" height="34" rx="7" fill="#7fd4f5"/>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1300" cy="300" r="2"/>
    <circle cx="1380" cy="500" r="2.5"/><circle cx="280" cy="500" r="2"/>
  </g>
</svg>
