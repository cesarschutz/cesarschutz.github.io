<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- etiqueta do trace (faixa segura y 260-540) -->
  <rect x="510" y="270" width="580" height="76" rx="38" fill="#00577e" stroke="#00a0e5" stroke-width="6"/>
  <text x="800" y="322" font-family="ui-monospace, Menlo, monospace" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">traceparent</text>

  <!-- fio contínuo com nós -->
  <path d="M490 455 C600 455 640 495 800 495 C960 495 1000 455 1110 455"
        fill="none" stroke="#00a0e5" stroke-width="9" stroke-linecap="round"/>
  <g>
    <circle cx="545" cy="458" r="27" fill="#032c42" stroke="#00a0e5" stroke-width="7"/>
    <circle cx="800" cy="495" r="27" fill="#032c42" stroke="#00a0e5" stroke-width="7"/>
    <circle cx="1055" cy="458" r="27" fill="#00a0e5"/>
  </g>
  <g stroke="#7fd4f5" stroke-opacity="0.5" stroke-width="4" stroke-dasharray="6 10">
    <path d="M640 348 V430"/><path d="M800 348 V458"/><path d="M960 348 V430"/>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1280" cy="300" r="2"/>
    <circle cx="1360" cy="510" r="2.5"/><circle cx="280" cy="510" r="2"/>
  </g>
</svg>
