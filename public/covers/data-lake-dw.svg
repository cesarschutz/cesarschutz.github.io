<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- lago: blob orgânico (dado bruto) — faixa segura y 260-540 -->
  <g transform="translate(0,25)">
    <path d="M480 380 C480 290 560 240 650 250 C700 200 800 210 830 270
             C900 260 940 320 920 380 C950 440 880 500 800 490
             C740 540 620 530 580 470 C510 460 480 430 480 380 Z"
          fill="#032c42" stroke="#00a0e5" stroke-width="9"/>
    <path d="M560 380 q40 -26 80 0 t80 0 t80 0" fill="none" stroke="#7fd4f5" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    <path d="M590 430 q40 -26 80 0 t80 0" fill="none" stroke="#7fd4f5" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- seta -->
  <path d="M950 400 H1010" stroke="#7fd4f5" stroke-width="9" stroke-linecap="round"/>
  <path d="M1032 400 l-24 -15 v30 Z" fill="#7fd4f5"/>

  <!-- warehouse: grade organizada (dado estruturado) -->
  <g>
    <rect x="1060" y="290" width="220" height="220" rx="20" fill="#032c42" stroke="#2e9e5b" stroke-width="9"/>
    <g stroke="#2e9e5b" stroke-width="5" opacity="0.85">
      <path d="M1060 363 H1280"/><path d="M1060 437 H1280"/>
      <path d="M1133 290 V510"/><path d="M1207 290 V510"/>
    </g>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1340" cy="270" r="2"/>
    <circle cx="1400" cy="520" r="2.5"/><circle cx="300" cy="520" r="2"/>
  </g>
</svg>
