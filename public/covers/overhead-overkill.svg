<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="420" rx="620" ry="330" fill="url(#glow)"/>

  <!-- problema pequeno -->
  <g>
    <circle cx="380" cy="450" r="46" fill="#032c42" stroke="#00a0e5" stroke-width="5"/>
    <text x="380" y="560" font-family="-apple-system, sans-serif" font-size="32" fill="#7fd4f5" text-anchor="middle">problema</text>
  </g>

  <!-- proporção quebrada -->
  <text x="640" y="440" font-family="ui-monospace, monospace" font-size="88" font-weight="700" fill="#d9534f" text-anchor="middle" opacity="0.9">∝?</text>

  <!-- solução gigante: pilha de engrenagens/camadas -->
  <g stroke="#00a0e5" stroke-width="5" fill="#032c42">
    <rect x="880" y="160" width="440" height="86" rx="14"/>
    <rect x="860" y="266" width="480" height="86" rx="14"/>
    <rect x="840" y="372" width="520" height="86" rx="14" fill="#00577e"/>
    <rect x="860" y="478" width="480" height="86" rx="14"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="30" fill="#7fd4f5" text-anchor="middle">
    <text x="1100" y="214">kafka</text>
    <text x="1100" y="320">event sourcing</text>
    <text x="1100" y="426" fill="#ffffff">kubernetes</text>
    <text x="1100" y="532">8 microsserviços</text>
  </g>
  <text x="1100" y="630" font-family="-apple-system, sans-serif" font-size="32" fill="#7fd4f5" text-anchor="middle">solução</text>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="240" cy="160" r="2.5"/><circle cx="760" cy="140" r="2"/>
    <circle cx="1460" cy="640" r="2.5"/><circle cx="1520" cy="200" r="2"/>
    <circle cx="180" cy="680" r="2.5"/><circle cx="660" cy="700" r="2"/>
  </g>
</svg>
