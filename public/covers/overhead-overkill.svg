<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- balança (faixa segura y 260-540): problema pequeno vs solução enorme -->
  <path d="M800 268 V540" stroke="#7fd4f5" stroke-width="10" stroke-linecap="round"/>
  <path d="M700 540 H900" stroke="#7fd4f5" stroke-width="10" stroke-linecap="round"/>
  <path d="M560 330 L1040 292" stroke="#00a0e5" stroke-width="12" stroke-linecap="round"/>
  <circle cx="800" cy="311" r="18" fill="#00a0e5"/>

  <!-- prato esquerdo: um pontinho (o problema) -->
  <g>
    <path d="M560 330 V385" stroke="#7fd4f5" stroke-width="6"/>
    <path d="M490 388 H630" stroke="#00a0e5" stroke-width="9" stroke-linecap="round"/>
    <circle cx="560" cy="368" r="15" fill="#7fd4f5"/>
  </g>

  <!-- prato direito: pilha enorme de caixas (a solução) -->
  <g>
    <path d="M1040 292 V344" stroke="#7fd4f5" stroke-width="6"/>
    <g fill="#2b1a08" stroke="#e07a1f" stroke-width="7">
      <rect x="995" y="352" width="90" height="50" rx="11"/>
      <rect x="980" y="408" width="120" height="52" rx="11"/>
      <rect x="965" y="466" width="150" height="56" rx="11"/>
    </g>
    <path d="M950 528 H1130" stroke="#e07a1f" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1300" cy="300" r="2"/>
    <circle cx="1380" cy="500" r="2.5"/><circle cx="300" cy="500" r="2"/>
  </g>
</svg>
