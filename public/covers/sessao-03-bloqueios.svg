<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="420" rx="620" ry="330" fill="url(#glow)"/>

  <!-- cadeado aberto: otimista -->
  <g>
    <path d="M380 350 v-60 a90 90 0 0 1 175 -30" fill="none" stroke="#00a0e5" stroke-width="14" stroke-linecap="round"/>
    <rect x="330" y="350" width="220" height="190" rx="28" fill="#032c42" stroke="#00a0e5" stroke-width="7"/>
    <circle cx="440" cy="430" r="22" fill="#00a0e5"/>
    <path d="M440 445 v40" stroke="#00a0e5" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g font-family="ui-monospace, monospace" text-anchor="middle">
    <rect x="350" y="590" width="180" height="54" rx="27" fill="#00577e" stroke="#00a0e5" stroke-width="3"/>
    <text x="440" y="627" font-size="32" fill="#ffffff">v1 → v2</text>
    <text x="440" y="290" font-size="34" fill="#7fd4f5" opacity="0.75">otimista</text>
  </g>

  <!-- vs -->
  <text x="800" y="460" font-family="-apple-system, sans-serif" font-size="64" font-weight="800" fill="#7fd4f5" fill-opacity="0.5" text-anchor="middle">vs</text>

  <!-- cadeado fechado: pessimista -->
  <g>
    <path d="M1060 350 v-70 a88 88 0 0 1 176 0 v70" fill="none" stroke="#00a0e5" stroke-width="14" stroke-linecap="round"/>
    <rect x="1010" y="350" width="276" height="190" rx="28" fill="#00577e" stroke="#00a0e5" stroke-width="7"/>
    <circle cx="1148" cy="430" r="22" fill="#01131b"/>
    <path d="M1148 445 v40" stroke="#01131b" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g font-family="ui-monospace, monospace" text-anchor="middle">
    <text x="1148" y="290" font-size="34" fill="#7fd4f5" opacity="0.75">pessimista</text>
    <text x="1148" y="627" font-size="32" fill="#7fd4f5">FOR UPDATE</text>
  </g>
  <!-- fila esperando a trava -->
  <g fill="#7fd4f5" opacity="0.7">
    <circle cx="1360" cy="445" r="12"/>
    <circle cx="1410" cy="445" r="10" opacity="0.7"/>
    <circle cx="1455" cy="445" r="8" opacity="0.5"/>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="280" cy="140" r="2.5"/><circle cx="860" cy="120" r="2"/>
    <circle cx="1380" cy="170" r="2.5"/><circle cx="1500" cy="620" r="2"/>
    <circle cx="620" cy="700" r="2.5"/><circle cx="150" cy="620" r="2"/>
  </g>
</svg>
