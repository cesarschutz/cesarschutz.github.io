<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- otimista (aberto) vs pessimista (fechado) — zona segura x 450-1200 / y 260-540 -->
  <!-- cadeado aberto -->
  <g>
    <path d="M565 365 V330 a60 60 0 0 1 120 0 v10" fill="none" stroke="#00a0e5" stroke-width="13" stroke-linecap="round"/>
    <rect x="540" y="365" width="170" height="140" rx="22" fill="#032c42" stroke="#00a0e5" stroke-width="10"/>
    <circle cx="625" cy="425" r="17" fill="#7fd4f5"/>
    <rect x="616" y="430" width="18" height="38" rx="8" fill="#7fd4f5"/>
  </g>

  <text x="800" y="455" font-family="ui-monospace, Menlo, monospace" font-size="58" font-weight="700" fill="#7fd4f5" opacity="0.85" text-anchor="middle">vs</text>

  <!-- cadeado fechado -->
  <g>
    <path d="M915 365 V330 a60 60 0 0 1 120 0 v35" fill="none" stroke="#00a0e5" stroke-width="13" stroke-linecap="round"/>
    <rect x="890" y="365" width="170" height="140" rx="22" fill="#032c42" stroke="#00a0e5" stroke-width="10"/>
    <circle cx="975" cy="425" r="17" fill="#7fd4f5"/>
    <rect x="966" y="430" width="18" height="38" rx="8" fill="#7fd4f5"/>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1300" cy="290" r="2"/>
    <circle cx="1380" cy="500" r="2.5"/><circle cx="300" cy="510" r="2"/>
  </g>
</svg>
