<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- objeto real no centro, envolto pelo anel tracejado do proxy
       (faixa segura y 260-540) -->
  <circle cx="800" cy="400" r="134" fill="none" stroke="#00a0e5" stroke-width="11" stroke-dasharray="26 20" stroke-linecap="round"/>
  <rect x="692" y="336" width="216" height="128" rx="22" fill="#032c42" stroke="#7fd4f5" stroke-width="9"/>
  <g stroke="#7fd4f5" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <path d="M730 378 H870"/>
    <path d="M730 424 H820"/>
  </g>

  <!-- chamada que atravessa o anel antes de chegar no objeto -->
  <path d="M440 400 H600" stroke="#e07a1f" stroke-width="12" stroke-linecap="round"/>
  <path d="M642 400 l-30 -18 v36 Z" fill="#e07a1f"/>
  <circle cx="565" cy="400" r="13" fill="#e07a1f"/>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1300" cy="300" r="2"/>
    <circle cx="1380" cy="500" r="2.5"/><circle cx="300" cy="500" r="2"/>
  </g>
</svg>
