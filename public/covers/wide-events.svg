<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="400" rx="560" ry="280" fill="url(#glow)"/>

  <!-- muitas linhas finas (logs espalhados) — faixa segura y 260-540 -->
  <g stroke="#7fd4f5" stroke-width="7" stroke-linecap="round" opacity="0.65">
    <path d="M480 270 H670"/>
    <path d="M510 320 H700"/>
    <path d="M480 370 H670"/>
    <path d="M510 420 H700"/>
    <path d="M480 470 H670"/>
    <path d="M510 520 H700"/>
  </g>
  <g stroke="#7fd4f5" stroke-width="4" opacity="0.45" fill="none">
    <path d="M700 300 C770 300 770 385 830 385"/>
    <path d="M730 420 C780 420 780 398 830 398"/>
    <path d="M700 500 C780 500 780 410 830 410"/>
  </g>

  <!-- um evento largo -->
  <rect x="830" y="342" width="320" height="108" rx="24" fill="#032c42" stroke="#00a0e5" stroke-width="10"/>
  <g fill="#00a0e5">
    <circle cx="890" cy="396" r="13"/>
    <circle cx="948" cy="396" r="13"/>
    <circle cx="1006" cy="396" r="13"/>
    <circle cx="1064" cy="396" r="13"/>
    <circle cx="1112" cy="396" r="13" fill="#7fd4f5"/>
  </g>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="330" cy="300" r="2.5"/><circle cx="1300" cy="300" r="2"/>
    <circle cx="1380" cy="500" r="2.5"/><circle cx="300" cy="500" r="2"/>
  </g>
</svg>
