<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01131b"/>
      <stop offset="0.55" stop-color="#04283d"/>
      <stop offset="1" stop-color="#01131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a0e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00a0e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#00a0e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <ellipse cx="800" cy="420" rx="620" ry="330" fill="url(#glow)"/>

  <!-- antes: dezenas de linhas finas espalhadas -->
  <g stroke="#7fd4f5" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round">
    <line x1="200" y1="220" x2="420" y2="220"/>
    <line x1="240" y1="270" x2="500" y2="270"/>
    <line x1="180" y1="320" x2="380" y2="320"/>
    <line x1="260" y1="370" x2="520" y2="370"/>
    <line x1="200" y1="420" x2="440" y2="420"/>
    <line x1="240" y1="470" x2="460" y2="470"/>
    <line x1="180" y1="520" x2="400" y2="520"/>
    <line x1="260" y1="570" x2="500" y2="570"/>
  </g>
  <text x="350" y="650" font-family="-apple-system, sans-serif" font-size="30" fill="#7fd4f5" opacity="0.7" text-anchor="middle">15 logs parciais</text>

  <!-- seta -->
  <path d="M600 400 H760" stroke="#00a0e5" stroke-width="6" stroke-linecap="round"/>
  <path d="M740 380 L780 400 L740 420 Z" fill="#00a0e5"/>

  <!-- depois: um evento largo e denso -->
  <g>
    <rect x="850" y="220" width="560" height="360" rx="20" fill="#032c42" stroke="#00a0e5" stroke-width="6"/>
    <g font-family="ui-monospace, monospace" font-size="26" fill="#7fd4f5">
      <text x="890" y="280">{ request_id, trace_id,</text>
      <text x="890" y="330">  user.tier, cart.total,</text>
      <text x="890" y="380">  payment.attempt,</text>
      <text x="890" y="430">  error.code, flags,</text>
      <text x="890" y="480">  duration_ms, … }</text>
    </g>
    <rect x="890" y="510" width="200" height="44" rx="22" fill="#00577e" stroke="#00a0e5" stroke-width="3"/>
    <text x="990" y="540" font-family="ui-monospace, monospace" font-size="26" fill="#ffffff" text-anchor="middle">50 campos</text>
  </g>
  <text x="1130" y="650" font-family="-apple-system, sans-serif" font-size="30" fill="#7fd4f5" opacity="0.8" text-anchor="middle">1 wide event</text>

  <g fill="#7fd4f5" opacity="0.4">
    <circle cx="240" cy="140" r="2.5"/><circle cx="900" cy="120" r="2"/>
    <circle cx="1460" cy="640" r="2.5"/><circle cx="1520" cy="200" r="2"/>
    <circle cx="140" cy="680" r="2.5"/><circle cx="700" cy="700" r="2"/>
  </g>
</svg>
