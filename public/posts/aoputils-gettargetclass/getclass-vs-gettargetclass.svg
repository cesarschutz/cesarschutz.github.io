<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="380" fill="#ffffff"/>
<defs>
<marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#4b5563"/></marker>
</defs>
<text x="30" y="42" font-size="21" font-weight="700" fill="#111827">getClass() para no proxy; getTargetClass() devolve a classe real</text>

<!-- bean injetado: proxy envolvendo o objeto real -->
<rect x="30" y="90" width="350" height="210" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="205" y="118" font-size="14" font-weight="700" fill="#2b7fc4" text-anchor="middle">bean injetado = proxy CGLIB</text>
<text x="205" y="140" font-size="14" fill="#1f2937" text-anchor="middle">MeuServico$$SpringCGLIB$$0</text>
<rect x="80" y="170" width="250" height="100" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2.5"/>
<text x="205" y="210" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">MeuServico</text>
<text x="205" y="236" font-size="13" fill="#4b5563" text-anchor="middle">objeto real, com as</text>
<text x="205" y="254" font-size="13" fill="#4b5563" text-anchor="middle">anotações que você escreveu</text>

<!-- getClass -->
<path d="M382 150 L595 130" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="488" y="122" font-size="14" font-weight="700" fill="#d9534f" text-anchor="middle">bean.getClass()</text>
<rect x="605" y="90" width="305" height="80" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2.5"/>
<text x="757" y="122" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">MeuServico$$SpringCGLIB$$0</text>
<text x="757" y="148" font-size="13" fill="#d9534f" text-anchor="middle">anotações, logs e mapas falham</text>

<!-- getTargetClass -->
<path d="M332 250 L595 262" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="489" y="290" font-size="14" font-weight="700" fill="#2e9e5b" text-anchor="middle">AopUtils.getTargetClass(bean)</text>
<rect x="605" y="220" width="305" height="80" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2.5"/>
<text x="757" y="252" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">MeuServico</text>
<text x="757" y="278" font-size="13" fill="#2e9e5b" text-anchor="middle">anotações, tipos e logs corretos</text>

<text x="470" y="348" font-size="14" fill="#6b7280" text-anchor="middle">vale para proxy CGLIB e JDK; se o bean não for proxy, devolve getClass(); nunca retorna null</text>
</svg>
