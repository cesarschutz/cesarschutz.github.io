<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 780" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="780" fill="#ffffff"/>
<defs>
<marker id="seta" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#4b5563"/></marker>
</defs>

<text x="24" y="42" font-size="21" font-weight="700" fill="#111827">Platform threads x virtual threads</text>
<text x="24" y="66" font-size="14" fill="#4b5563">Mesma API java.lang.Thread, modelos de agendamento diferentes (JEP 444)</text>

<!-- Painel esquerdo -->
<rect x="24" y="88" width="330" height="396" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="44" y="116" font-size="16" font-weight="700" fill="#111827">Platform threads: 1 para 1</text>
<text x="44" y="138" font-size="13" fill="#4b5563">cada Thread embrulha uma thread do SO</text>

<g font-size="13" text-anchor="middle">
<rect x="44" y="160" width="136" height="40" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="112" y="185" fill="#111827">req 1 (thread)</text>
<rect x="44" y="214" width="136" height="40" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="112" y="239" fill="#111827">req 2 (thread)</text>
<rect x="44" y="268" width="136" height="40" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="112" y="293" fill="#111827">req 3 (thread)</text>

<rect x="216" y="160" width="118" height="40" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
<text x="275" y="185" fill="#111827">thread do SO</text>
<rect x="216" y="214" width="118" height="40" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
<text x="275" y="239" fill="#111827">thread do SO</text>
<rect x="216" y="268" width="118" height="40" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
<text x="275" y="293" fill="#111827">thread do SO</text>
</g>
<line x1="181" y1="180" x2="212" y2="180" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<line x1="181" y1="234" x2="212" y2="234" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<line x1="181" y1="288" x2="212" y2="288" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>

<rect x="44" y="330" width="290" height="134" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
<text x="60" y="354" font-size="14" font-weight="700" fill="#d9534f">Limite</text>
<text x="60" y="378" font-size="13" fill="#111827">A thread do SO fica presa durante</text>
<text x="60" y="398" font-size="13" fill="#111827">toda a requisição, inclusive esperando</text>
<text x="60" y="418" font-size="13" fill="#111827">I/O. Threads do SO são caras, então</text>
<text x="60" y="438" font-size="13" fill="#111827">o número de threads vira o gargalo</text>
<text x="60" y="458" font-size="13" fill="#111827">antes de CPU ou rede.</text>

<!-- Painel direito -->
<rect x="378" y="88" width="538" height="396" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="398" y="116" font-size="16" font-weight="700" fill="#111827">Virtual threads: M para N</text>
<text x="398" y="138" font-size="13" fill="#4b5563">muitas virtual threads compartilham poucas threads do SO</text>

<g font-size="13" text-anchor="middle" fill="#111827">
<rect x="398" y="158" width="92" height="36" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="444" y="181">VT 1</text>
<rect x="500" y="158" width="92" height="36" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="546" y="181">VT 2</text>
<rect x="602" y="158" width="92" height="36" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="648" y="181">VT 3</text>
<rect x="704" y="158" width="92" height="36" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="750" y="181">VT 4</text>
<rect x="806" y="158" width="92" height="36" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="852" y="181">milhões</text>
</g>

<line x1="657" y1="198" x2="657" y2="226" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<text x="669" y="217" font-size="13" fill="#4b5563">prontas para rodar</text>

<rect x="398" y="230" width="500" height="58" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="648" y="254" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Scheduler do JDK: ForkJoinPool em modo FIFO</text>
<text x="648" y="275" font-size="13" fill="#4b5563" text-anchor="middle">padrão: paralelismo = nº de processadores (ajustável por propriedade)</text>

<line x1="657" y1="292" x2="657" y2="320" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<text x="669" y="311" font-size="13" fill="#4b5563">monta (mount)</text>

<g font-size="13" text-anchor="middle" fill="#111827">
<rect x="398" y="324" width="116" height="50" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="456" y="345" font-weight="700">carrier 1</text>
<text x="456" y="363" fill="#4b5563">rodando VT 2</text>
<rect x="526" y="324" width="116" height="50" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="584" y="345" font-weight="700">carrier 2</text>
<text x="584" y="363" fill="#4b5563">rodando VT 4</text>
<rect x="654" y="324" width="116" height="50" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="712" y="345" font-weight="700">carrier 3</text>
<text x="712" y="363" fill="#4b5563">livre</text>
<rect x="782" y="324" width="116" height="50" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="840" y="345" font-weight="700">carrier N</text>
<text x="840" y="363" fill="#4b5563">rodando VT 1</text>
</g>
<text x="648" y="398" font-size="13" fill="#4b5563" text-anchor="middle">carriers são platform threads, ou seja, threads do SO</text>

<rect x="398" y="414" width="500" height="54" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="414" y="437" font-size="13" fill="#111827">A virtual thread só ocupa uma thread do SO enquanto usa CPU.</text>
<text x="414" y="457" font-size="13" fill="#111827">Parada em I/O, ela libera a carrier para outra virtual thread.</text>

<!-- Ciclo de vida -->
<text x="24" y="522" font-size="16" font-weight="700" fill="#111827">Ciclo de uma chamada bloqueante dentro de uma virtual thread</text>

<g font-size="13" fill="#111827">
<rect x="24" y="540" width="206" height="84" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="40" y="564" font-weight="700">1. Montada</text>
<text x="40" y="586">executa código Java</text>
<text x="40" y="606">em uma carrier</text>

<rect x="252" y="540" width="206" height="84" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="1.5"/>
<text x="268" y="564" font-weight="700">2. Bloqueia em I/O</text>
<text x="268" y="586">desmonta; a pilha vai</text>
<text x="268" y="606">para o heap</text>

<rect x="480" y="540" width="206" height="84" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="496" y="564" font-weight="700">3. I/O pronto</text>
<text x="496" y="586">a virtual thread volta</text>
<text x="496" y="606">para a fila do scheduler</text>

<rect x="708" y="540" width="208" height="84" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="724" y="564" font-weight="700">4. Monta de novo</text>
<text x="724" y="586">em qualquer carrier</text>
<text x="724" y="606">livre, e continua</text>
</g>
<line x1="231" y1="582" x2="248" y2="582" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<line x1="459" y1="582" x2="476" y2="582" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<line x1="687" y1="582" x2="704" y2="582" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>

<rect x="24" y="646" width="892" height="112" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
<text x="40" y="672" font-size="14" font-weight="700" fill="#d9534f">Pinning no Java 21</text>
<text x="40" y="696" font-size="13" fill="#111827">Dentro de um bloco ou método synchronized, ou em código nativo, a virtual thread não desmonta: o passo 2 bloqueia a carrier.</text>
<text x="40" y="718" font-size="13" fill="#111827">A JEP 444 recomenda trocar por ReentrantLock onde há I/O longo e frequente.</text>
<text x="40" y="740" font-size="13" fill="#111827">No Java 24, a JEP 491 eliminou quase todos os casos de pinning causados por synchronized.</text>
</svg>
