<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 632" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="632" fill="#ffffff"/>
<defs>
<marker id="seta" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#4b5563"/></marker>
</defs>

<text x="24" y="42" font-size="21" font-weight="700" fill="#111827">ZGC geracional: coletar os objetos jovens sem percorrer o heap inteiro</text>
<text x="24" y="66" font-size="14" fill="#4b5563">JEP 439: duas gerações lógicas, coletadas de forma independente; store barriers mantêm o remembered set</text>

<!-- heap -->
<rect x="24" y="90" width="540" height="330" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="44" y="114" font-size="15" font-weight="700" fill="#111827">Heap</text>

<rect x="44" y="128" width="500" height="112" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="60" y="152" font-size="14" font-weight="700" fill="#2b7fc4">Geração velha</text>
<text x="60" y="172" font-size="13" fill="#4b5563">objetos que sobreviveram; coletada com menos frequência</text>
<rect x="60" y="186" width="170" height="40" rx="10" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="145" y="211" font-size="14" fill="#111827" text-anchor="middle"><tspan font-weight="700">Pedido</tspan> · campo itens</text>
<rect x="250" y="186" width="120" height="40" rx="10" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="310" y="211" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Cliente</text>

<rect x="44" y="262" width="500" height="140" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="60" y="352" font-size="14" font-weight="700" fill="#2e9e5b">Geração jovem</text>
<text x="60" y="374" font-size="13" fill="#4b5563">objetos recém-alocados; coletada com frequência, a maioria morre aqui</text>
<rect x="60" y="280" width="120" height="40" rx="10" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="120" y="305" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Item</text>
<rect x="200" y="280" width="80" height="40" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="240" y="305" font-size="13" fill="#6b7280" text-anchor="middle">morto</text>
<rect x="295" y="280" width="80" height="40" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="335" y="305" font-size="13" fill="#6b7280" text-anchor="middle">morto</text>
<rect x="390" y="280" width="130" height="40" rx="10" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="455" y="305" font-size="14" fill="#111827" text-anchor="middle">sobrevivente</text>

<line x1="120" y1="226" x2="120" y2="276" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<text x="132" y="256" font-size="12" fill="#111827">ponteiro da geração velha para a jovem</text>
<line x1="455" y1="280" x2="455" y2="246" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<text x="465" y="256" font-size="12" fill="#111827">promoção</text>

<!-- ciclo -->
<text x="590" y="114" font-size="15" font-weight="700" fill="#111827">O que o modo geracional faz</text>

<rect x="590" y="128" width="326" height="86" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="1.8"/>
<text x="606" y="152" font-size="14" font-weight="700" fill="#e07a1f">1. Store barrier (nova)</text>
<text x="606" y="174" font-size="13" fill="#111827">a aplicação grava <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pedido.itens = item</tspan></text>
<text x="606" y="196" font-size="13" fill="#111827">e a barreira anota o campo gravado</text>

<line x1="753" y1="214" x2="753" y2="236" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>

<rect x="590" y="240" width="326" height="78" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="606" y="264" font-size="14" font-weight="700" fill="#111827">Remembered set</text>
<text x="606" y="284" font-size="13" fill="#111827">campos da geração velha que podem</text>
<text x="606" y="302" font-size="13" fill="#111827">apontar para objetos jovens</text>

<line x1="753" y1="318" x2="753" y2="340" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>

<rect x="590" y="344" width="326" height="76" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.8"/>
<text x="606" y="368" font-size="14" font-weight="700" fill="#2e9e5b">2. Coleta da geração jovem</text>
<text x="606" y="390" font-size="13" fill="#111827">marca a partir das raízes e do remembered set,</text>
<text x="606" y="410" font-size="13" fill="#111827">sem percorrer a geração velha</text>

<!-- load barrier -->
<rect x="24" y="440" width="892" height="58" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="44" y="464" font-size="14" font-weight="700" fill="#2b7fc4">Load barrier (já existia no ZGC)</text>
<text x="44" y="486" font-size="13" fill="#111827">Ao ler uma referência, corrige o endereço se o objeto foi movido. Tudo isso roda em paralelo com a aplicação.</text>

<!-- evolução -->
<text x="24" y="534" font-size="15" font-weight="700" fill="#111827">Evolução do modo geracional</text>
<rect x="24" y="548" width="280" height="60" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="1.8"/>
<text x="40" y="572" font-size="14" font-weight="700" fill="#111827">Java 21 · opcional</text>
<text x="40" y="594" font-size="13" fill="#111827" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-XX:+UseZGC -XX:+ZGenerational</text>
<line x1="304" y1="578" x2="326" y2="578" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<rect x="330" y="548" width="280" height="60" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="1.8"/>
<text x="346" y="572" font-size="14" font-weight="700" fill="#111827">Java 23 · padrão</text>
<text x="346" y="594" font-size="13" fill="#4b5563">JEP 474; não geracional depreciado</text>
<line x1="610" y1="578" x2="632" y2="578" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<rect x="636" y="548" width="280" height="60" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.8"/>
<text x="652" y="572" font-size="14" font-weight="700" fill="#111827">Java 24 · único modo</text>
<text x="652" y="594" font-size="13" fill="#4b5563">JEP 490; opção ZGenerational ignorada</text>
</svg>
