<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 568" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="568" fill="#ffffff"/>
<defs><marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4b5563"/></marker></defs>
<text x="20" y="38" font-size="21" font-weight="700" fill="#111827">LazyConstant: imutável, mas só quando alguém precisa</text>
<text x="20" y="62" font-size="14" fill="#6b7280">Ciclo de vida de uma lazy constant (JEP 531, Java 27, preview)</text>
<rect x="20" y="96" width="270" height="120" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="155" y="126" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Criada</text>
<text x="155" y="148" font-size="13" font-weight="400" fill="#374151" text-anchor="middle">LazyConstant.of(função)</text>
<text x="155" y="170" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">sem conteúdo ainda;</text>
<text x="155" y="192" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">nada é calculado</text>
<line x1="294" y1="156" x2="336" y2="156" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<text x="315" y="146" font-size="13" font-weight="600" fill="#4b5563" text-anchor="middle">get()</text>
<rect x="340" y="96" width="270" height="120" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2"/>
<text x="475" y="126" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Primeiro get()</text>
<text x="475" y="148" font-size="13" font-weight="400" fill="#374151" text-anchor="middle">executa a função uma vez,</text>
<text x="475" y="170" font-size="13" font-weight="400" fill="#374151" text-anchor="middle">mesmo com várias threads</text>
<text x="475" y="192" font-size="13" font-weight="400" fill="#374151" text-anchor="middle">chamando get() ao mesmo tempo</text>
<line x1="614" y1="156" x2="656" y2="156" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<rect x="660" y="96" width="260" height="120" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="790" y="126" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Inicializada</text>
<text x="790" y="148" font-size="13" font-weight="400" fill="#374151" text-anchor="middle">conteúdo fixo, nunca muda</text>
<text x="790" y="170" font-size="13" font-weight="400" fill="#374151" text-anchor="middle">próximos get() devolvem</text>
<text x="790" y="192" font-size="13" font-weight="400" fill="#374151" text-anchor="middle">o mesmo valor</text>
<text x="470" y="246" font-size="13" fill="#6b7280" text-anchor="middle">Guardada em campo final, a JVM pode tratar o conteúdo como constante (constant folding). null não é aceito como valor.</text>
<rect x="234" y="276" width="222" height="40" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="345" y="302" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">campo final</text>
<rect x="464" y="276" width="232" height="40" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="580" y="302" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">LazyConstant</text>
<rect x="704" y="276" width="212" height="40" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2"/>
<text x="810" y="302" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">campo não final</text>
<rect x="20" y="328" width="900" height="46" rx="8" fill="#f9fafb"/>
<text x="32" y="356" font-size="14" font-weight="700" fill="#111827">Quantas atribuições</text>
<text x="345" y="356" font-size="14" fill="#374151" font-weight="400" text-anchor="middle">exatamente 1</text>
<text x="580" y="356" font-size="14" fill="#2e9e5b" font-weight="600" text-anchor="middle">0 ou 1</text>
<text x="810" y="356" font-size="14" fill="#374151" font-weight="400" text-anchor="middle">0 a infinitas</text>
<text x="32" y="402" font-size="14" font-weight="700" fill="#111827">Onde o valor nasce</text>
<text x="345" y="402" font-size="14" fill="#374151" font-weight="400" text-anchor="middle">construtor ou static</text>
<text x="580" y="402" font-size="14" fill="#2e9e5b" font-weight="600" text-anchor="middle">função de cálculo</text>
<text x="810" y="402" font-size="14" fill="#374151" font-weight="400" text-anchor="middle">em qualquer lugar</text>
<rect x="20" y="420" width="900" height="46" rx="8" fill="#f9fafb"/>
<text x="32" y="448" font-size="14" font-weight="700" fill="#111827">Constant folding</text>
<text x="345" y="448" font-size="14" fill="#374151" font-weight="400" text-anchor="middle">sim</text>
<text x="580" y="448" font-size="14" fill="#2e9e5b" font-weight="600" text-anchor="middle">sim, depois de inicializar</text>
<text x="810" y="448" font-size="14" fill="#374151" font-weight="400" text-anchor="middle">não</text>
<text x="32" y="494" font-size="14" font-weight="700" fill="#111827">Escrita concorrente</text>
<text x="345" y="494" font-size="14" fill="#374151" font-weight="400" text-anchor="middle">não</text>
<text x="580" y="494" font-size="14" fill="#2e9e5b" font-weight="600" text-anchor="middle">sim, uma só vence</text>
<text x="810" y="494" font-size="14" fill="#374151" font-weight="400" text-anchor="middle">sim</text>
<text x="20" y="548" font-size="13" fill="#6b7280">Tabela adaptada da seção "Flexible initialization with lazy constants" da JEP 531.</text>
</svg>
