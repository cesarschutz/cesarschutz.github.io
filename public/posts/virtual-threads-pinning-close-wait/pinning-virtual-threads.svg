<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1010" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="1010" fill="#ffffff"/>
<defs>
<marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4b5563"/></marker>
</defs>

<text x="470" y="46" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">Por que o serviço congelou (Java 21 a 23)</text>
<text x="470" y="72" font-size="15" fill="#6b7280" text-anchor="middle">pinning por synchronized: as poucas carriers ficam presas e nada mais executa</text>

<!-- pico -->
<rect x="190" y="96" width="560" height="64" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="470" y="123" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Pico da tarde: milhares de requisições</text>
<text x="470" y="146" font-size="14" fill="#4b5563" text-anchor="middle">autorização de cartão, Java 21, Spring Boot 3, Tomcat embarcado</text>

<line x1="470" y1="160" x2="470" y2="190" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>

<!-- virtual threads -->
<rect x="110" y="196" width="720" height="110" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="470" y="224" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Uma virtual thread por requisição (baratas, a JVM cria quantas precisar)</text>
<rect x="140" y="244" width="120" height="40" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="200" y="269" font-size="14" fill="#111827" text-anchor="middle">req 1</text>
<rect x="276" y="244" width="120" height="40" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="336" y="269" font-size="14" fill="#111827" text-anchor="middle">req 2</text>
<rect x="412" y="244" width="120" height="40" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="472" y="269" font-size="14" fill="#111827" text-anchor="middle">req 3</text>
<rect x="548" y="244" width="120" height="40" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="608" y="269" font-size="14" fill="#111827" text-anchor="middle">…</text>
<rect x="684" y="244" width="120" height="40" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="744" y="269" font-size="14" fill="#111827" text-anchor="middle">req 10.000</text>

<line x1="470" y1="306" x2="470" y2="350" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="486" y="333" font-size="14" font-weight="600" fill="#4b5563">para executar, cada uma precisa montar numa carrier</text>

<!-- janela de pinning -->
<rect x="60" y="370" width="820" height="226" rx="12" fill="none" stroke="#d9534f" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="80" y="358" width="330" height="24" fill="#ffffff"/>
<text x="90" y="376" font-size="15" font-weight="700" fill="#d9534f">pinning: nenhuma consegue desmontar</text>

<rect x="110" y="394" width="720" height="130" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2"/>
<text x="470" y="422" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Carrier threads: threads reais do sistema operacional</text>
<text x="470" y="444" font-size="14" fill="#4b5563" text-anchor="middle">por padrão, uma por processador disponível (4 vCPUs = 4 carriers)</text>
<rect x="140" y="462" width="156" height="42" rx="12" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/>
<text x="218" y="488" font-size="14" font-weight="700" fill="#d9534f" text-anchor="middle">carrier 1: presa</text>
<rect x="312" y="462" width="156" height="42" rx="12" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/>
<text x="390" y="488" font-size="14" font-weight="700" fill="#d9534f" text-anchor="middle">carrier 2: presa</text>
<rect x="484" y="462" width="156" height="42" rx="12" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/>
<text x="562" y="488" font-size="14" font-weight="700" fill="#d9534f" text-anchor="middle">carrier 3: presa</text>
<rect x="656" y="462" width="156" height="42" rx="12" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/>
<text x="734" y="488" font-size="14" font-weight="700" fill="#d9534f" text-anchor="middle">carrier 4: presa</text>

<text x="470" y="552" font-size="15" font-weight="600" fill="#d9534f" text-anchor="middle">a virtual thread montada em cada uma bloqueou dentro de um synchronized</text>
<text x="470" y="576" font-size="14" fill="#4b5563" text-anchor="middle">a JVM não a desmonta: quem consta como dono do monitor é a carrier, não a virtual thread</text>

<line x1="470" y1="596" x2="470" y2="632" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>

<!-- estado do serviço -->
<rect x="110" y="638" width="720" height="168" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2"/>
<text x="470" y="666" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Estado do serviço</text>
<rect x="140" y="682" width="660" height="40" rx="12" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/>
<text x="160" y="707" font-size="14" fill="#111827">as outras virtual threads esperam uma carrier livre, que não vem</text>
<rect x="140" y="730" width="660" height="40" rx="12" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/>
<text x="160" y="755" font-size="14" fill="#111827">nenhuma chega à linha que fecha o socket</text>
<text x="470" y="792" font-size="14" font-weight="600" fill="#d9534f" text-anchor="middle">os clientes estouram o timeout e fecham a conexão do lado deles</text>

<line x1="470" y1="806" x2="470" y2="840" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>

<!-- close_wait -->
<rect x="190" y="846" width="560" height="66" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2"/>
<text x="470" y="874" font-size="17" font-weight="700" fill="#d9534f" text-anchor="middle">Milhares de sockets em CLOSE_WAIT</text>
<text x="470" y="897" font-size="14" fill="#4b5563" text-anchor="middle">JVM viva, CPU baixa, nenhuma exceção no log</text>

<!-- correção -->
<rect x="110" y="934" width="720" height="58" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="470" y="959" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Java 24 em diante (JEP 491): a virtual thread desmonta mesmo dentro de synchronized</text>
<text x="470" y="980" font-size="14" fill="#4b5563" text-anchor="middle">o Java 25 é a primeira LTS com essa correção</text>
</svg>
