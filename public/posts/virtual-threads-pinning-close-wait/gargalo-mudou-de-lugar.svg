<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 790" width="720" height="790" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="720" height="790" fill="#ffffff"/>
<defs>
<marker id="nb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b7fc4"/></marker>
<marker id="nr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d9534f"/></marker>
<marker id="ng" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2a9d78"/></marker>
</defs>

<rect x="24" y="22" width="6" height="26" fill="#2ec4a6"/>
<text x="42" y="43" font-size="20" font-weight="700" fill="#1a1a1a">O gargalo mudou de lugar</text>
<text x="696" y="41" font-size="11" fill="#9a9a9a" text-anchor="end">Sessão 02 · o que veio junto</text>

<text x="40" y="82" font-size="12" font-weight="700" fill="#2b7fc4">ANTES · pool de 200 threads</text>

<rect x="200" y="94" width="320" height="54" rx="10" fill="#eaf4fd" stroke="#2b7fc4" stroke-width="2"/>
<text x="360" y="116" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Pool de 200 threads</text>
<text x="360" y="134" font-size="10" fill="#6b7280" text-anchor="middle">uma única peça, dois trabalhos</text>

<path d="M 300 152 L 215 190" fill="none" stroke="#2b7fc4" stroke-width="2.5" marker-end="url(#nb)"/>
<path d="M 420 152 L 505 190" fill="none" stroke="#2b7fc4" stroke-width="2.5" marker-end="url(#nb)"/>

<rect x="90" y="194" width="250" height="52" rx="10" fill="#ffffff" stroke="#2b7fc4" stroke-width="2"/>
<text x="215" y="214" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">Isola o trabalho</text>
<text x="215" y="232" font-size="9.5" fill="#6b7280" text-anchor="middle">uma thread por requisição em curso</text>

<rect x="380" y="194" width="250" height="52" rx="10" fill="#ffffff" stroke="#2b7fc4" stroke-width="2"/>
<text x="505" y="214" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">Limita a saída</text>
<text x="505" y="232" font-size="9.5" fill="#6b7280" text-anchor="middle">no máximo 200 chamadas ao mesmo tempo</text>

<text x="360" y="272" font-size="10" font-weight="600" fill="#2b7fc4" text-anchor="middle">o limite existia sem ninguém ter escrito uma linha para isso</text>

<line x1="40" y1="298" x2="680" y2="298" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="8 6"/>

<text x="40" y="330" font-size="12" font-weight="700" fill="#d9534f">DEPOIS · virtual threads, sem pool</text>

<rect x="200" y="342" width="320" height="54" rx="10" fill="#fdeaea" stroke="#d9534f" stroke-width="2"/>
<text x="360" y="364" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">10.000 virtual threads</text>
<text x="360" y="382" font-size="10" fill="#6b7280" text-anchor="middle">isolamento sim, limite nenhum</text>

<path d="M 300 400 L 215 438" fill="none" stroke="#d9534f" stroke-width="2.5" marker-end="url(#nr)"/>
<path d="M 420 400 L 505 438" fill="none" stroke="#d9534f" stroke-width="2.5" marker-end="url(#nr)"/>

<rect x="90" y="442" width="250" height="68" rx="10" fill="#ffffff" stroke="#d9534f" stroke-width="2"/>
<text x="215" y="464" font-size="11" font-weight="700" fill="#d9534f" text-anchor="middle">Postgres · pool de 20 conexões</text>
<text x="215" y="482" font-size="9.5" fill="#6b7280" text-anchor="middle">20 entram, 9.980 ficam na fila</text>
<text x="215" y="498" font-size="9.5" fill="#6b7280" text-anchor="middle">timeout do Hikari em massa</text>

<rect x="380" y="442" width="250" height="68" rx="10" fill="#ffffff" stroke="#d9534f" stroke-width="2"/>
<text x="505" y="464" font-size="11" font-weight="700" fill="#d9534f" text-anchor="middle">Adquirente · contrato de 500</text>
<text x="505" y="482" font-size="9.5" fill="#6b7280" text-anchor="middle">recebe milhares de uma vez</text>
<text x="505" y="498" font-size="9.5" fill="#6b7280" text-anchor="middle">fica lento ou recusa</text>

<text x="360" y="538" font-size="11" font-weight="700" fill="#d9534f" text-anchor="middle">o gargalo não sumiu — ele andou para dentro</text>

<path d="M 360 552 L 360 582" fill="none" stroke="#2a9d78" stroke-width="2.5" marker-end="url(#ng)"/>

<rect x="120" y="586" width="480" height="94" rx="10" fill="#eaf7f1" stroke="#2a9d78" stroke-width="2"/>
<text x="360" y="610" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">O conserto: tornar explícito o que era implícito</text>
<rect x="142" y="622" width="436" height="24" rx="6" fill="#ffffff" stroke="#2a9d78" stroke-width="1.5"/>
<text x="156" y="639" font-size="10.5" fill="#1a1a1a">semáforo antes da chamada ao adquirente</text>
<rect x="142" y="650" width="436" height="24" rx="6" fill="#ffffff" stroke="#2a9d78" stroke-width="1.5"/>
<text x="156" y="667" font-size="10.5" fill="#1a1a1a">teto declarado no banco e rate limit na saída</text>

<rect x="40" y="710" width="640" height="44" rx="10" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="62" y="724" width="26" height="16" rx="4" fill="#eaf4fd" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="98" y="736" font-size="10" fill="#4b5563">modelo antigo</text>
<rect x="230" y="724" width="26" height="16" rx="4" fill="#fdeaea" stroke="#d9534f" stroke-width="1.5"/>
<text x="266" y="736" font-size="10" fill="#4b5563">pressão que apareceu</text>
<rect x="430" y="724" width="26" height="16" rx="4" fill="#eaf7f1" stroke="#2a9d78" stroke-width="1.5"/>
<text x="466" y="736" font-size="10" fill="#4b5563">limite que você declara</text>
<text x="40" y="774" font-size="9" fill="#9a9a9a">estilo inspirado em ByteByteGo</text>
</svg>
