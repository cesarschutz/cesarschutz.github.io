<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1000" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="1000" fill="#ffffff"/>
<defs>
<marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4b5563"/></marker>
</defs>

<text x="470" y="46" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">O gargalo mudou de lugar</text>
<text x="470" y="72" font-size="15" fill="#6b7280" text-anchor="middle">vale em qualquer versão do Java com virtual threads, inclusive no 25</text>

<!-- ANTES -->
<text x="60" y="114" font-size="16" font-weight="700" fill="#2b7fc4">ANTES: pool de 200 threads do Tomcat</text>

<rect x="290" y="130" width="360" height="66" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="470" y="158" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Pool de 200 threads</text>
<text x="470" y="181" font-size="14" fill="#4b5563" text-anchor="middle">uma peça só, dois trabalhos</text>

<line x1="400" y1="196" x2="290" y2="238" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<line x1="540" y1="196" x2="650" y2="238" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>

<rect x="90" y="244" width="360" height="70" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="270" y="272" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Separa o trabalho</text>
<text x="270" y="296" font-size="14" fill="#4b5563" text-anchor="middle">uma thread por requisição em curso</text>

<rect x="490" y="244" width="360" height="70" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="670" y="272" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Limita a saída</text>
<text x="670" y="296" font-size="14" fill="#4b5563" text-anchor="middle">no máximo 200 requisições em andamento</text>

<text x="470" y="346" font-size="15" font-weight="600" fill="#2b7fc4" text-anchor="middle">o limite existia sem ninguém ter escrito uma linha para isso</text>

<line x1="60" y1="374" x2="880" y2="374" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>

<!-- DEPOIS -->
<text x="60" y="414" font-size="16" font-weight="700" fill="#d9534f">DEPOIS: virtual threads, sem pool</text>

<rect x="290" y="430" width="360" height="66" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2"/>
<text x="470" y="458" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">10.000 virtual threads</text>
<text x="470" y="481" font-size="14" fill="#4b5563" text-anchor="middle">separação sim, limite nenhum</text>

<line x1="400" y1="496" x2="290" y2="538" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<line x1="540" y1="496" x2="650" y2="538" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>

<rect x="90" y="544" width="360" height="96" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2"/>
<text x="270" y="572" font-size="16" font-weight="700" fill="#d9534f" text-anchor="middle">Postgres: Hikari com 20 conexões</text>
<text x="270" y="596" font-size="14" fill="#4b5563" text-anchor="middle">20 entram, 9.980 esperam na fila</text>
<text x="270" y="620" font-size="14" fill="#4b5563" text-anchor="middle">timeout em massa (padrão: 30 s)</text>

<rect x="490" y="544" width="360" height="96" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2"/>
<text x="670" y="572" font-size="16" font-weight="700" fill="#d9534f" text-anchor="middle">Adquirente: contrato de 500</text>
<text x="670" y="596" font-size="14" fill="#4b5563" text-anchor="middle">recebe milhares de chamadas de uma vez</text>
<text x="670" y="620" font-size="14" fill="#4b5563" text-anchor="middle">fica lento ou recusa</text>

<text x="470" y="676" font-size="15" font-weight="700" fill="#d9534f" text-anchor="middle">o gargalo não sumiu: foi para o banco e para o adquirente</text>

<line x1="470" y1="690" x2="470" y2="724" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>

<!-- conserto -->
<rect x="110" y="730" width="720" height="216" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="470" y="760" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">O conserto: tornar explícito o que era implícito</text>
<rect x="140" y="778" width="660" height="42" rx="12" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="160" y="804" font-size="14" fill="#111827">bulkhead: limite declarado de chamadas simultâneas ao adquirente</text>
<rect x="140" y="830" width="660" height="42" rx="12" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="160" y="856" font-size="14" fill="#111827">circuit breaker: parar de insistir quando o adquirente está falhando</text>
<rect x="140" y="882" width="660" height="42" rx="12" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="160" y="908" font-size="14" fill="#111827">no banco, o mesmo: limite de acesso compatível com o tamanho do pool do Hikari</text>
</svg>
