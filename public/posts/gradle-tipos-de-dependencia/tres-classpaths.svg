<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
<marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#4b5563"/></marker>
</defs>
<text x="30" y="42" font-size="21" font-weight="700" fill="#111827">Cada configuração alimenta um classpath diferente</text>

<!-- dependência -->
<rect x="60" y="160" width="200" height="90" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/>
<path d="M60 195 h200 M160 160 v35" stroke="#9ca3af" stroke-width="2"/>
<text x="160" y="232" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">lib.jar</text>

<!-- setas -->
<path d="M262 185 C400 120 480 100 560 96" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#m)"/>
<path d="M262 205 H560" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#m)"/>
<path d="M262 228 C400 295 480 312 560 318" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#m)"/>

<!-- destinos -->
<g>
<rect x="575" y="62" width="330" height="72" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2.5"/>
<text x="740" y="92" font-size="15" font-weight="700" fill="#2b7fc4" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">compileOnly</text>
<text x="740" y="115" font-size="12.5" fill="#6b7280" text-anchor="middle">compila o código · NÃO vai para o runtime</text>
</g>
<g>
<rect x="575" y="170" width="330" height="72" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2.5"/>
<text x="740" y="200" font-size="15" font-weight="700" fill="#e07a1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">annotationProcessor</text>
<text x="740" y="223" font-size="12.5" fill="#6b7280" text-anchor="middle">ferramenta do compilador · gera metadados</text>
</g>
<g>
<rect x="575" y="280" width="330" height="72" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2.5"/>
<text x="740" y="310" font-size="15" font-weight="700" fill="#2e9e5b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">testImplementation</text>
<text x="740" y="333" font-size="12.5" fill="#6b7280" text-anchor="middle">compila e roda somente os testes</text>
</g>

<text x="160" y="300" font-size="12.5" fill="#6b7280" text-anchor="middle">a mesma dependência entra</text>
<text x="160" y="318" font-size="12.5" fill="#6b7280" text-anchor="middle">em momentos diferentes do build</text>
</svg>
