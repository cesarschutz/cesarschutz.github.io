<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="510" fill="#ffffff"/>
<defs>
<marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#4b5563"/></marker>
<marker id="mt" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#9ca3af"/></marker>
</defs>

<text x="470" y="42" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">Deploy da API no meio do lote (abordagem B)</text>
<text x="470" y="68" font-size="14" fill="#6b7280" text-anchor="middle">exemplo: visibility timeout de 2 h, dimensionado para cobrir o lote, e um deploy às 03:30</text>

<!-- eixo do tempo -->
<path d="M170 114 H920" stroke="#9ca3af" stroke-width="2" marker-end="url(#mt)"/>
<g stroke="#9ca3af" stroke-width="2"><path d="M170 108 V120"/><path d="M710 108 V120"/><path d="M890 108 V120"/></g>
<text x="150" y="119" font-size="13" fill="#6b7280" text-anchor="end">tempo</text>
<g font-size="12" fill="#4b5563" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">
<text x="170" y="96">03:00</text>
<text x="710" y="96">05:00</text>
<text x="890" y="96">05:40</text>
</g>
<text x="330" y="96" font-size="12" font-weight="700" fill="#d9534f" text-anchor="middle">03:30 deploy</text>

<!-- momento do deploy (não atravessa a fila: a mensagem continua lá) -->
<path d="M330 108 V214 M330 276 V350" stroke="#d9534f" stroke-width="2" stroke-dasharray="6 5"/>

<!-- raias -->
<g font-size="14" font-weight="700" text-anchor="end">
<text x="150" y="175" fill="#2b7fc4">Pod da API v1</text>
<text x="150" y="250" fill="#e07a1f">Fila SQS</text>
<text x="150" y="325" fill="#2e9e5b">Pod da API v2</text>
</g>

<!-- v1: processa até o deploy -->
<rect x="170" y="150" width="160" height="40" rx="8" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="250" y="175" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">processa o lote</text>
<text x="344" y="166" font-size="12" font-weight="700" fill="#d9534f">cancelado no meio do lote</text>
<text x="344" y="183" font-size="12" fill="#4b5563">o pod sai, e a mensagem não é apagada</text>

<!-- fila: a mensagem fica invisível desde o recebimento -->
<rect x="170" y="222" width="540" height="46" rx="8" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2"/>
<text x="440" y="241" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">mensagem invisível</text>
<text x="440" y="259" font-size="12" fill="#4b5563" text-anchor="middle">o visibility timeout de 2 h conta desde o recebimento</text>

<!-- a mensagem reaparece e vai para o v2 -->
<path d="M710 270 V296" stroke="#4b5563" stroke-width="2.5" marker-end="url(#m)"/>
<text x="726" y="287" font-size="12" fill="#4b5563">reaparece e é entregue ao v2</text>

<!-- v2: no ar sem nada para consumir, depois retoma -->
<rect x="330" y="298" width="380" height="44" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="520" y="325" font-size="12" fill="#6b7280" text-anchor="middle">no ar, mas sem mensagem para consumir</text>
<rect x="710" y="298" width="180" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="800" y="316" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">retoma de onde parou</text>
<text x="800" y="334" font-size="12" fill="#4b5563" text-anchor="middle">pelo status no banco</text>

<!-- o intervalo parado -->
<path d="M330 356 V366 H710 V356" fill="none" stroke="#d9534f" stroke-width="2"/>
<text x="520" y="388" font-size="13" font-weight="700" fill="#d9534f" text-anchor="middle">lote parado por 1h30: ninguém processa</text>
<text x="520" y="406" font-size="12" fill="#4b5563" text-anchor="middle">o v2 já está no ar, mas a mensagem só reaparece às 05:00</text>

<!-- resultado -->
<rect x="55" y="426" width="850" height="60" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2"/>
<text x="480" y="450" font-size="15" font-weight="700" fill="#d9534f" text-anchor="middle">o lote fica parado até a mensagem reaparecer e termina na v2</text>
<text x="480" y="472" font-size="13" fill="#4b5563" text-anchor="middle">parte processada pela v1, parte pela v2; o registro em andamento no deploy, se já foi ao SNS, sai de novo</text>
</svg>
