<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="540" fill="#ffffff"/>
<defs>
<marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4b5563"/></marker>
</defs>

<text x="470" y="46" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">Abordagem A: CronJob com a mesma imagem da API e o perfil batch</text>
<text x="470" y="72" font-size="14" fill="#6b7280" text-anchor="middle">o job roda num pod próprio, que nasce no horário agendado e termina com um exit code</text>

<!-- CronJob -->
<rect x="40" y="200" width="150" height="70" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="115" y="228" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">CronJob</text>
<text x="115" y="251" font-size="13" fill="#4b5563" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">03:00</text>
<path d="M192 235 H236" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="214" y="226" font-size="12" fill="#4b5563" text-anchor="middle">cria</text>

<!-- Job -->
<rect x="240" y="200" width="120" height="70" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="300" y="240" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Job</text>
<path d="M362 235 H406" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="384" y="226" font-size="12" fill="#4b5563" text-anchor="middle">sobe</text>

<!-- Pod do job -->
<rect x="410" y="170" width="260" height="130" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="540" y="204" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Pod do job</text>
<text x="540" y="230" font-size="14" fill="#4b5563" text-anchor="middle">a mesma imagem da API</text>
<text x="540" y="252" font-size="14" fill="#4b5563" text-anchor="middle">perfil batch, sem camada web</text>
<text x="540" y="280" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">executa o job com Spring Batch e termina</text>

<!-- Tópico SNS -->
<path d="M672 200 H700 V162 H736" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="718" y="154" font-size="12" fill="#4b5563" text-anchor="middle">publica</text>
<rect x="740" y="130" width="160" height="64" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="820" y="168" font-size="15" font-weight="700" fill="#2b7fc4" text-anchor="middle">Tópico SNS</text>

<!-- Kubernetes -->
<path d="M672 270 H700 V290 H736" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="712" y="308" font-size="12" fill="#4b5563" text-anchor="middle">exit code</text>
<rect x="740" y="250" width="160" height="80" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="820" y="280" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Kubernetes</text>
<text x="820" y="302" font-size="13" fill="#4b5563" text-anchor="middle">Job: sucesso ou falha</text>

<!-- Banco -->
<path d="M540 302 V384" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="552" y="348" font-size="13" fill="#4b5563">lê os pendentes e marca o status</text>
<path d="M470 400 V460 a70 12 0 0 0 140 0 V400" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<ellipse cx="540" cy="400" rx="70" ry="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="540" y="440" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Banco</text>

<!-- Deployment da API -->
<rect x="40" y="380" width="280" height="90" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="180" y="410" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Deployment da API</text>
<text x="180" y="433" font-size="13" fill="#4b5563" text-anchor="middle">perfil padrão, atende HTTP</text>
<text x="180" y="455" font-size="13" font-weight="700" fill="#2b7fc4" text-anchor="middle">não é tocado pelo job</text>
<path d="M322 425 H466" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/>
<text x="394" y="416" font-size="12" fill="#6b7280" text-anchor="middle">mesmo banco</text>

<text x="470" y="512" font-size="13" fill="#6b7280" text-anchor="middle">O deploy da API não toca no pod do job: o job de hoje termina com a versão com que começou, e a nova entra na próxima execução</text>
</svg>
