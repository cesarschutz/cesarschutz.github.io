<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="510" fill="#ffffff"/>
<defs>
<marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4b5563"/></marker>
</defs>

<text x="470" y="46" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">Abordagem A: CronJob com a mesma imagem da API e o perfil batch</text>
<text x="470" y="72" font-size="14" fill="#6b7280" text-anchor="middle">a mesma imagem roda em dois processos: a API, o dia todo; o pod do job, só no horário, até terminar o lote</text>

<!-- CronJob -->
<rect x="20" y="140" width="110" height="70" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="75" y="168" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">CronJob</text>
<text x="75" y="191" font-size="13" fill="#4b5563" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">03:00</text>
<path d="M132 175 H198" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="155" y="158" font-size="12" fill="#4b5563" text-anchor="middle">1. cria</text>

<!-- Job -->
<rect x="200" y="140" width="80" height="70" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="240" y="180" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Job</text>
<path d="M282 158 H388" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="330" y="138" font-size="12" fill="#4b5563" text-anchor="middle">2. sobe o pod</text>
<path d="M388 196 H284" stroke="#4b5563" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#seta)"/>
<text x="335" y="224" font-size="12" fill="#4b5563" text-anchor="middle">6. exit code</text>
<text x="150" y="252" font-size="12" fill="#6b7280" text-anchor="middle">exit code diferente de 0: o Job</text>
<text x="150" y="269" font-size="12" fill="#6b7280" text-anchor="middle">tenta de novo, até o backoffLimit</text>

<!-- Pod do job -->
<rect x="390" y="106" width="280" height="150" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="530" y="133" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Pod do job</text>
<rect x="440" y="146" width="180" height="26" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="530" y="164" font-size="12" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">meu-servico:1.2.3</text>
<text x="530" y="196" font-size="12" fill="#4b5563" text-anchor="middle">perfil batch: só o lote, sem web</text>
<text x="530" y="220" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">roda o lote e termina</text>
<text x="530" y="242" font-size="12" fill="#6b7280" text-anchor="middle">reserva recurso só durante a execução</text>

<!-- Tópico SNS -->
<path d="M672 150 H768" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="712" y="132" font-size="12" fill="#4b5563" text-anchor="middle">4. publica</text>
<rect x="770" y="120" width="150" height="60" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="845" y="155" font-size="15" font-weight="700" fill="#2b7fc4" text-anchor="middle">Tópico SNS</text>

<!-- Banco -->
<path d="M530 258 V346" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="542" y="296" font-size="12" fill="#4b5563">3. lê os pendentes</text>
<text x="542" y="312" font-size="12" fill="#4b5563">5. marca como enviado</text>
<path d="M460 360 V420 a70 12 0 0 0 140 0 V360" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<ellipse cx="530" cy="360" rx="70" ry="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="530" y="400" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Banco</text>

<!-- Deployment da API -->
<rect x="20" y="330" width="270" height="130" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="155" y="356" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Deployment da API</text>
<rect x="65" y="368" width="180" height="26" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="155" y="386" font-size="12" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">meu-servico:1.2.3</text>
<text x="155" y="416" font-size="13" fill="#4b5563" text-anchor="middle">perfil padrão: servidor web</text>
<text x="155" y="438" font-size="13" fill="#4b5563" text-anchor="middle">atende HTTP o dia todo</text>
<path d="M292 395 H458" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/>
<text x="375" y="385" font-size="12" fill="#6b7280" text-anchor="middle">mesmo banco</text>

<text x="470" y="492" font-size="13" fill="#6b7280" text-anchor="middle">Um deploy da API não interrompe o job em andamento; a próxima execução usa a imagem que estiver no CronJob</text>
</svg>
