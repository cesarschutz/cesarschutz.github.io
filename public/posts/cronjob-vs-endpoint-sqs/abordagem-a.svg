<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 494" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="494" fill="#ffffff"/>
<defs>
<marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4b5563"/></marker>
</defs>

<text x="470" y="46" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">Abordagem A: CronJob com a mesma imagem da API e o perfil batch</text>
<text x="470" y="72" font-size="14" fill="#6b7280" text-anchor="middle">o job roda num pod próprio, que nasce no horário agendado e termina com um exit code</text>

<!-- CronJob -->
<rect x="30" y="155" width="110" height="70" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="85" y="183" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">CronJob</text>
<text x="85" y="206" font-size="13" fill="#4b5563" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">03:00</text>
<path d="M142 190 H183" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="162" y="172" font-size="12" fill="#4b5563" text-anchor="middle">cria</text>

<!-- Job -->
<rect x="185" y="155" width="80" height="70" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="225" y="195" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Job</text>
<path d="M267 190 H308" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="287" y="172" font-size="12" fill="#4b5563" text-anchor="middle">sobe</text>

<!-- Pod do job -->
<rect x="310" y="120" width="330" height="140" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="475" y="156" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Pod do job</text>
<text x="475" y="182" font-size="14" fill="#4b5563" text-anchor="middle">a mesma imagem da API</text>
<text x="475" y="204" font-size="14" fill="#4b5563" text-anchor="middle">perfil batch, sem camada web</text>
<text x="475" y="236" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">executa o job com Spring Batch e termina</text>

<!-- Tópico SNS -->
<path d="M642 148 H738" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="685" y="138" font-size="12" fill="#4b5563" text-anchor="middle">publica</text>
<rect x="740" y="120" width="170" height="56" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="825" y="153" font-size="15" font-weight="700" fill="#2b7fc4" text-anchor="middle">Tópico SNS</text>

<!-- Kubernetes -->
<path d="M642 228 H738" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="685" y="218" font-size="12" fill="#4b5563" text-anchor="middle">exit code</text>
<rect x="740" y="196" width="170" height="64" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="825" y="222" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Kubernetes</text>
<text x="825" y="244" font-size="13" fill="#4b5563" text-anchor="middle">Job: sucesso ou falha</text>

<!-- Banco -->
<path d="M475 262 V336" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="487" y="304" font-size="13" fill="#4b5563">lê os pendentes e marca o status</text>
<path d="M405 350 V410 a70 12 0 0 0 140 0 V350" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<ellipse cx="475" cy="350" rx="70" ry="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="475" y="390" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Banco</text>

<!-- Deployment da API -->
<rect x="30" y="335" width="260" height="90" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="160" y="365" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Deployment da API</text>
<text x="160" y="388" font-size="13" fill="#4b5563" text-anchor="middle">perfil padrão, atende HTTP</text>
<text x="160" y="410" font-size="13" font-weight="700" fill="#2b7fc4" text-anchor="middle">não é tocado pelo job</text>
<path d="M292 380 H403" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/>
<text x="347" y="370" font-size="12" fill="#6b7280" text-anchor="middle">mesmo banco</text>

<text x="470" y="466" font-size="13" fill="#6b7280" text-anchor="middle">O deploy da API não toca no pod do job: o job de hoje termina com a versão com que começou, e a nova entra na próxima execução</text>
</svg>
