<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 728" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="728" fill="#ffffff"/>
<defs>
<marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#4b5563"/></marker>
<marker id="mg" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#2e9e5b"/></marker>
<marker id="mt" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#9ca3af"/></marker>
</defs>

<text x="470" y="42" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">Abordagem A: o gatilho já nasce idempotente</text>
<text x="470" y="68" font-size="14" fill="#6b7280" text-anchor="middle">o nome do Job leva o horário agendado, em minutos desde 1970; repetir a criação não cria outro Job</text>

<!-- raias -->
<g font-size="15" font-weight="700" text-anchor="middle">
<rect x="45" y="92" width="180" height="44" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="135" y="120" fill="#374151">CronJob</text>
<rect x="275" y="92" width="180" height="44" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="365" y="120" fill="#374151">API do Kubernetes</text>
<rect x="505" y="92" width="180" height="44" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="595" y="120" fill="#2e9e5b">Pod do job</text>
<rect x="735" y="92" width="180" height="44" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="825" y="120" fill="#2b7fc4">JobRepository</text>
</g>
<g stroke="#d1d5db" stroke-width="2" stroke-dasharray="4 6">
<path d="M135 136 V624"/><path d="M365 136 V624"/><path d="M595 136 V624"/><path d="M825 136 V624"/>
</g>

<!-- eixo do tempo -->
<path d="M34 160 V614" stroke="#9ca3af" stroke-width="2" marker-end="url(#mt)"/>
<text x="0" y="0" font-size="13" fill="#6b7280" text-anchor="middle" transform="translate(24 387) rotate(-90)">tempo</text>

<!-- 1 cria o Job -->
<path d="M137 192 H363" stroke="#4b5563" stroke-width="2.5" marker-end="url(#m)"/>
<text x="250" y="158" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">cria o Job</text>
<text x="250" y="174" font-size="12" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">enviar-registros-29837160</text>

<!-- 2 resposta perdida -->
<path d="M363 248 H215" stroke="#d9534f" stroke-width="2.5" stroke-dasharray="6 5"/>
<path d="M192 240 L208 256 M208 240 L192 256" stroke="#d9534f" stroke-width="3"/>
<text x="275" y="214" font-size="12" font-weight="700" fill="#d9534f" text-anchor="middle">201 Created,</text>
<text x="275" y="230" font-size="12" font-weight="700" fill="#d9534f" text-anchor="middle">mas a resposta se perde</text>

<!-- 3 nota: nova tentativa -->
<rect x="55" y="274" width="160" height="48" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="135" y="294" font-size="13" fill="#111827" text-anchor="middle">nova tentativa para</text>
<text x="135" y="313" font-size="13" fill="#111827" text-anchor="middle">o mesmo horário</text>

<!-- 4 cria o mesmo Job -->
<path d="M137 378 H363" stroke="#4b5563" stroke-width="2.5" marker-end="url(#m)"/>
<text x="250" y="344" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">cria o Job</text>
<text x="250" y="360" font-size="12" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">enviar-registros-29837160</text>

<!-- 5 AlreadyExists -->
<path d="M363 436 H139" stroke="#2e9e5b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#mg)"/>
<text x="250" y="406" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">409 AlreadyExists:</text>
<text x="250" y="423" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">nenhum Job novo</text>

<!-- 6 sobe o pod -->
<path d="M367 476 H593" stroke="#4b5563" stroke-width="2.5" marker-end="url(#m)"/>
<text x="470" y="463" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">o Job já criado sobe o pod</text>

<!-- 7 registra a execução -->
<path d="M597 516 H823" stroke="#4b5563" stroke-width="2.5" marker-end="url(#m)"/>
<text x="700" y="506" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">registra a execução do dia</text>

<!-- 8 nota: processa -->
<rect x="470" y="534" width="250" height="34" rx="10" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="595" y="556" font-size="13" fill="#111827" text-anchor="middle">processa o lote e termina</text>

<!-- 9 exit code -->
<path d="M593 602 H367" stroke="#4b5563" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m)"/>
<text x="485" y="592" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">exit code 0</text>

<!-- resultado -->
<rect x="45" y="644" width="850" height="60" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="470" y="668" font-size="15" font-weight="700" fill="#2e9e5b" text-anchor="middle">Um Job só: o nome derivado do horário é a chave de idempotência</text>
<text x="470" y="690" font-size="13" fill="#4b5563" text-anchor="middle">é a chave que a B teria de construir; se um dia surgir um segundo pod para a mesma data, o JobRepository recusa</text>
</svg>
