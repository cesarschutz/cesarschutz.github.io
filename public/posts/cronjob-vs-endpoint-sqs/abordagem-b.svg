<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="620" fill="#ffffff"/>
<defs>
<marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4b5563"/></marker>
</defs>

<text x="470" y="46" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">Abordagem B: endpoint + SQS consumido na própria API</text>
<text x="470" y="72" font-size="14" fill="#6b7280" text-anchor="middle">o CronJob chama um endpoint, que enfileira; o processamento roda nos pods que atendem as requisições</text>

<!-- CronJob -->
<rect x="40" y="147" width="150" height="70" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="115" y="175" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">CronJob</text>
<text x="115" y="198" font-size="13" fill="#4b5563" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">03:00</text>
<path d="M192 168 H336" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="264" y="158" font-size="11" fill="#4b5563" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">curl POST /processar</text>

<!-- Pods da API -->
<rect x="300" y="110" width="300" height="240" rx="14" fill="none" stroke="#2b7fc4" stroke-width="2" stroke-dasharray="8 6"/>
<text x="312" y="132" font-size="14" font-weight="700" fill="#2b7fc4">Pods da API</text>

<rect x="340" y="150" width="240" height="64" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="460" y="176" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Endpoint</text>
<text x="460" y="198" font-size="13" fill="#4b5563" text-anchor="middle">responde 202 Accepted</text>

<rect x="340" y="250" width="240" height="64" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="460" y="276" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Listener SQS</text>
<text x="460" y="298" font-size="13" fill="#4b5563" text-anchor="middle">processa registro a registro</text>

<!-- Endpoint lê a lista no banco -->
<path d="M340 200 H290 V455 H256" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="284" y="330" font-size="12" fill="#4b5563" text-anchor="end">lê a lista</text>

<!-- Listener marca o status -->
<path d="M360 314 V495 H256" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="368" y="400" font-size="12" fill="#4b5563">marca status</text>

<!-- Banco -->
<path d="M110 445 V505 a70 12 0 0 0 140 0 V445" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<ellipse cx="180" cy="445" rx="70" ry="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="180" y="484" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Banco</text>

<!-- Listener publica no SNS -->
<path d="M470 314 V466" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="478" y="400" font-size="12" fill="#4b5563">publica</text>
<rect x="440" y="470" width="180" height="64" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="530" y="497" font-size="15" font-weight="700" fill="#2b7fc4" text-anchor="middle">Tópico SNS</text>
<text x="530" y="518" font-size="12" fill="#4b5563" text-anchor="middle">destino dos registros</text>

<!-- Endpoint enfileira -->
<path d="M582 182 H666" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="624" y="174" font-size="12" fill="#4b5563" text-anchor="middle">enfileira</text>
<rect x="670" y="150" width="190" height="64" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2"/>
<text x="765" y="176" font-size="15" font-weight="700" fill="#e07a1f" text-anchor="middle">Fila SQS</text>
<text x="765" y="198" font-size="12" fill="#4b5563" text-anchor="middle">mensagens a processar</text>

<!-- Fila entrega ao listener -->
<path d="M700 214 V282 H584" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="708" y="252" font-size="12" fill="#4b5563">entrega</text>

<!-- Fila -> DLQ e redrive -->
<path d="M840 214 V466" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="848" y="345" font-size="12" fill="#4b5563">após N falhas</text>
<path d="M770 470 V218" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/>
<text x="762" y="345" font-size="12" fill="#6b7280" text-anchor="end">redrive</text>
<rect x="700" y="470" width="160" height="64" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2"/>
<text x="780" y="497" font-size="15" font-weight="700" fill="#d9534f" text-anchor="middle">DLQ</text>
<text x="780" y="518" font-size="12" fill="#4b5563" text-anchor="middle">mensagens que falharam</text>

<text x="470" y="590" font-size="13" fill="#6b7280" text-anchor="middle">Batch e requisições dividem o mesmo processo: pool de conexões, CPU e heap</text>
</svg>
