<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="580" fill="#ffffff"/>
<defs>
<marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4b5563"/></marker>
</defs>

<text x="470" y="46" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">Abordagem B: endpoint + SQS consumido na própria API</text>
<text x="470" y="72" font-size="14" fill="#6b7280" text-anchor="middle">o CronJob chama um endpoint, que enfileira; o processamento roda nos pods que atendem as requisições</text>

<!-- CronJob -->
<rect x="40" y="125" width="110" height="70" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="95" y="153" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">CronJob</text>
<text x="95" y="176" font-size="13" fill="#4b5563" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">03:00</text>
<path d="M152 160 H333" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="225" y="150" font-size="11" fill="#4b5563" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">curl POST /processar</text>

<!-- Pods da API -->
<rect x="300" y="104" width="280" height="236" rx="14" fill="none" stroke="#2b7fc4" stroke-width="2" stroke-dasharray="8 6"/>
<text x="316" y="128" font-size="14" font-weight="700" fill="#2b7fc4">Pods da API</text>

<rect x="335" y="144" width="210" height="64" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="440" y="170" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Endpoint</text>
<text x="440" y="192" font-size="13" fill="#4b5563" text-anchor="middle">responde 202 Accepted</text>

<rect x="335" y="248" width="210" height="64" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="440" y="274" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Listener SQS</text>
<text x="440" y="296" font-size="13" fill="#4b5563" text-anchor="middle">processa registro a registro</text>

<!-- Endpoint lê a lista no banco -->
<path d="M335 192 H270 V452 H222" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="262" y="326" font-size="12" fill="#4b5563" text-anchor="end">lê a lista</text>

<!-- Listener marca o status -->
<path d="M350 312 V488 H222" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="358" y="392" font-size="12" fill="#4b5563">marca status</text>

<!-- Banco -->
<path d="M80 440 V500 a70 12 0 0 0 140 0 V440" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<ellipse cx="150" cy="440" rx="70" ry="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="150" y="480" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Banco</text>

<!-- Listener publica no SNS -->
<path d="M460 314 V438" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="468" y="392" font-size="12" fill="#4b5563">publica</text>
<rect x="370" y="440" width="180" height="64" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="460" y="467" font-size="15" font-weight="700" fill="#2b7fc4" text-anchor="middle">Tópico SNS</text>
<text x="460" y="489" font-size="13" fill="#4b5563" text-anchor="middle">destino dos registros</text>

<!-- Endpoint enfileira -->
<path d="M547 176 H668" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="615" y="166" font-size="12" fill="#4b5563" text-anchor="middle">enfileira</text>
<rect x="670" y="144" width="200" height="64" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2"/>
<text x="770" y="170" font-size="15" font-weight="700" fill="#e07a1f" text-anchor="middle">Fila SQS</text>
<text x="770" y="192" font-size="13" fill="#4b5563" text-anchor="middle">mensagens a processar</text>

<!-- Fila entrega ao listener -->
<path d="M690 208 V280 H547" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="698" y="248" font-size="12" fill="#4b5563">entrega</text>

<!-- Fila -> DLQ e redrive -->
<path d="M780 208 V438" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="772" y="360" font-size="12" fill="#4b5563" text-anchor="end">após N falhas</text>
<path d="M840 440 V210" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/>
<text x="848" y="360" font-size="12" fill="#6b7280">redrive</text>
<rect x="670" y="440" width="200" height="64" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2"/>
<text x="770" y="467" font-size="15" font-weight="700" fill="#d9534f" text-anchor="middle">DLQ</text>
<text x="770" y="489" font-size="13" fill="#4b5563" text-anchor="middle">mensagens que falharam</text>

<text x="470" y="552" font-size="13" fill="#6b7280" text-anchor="middle">Batch e requisições dividem o mesmo processo: pool de conexões, CPU e heap</text>
</svg>
