<text x="280" y="122" font-size="13" fill="#6b7280" text-anchor="middle">sem copiar para um DW separado</text>

<rect x="510" y="70" width="300" height="70" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2.5"/>
<text x="660" y="99" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">ML · ciência de dados</text>
<text x="660" y="122" font-size="13" fill="#6b7280" text-anchor="middle">leitura direta dos arquivos abertos</text>

<path d="M280 142 V180" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M660 142 V180" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/>

