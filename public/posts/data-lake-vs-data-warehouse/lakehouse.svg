<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="430" fill="#ffffff"/>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#4b5563"/></marker>
</defs>
<text x="30" y="42" font-size="21" font-weight="700" fill="#111827">Lakehouse: uma cópia dos dados, lida como tabela</text>

