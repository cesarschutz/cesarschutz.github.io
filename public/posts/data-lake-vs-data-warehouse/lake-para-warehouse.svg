<text x="130" y="210" font-size="13" fill="#6b7280" text-anchor="middle">apps · logs · eventos</text>
<path d="M222 195 H268" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#m)"/>

<!-- lake -->
<path d="M280 130 C280 95 340 80 400 90 C470 70 520 100 515 140 C535 190 480 225 420 215 C350 240 280 210 280 160 Z" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="3"/>
