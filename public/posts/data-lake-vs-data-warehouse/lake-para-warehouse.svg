<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
<marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#4b5563"/></marker>
</defs>
<text x="30" y="42" font-size="21" font-weight="700" fill="#111827">Lake e Warehouse trabalham juntos</text>

<!-- fontes -->
<rect x="40" y="150" width="180" height="90" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/>
