<text x="400" y="165" font-size="13" fill="#6b7280" text-anchor="middle">bruto · schema-on-read</text>
<text x="400" y="187" font-size="13" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">json · csv · parquet</text>

<!-- ELT -->
<path d="M528 160 H610" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#m)"/>
<rect x="530" y="120" width="76" height="26" rx="13" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="568" y="138" font-size="13" font-weight="700" fill="#4b5563" text-anchor="middle">ELT</text>

<!-- warehouse -->
<rect x="620" y="90" width="280" height="150" rx="14" fill="#fdf1e3" stroke="#e07a1f" stroke-width="3"/>
<g stroke="#e07a1f" stroke-opacity="0.5" stroke-width="1.5">
<line x1="620" y1="140" x2="900" y2="140"/><line x1="620" y1="190" x2="900" y2="190"/><line x1="760" y1="90" x2="760" y2="240"/>
</g>
<text x="760" y="122" font-size="16" font-weight="800" fill="#1f2937" text-anchor="middle">Data Warehouse</text>
<text x="690" y="170" font-size="13" fill="#6b7280" text-anchor="middle">estruturado</text>
<text x="830" y="170" font-size="13" fill="#6b7280" text-anchor="middle">schema-on-write</text>
<text x="690" y="220" font-size="13" fill="#6b7280" text-anchor="middle">otimizado</text>
<text x="830" y="220" font-size="13" fill="#6b7280" text-anchor="middle">para query</text>

<!-- consumidores -->
