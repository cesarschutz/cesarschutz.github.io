<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="380" fill="#ffffff"/>
<text x="30" y="42" font-size="21" font-weight="700" fill="#111827">As três partes de um JWT assinado (JWS compacto)</text>

<!-- header -->
<rect x="50" y="80" width="250" height="130" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="3"/>
<text x="175" y="120" font-size="17" font-weight="800" fill="#2b7fc4" text-anchor="middle">header</text>
<text x="175" y="146" font-size="13" fill="#4b5563" text-anchor="middle">JSON · como foi assinado</text>
<text x="175" y="176" font-size="14" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">alg · typ · kid</text>

<circle cx="322" cy="145" r="5" fill="#4b5563"/>

<!-- payload -->
<rect x="345" y="80" width="250" height="130" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="3"/>
<text x="470" y="120" font-size="17" font-weight="800" fill="#e07a1f" text-anchor="middle">payload</text>
<text x="470" y="146" font-size="13" fill="#4b5563" text-anchor="middle">JSON · as claims</text>
<text x="470" y="176" font-size="14" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">iss · sub · aud · exp · jti</text>

<circle cx="617" cy="145" r="5" fill="#4b5563"/>

<!-- signature -->
<rect x="640" y="80" width="250" height="130" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="3"/>
<text x="765" y="120" font-size="17" font-weight="800" fill="#d9534f" text-anchor="middle">signature</text>
<text x="765" y="146" font-size="13" fill="#4b5563" text-anchor="middle">bytes, não JSON</text>
<text x="765" y="176" font-size="13" fill="#1f2937" text-anchor="middle">calculada sobre header.payload</text>

<text x="470" y="250" font-size="14" fill="#4b5563" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">base64url(header) . base64url(payload) . base64url(assinatura)</text>

<!-- trecho de token real, colorido por parte -->
<rect x="50" y="272" width="840" height="46" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="470" y="301" font-size="15" text-anchor="middle" font-family="ui-monospace, Menlo, monospace"><tspan fill="#2b7fc4" font-weight="700">eyJhbGciOiJFUzI1NiIs…</tspan><tspan fill="#111827" font-weight="700"> . </tspan><tspan fill="#e07a1f" font-weight="700">eyJpc3MiOiJodHRwczov…</tspan><tspan fill="#111827" font-weight="700"> . </tspan><tspan fill="#d9534f" font-weight="700">w0ZR2vAkxfA7kkGq…</tspan></text>

<text x="470" y="352" font-size="13" fill="#4b5563" text-anchor="middle">codificado ≠ criptografado: quem tem o token lê o payload; a assinatura garante integridade e autenticidade, não sigilo</text>
</svg>
