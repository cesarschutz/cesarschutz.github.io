<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 815" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="720" height="815" fill="#ffffff"/>
<defs>
<marker id="mb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b7fc4"/></marker>
<marker id="mo" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e07a1f"/></marker>
<marker id="mr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d9534f"/></marker>
</defs>

<rect x="24" y="22" width="6" height="26" fill="#2ec4a6"/>
<text x="42" y="43" font-size="20" font-weight="700" fill="#1a1a1a">Por que o retry cobra duas vezes</text>
<text x="696" y="41" font-size="11" fill="#9a9a9a" text-anchor="end">Sessão 00 · desenho errado</text>

<rect x="60" y="88" width="220" height="64" rx="10" fill="#f4f9ff" stroke="#2b7fc4" stroke-width="2"/>
<text x="170" y="114" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">App do cliente</text>
<text x="170" y="133" font-size="10" fill="#6b7280" text-anchor="middle">pedido 123 · R$ 250</text>

<rect x="440" y="88" width="220" height="64" rx="10" fill="#e8f8f5" stroke="#2ec4a6" stroke-width="2"/>
<text x="550" y="114" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Gateway / Load Balancer</text>
<text x="550" y="133" font-size="10" fill="#6b7280" text-anchor="middle">distribui entre as instâncias</text>

<line x1="282" y1="110" x2="433" y2="110" stroke="#2b7fc4" stroke-width="2.5" marker-end="url(#mb)"/>
<text x="357" y="101" font-size="11" font-weight="600" fill="#2b7fc4" text-anchor="middle">1. POST /cobranca</text>
<text x="357" y="128" font-size="9" fill="#9a9a9a" text-anchor="middle">resposta se perdeu no timeout</text>
<line x1="282" y1="142" x2="433" y2="142" stroke="#e07a1f" stroke-width="2.5" marker-end="url(#mo)"/>
<text x="357" y="166" font-size="11" font-weight="600" fill="#e07a1f" text-anchor="middle">2. retry, mesmo pedido</text>

<rect x="40" y="204" width="640" height="220" rx="12" fill="none" stroke="#d9534f" stroke-width="2" stroke-dasharray="8 6"/>
<text x="48" y="197" font-size="11" font-weight="700" fill="#d9534f">janela de corrida</text>

<path d="M 500 156 L 250 222" fill="none" stroke="#2b7fc4" stroke-width="2.5" marker-end="url(#mb)"/>
<text x="310" y="200" font-size="11" font-weight="600" fill="#2b7fc4" text-anchor="end">3.1 vai para A</text>
<path d="M 560 156 L 520 222" fill="none" stroke="#e07a1f" stroke-width="2.5" marker-end="url(#mo)"/>
<text x="575" y="200" font-size="11" font-weight="600" fill="#e07a1f" text-anchor="start">3.2 vai para B</text>

<rect x="70" y="226" width="250" height="62" rx="10" fill="#eaf4fd" stroke="#2b7fc4" stroke-width="2"/>
<text x="195" y="251" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Autorização — instância A</text>
<text x="195" y="270" font-size="10" fill="#6b7280" text-anchor="middle">verifica antes de gravar</text>

<rect x="400" y="226" width="250" height="62" rx="10" fill="#fdf1e6" stroke="#e07a1f" stroke-width="2"/>
<text x="525" y="251" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Autorização — instância B</text>
<text x="525" y="270" font-size="10" fill="#6b7280" text-anchor="middle">verifica antes de gravar</text>

<rect x="70" y="306" width="250" height="42" rx="8" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="195" y="323" font-size="11" font-weight="700" fill="#2b7fc4" text-anchor="middle">4.1  A: SELECT pedido 123</text>
<text x="195" y="339" font-size="9.5" fill="#6b7280" text-anchor="middle">não encontrou nada</text>

<rect x="400" y="306" width="250" height="42" rx="8" fill="#ffffff" stroke="#e07a1f" stroke-width="1.5"/>
<text x="525" y="323" font-size="11" font-weight="700" fill="#e07a1f" text-anchor="middle">4.2  B: SELECT pedido 123</text>
<text x="525" y="339" font-size="9.5" fill="#6b7280" text-anchor="middle">não encontrou nada</text>

<rect x="70" y="354" width="250" height="42" rx="8" fill="#eaf4fd" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="195" y="371" font-size="11" font-weight="700" fill="#2b7fc4" text-anchor="middle">5.1  A: INSERT</text>
<text x="195" y="387" font-size="9.5" fill="#6b7280" text-anchor="middle">captura R$ 250</text>

<rect x="400" y="354" width="250" height="42" rx="8" fill="#fdf1e6" stroke="#e07a1f" stroke-width="1.5"/>
<text x="525" y="371" font-size="11" font-weight="700" fill="#e07a1f" text-anchor="middle">5.2  B: INSERT</text>
<text x="525" y="387" font-size="9.5" fill="#6b7280" text-anchor="middle">captura R$ 250</text>

<text x="360" y="414" font-size="10" font-weight="600" fill="#d9534f" text-anchor="middle">as duas leituras terminaram antes da primeira escrita</text>

<path d="M 360 428 L 360 464" fill="none" stroke="#d9534f" stroke-width="2.5" marker-end="url(#mr)"/>

<rect x="120" y="470" width="480" height="150" rx="10" fill="#fdeaea" stroke="#ee8b8b" stroke-width="2"/>
<rect x="120" y="470" width="480" height="34" rx="10" fill="#f4a6a6"/>
<rect x="120" y="490" width="480" height="14" fill="#f4a6a6"/>
<text x="360" y="492" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Postgres — tabela cobrancas</text>
<rect x="142" y="516" width="436" height="26" rx="6" fill="#ffffff" stroke="#ee8b8b" stroke-width="1.5"/>
<text x="156" y="533" font-size="10.5" fill="#1a1a1a">id 9001 · pedido 123 · R$ 250 · CAPTURADO</text>
<rect x="142" y="548" width="436" height="26" rx="6" fill="#ffffff" stroke="#ee8b8b" stroke-width="1.5"/>
<text x="156" y="565" font-size="10.5" fill="#1a1a1a">id 9002 · pedido 123 · R$ 250 · CAPTURADO</text>
<text x="360" y="598" font-size="10" font-weight="600" fill="#d9534f" text-anchor="middle">sem restrição única em pedido — o banco aceitou as duas</text>

<path d="M 360 624 L 360 656" fill="none" stroke="#d9534f" stroke-width="2.5" marker-end="url(#mr)"/>

<rect x="120" y="660" width="480" height="52" rx="10" fill="#fdeaea" stroke="#d9534f" stroke-width="2"/>
<text x="360" y="682" font-size="13" font-weight="700" fill="#d9534f" text-anchor="middle">Cliente cobrado 2× · R$ 500</text>
<text x="360" y="700" font-size="10" fill="#6b7280" text-anchor="middle">estorno manual, chargeback e uma noite ruim de plantão</text>

<rect x="40" y="736" width="640" height="44" rx="10" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="62" y1="762" x2="96" y2="762" stroke="#2b7fc4" stroke-width="2.5" marker-end="url(#mb)"/>
<text x="106" y="766" font-size="10" fill="#4b5563">requisição 1</text>
<line x1="240" y1="762" x2="274" y2="762" stroke="#e07a1f" stroke-width="2.5" marker-end="url(#mo)"/>
<text x="284" y="766" font-size="10" fill="#4b5563">retry (requisição 2)</text>
<rect x="440" y="756" width="34" height="12" rx="3" fill="none" stroke="#d9534f" stroke-width="2" stroke-dasharray="5 4"/>
<text x="484" y="766" font-size="10" fill="#4b5563">janela de corrida</text>
<text x="40" y="800" font-size="9" fill="#9a9a9a">estilo inspirado em ByteByteGo</text>
</svg>
