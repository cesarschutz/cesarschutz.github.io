<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 770" width="720" height="770" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="720" height="770" fill="#ffffff"/>
<defs>
<marker id="gb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b7fc4"/></marker>
<marker id="go" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e07a1f"/></marker>
<marker id="gg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2a9d78"/></marker>
<marker id="gr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d9534f"/></marker>
</defs>

<rect x="24" y="22" width="6" height="26" fill="#2ec4a6"/>
<text x="42" y="43" font-size="20" font-weight="700" fill="#1a1a1a">Como a chave de idempotência resolve</text>
<text x="696" y="41" font-size="11" fill="#9a9a9a" text-anchor="end">Sessão 00 · desenho corrigido</text>

<rect x="60" y="88" width="220" height="76" rx="10" fill="#f4f9ff" stroke="#2b7fc4" stroke-width="2"/>
<text x="170" y="112" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">App do cliente</text>
<rect x="76" y="122" width="188" height="26" rx="6" fill="#fcd979"/>
<text x="170" y="140" font-size="10" font-weight="600" fill="#1a1a1a" text-anchor="middle">Idempotency-Key: 7f3a-9c</text>

<rect x="440" y="88" width="220" height="76" rx="10" fill="#e8f8f5" stroke="#2ec4a6" stroke-width="2"/>
<text x="550" y="120" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Gateway / Load Balancer</text>
<text x="550" y="140" font-size="10" fill="#6b7280" text-anchor="middle">a chave viaja nas duas</text>

<line x1="282" y1="112" x2="433" y2="112" stroke="#2b7fc4" stroke-width="2.5" marker-end="url(#gb)"/>
<text x="357" y="103" font-size="11" font-weight="600" fill="#2b7fc4" text-anchor="middle">1. POST + chave</text>
<line x1="282" y1="146" x2="433" y2="146" stroke="#e07a1f" stroke-width="2.5" marker-end="url(#go)"/>
<text x="357" y="176" font-size="11" font-weight="600" fill="#e07a1f" text-anchor="middle">2. retry, mesma chave</text>

<path d="M 500 168 L 250 226" fill="none" stroke="#2b7fc4" stroke-width="2.5" marker-end="url(#gb)"/>
<text x="300" y="206" font-size="11" font-weight="600" fill="#2b7fc4" text-anchor="end">3.1 vai para A</text>
<path d="M 560 168 L 520 226" fill="none" stroke="#e07a1f" stroke-width="2.5" marker-end="url(#go)"/>
<text x="575" y="206" font-size="11" font-weight="600" fill="#e07a1f" text-anchor="start">3.2 vai para B</text>

<rect x="70" y="230" width="250" height="62" rx="10" fill="#eaf4fd" stroke="#2b7fc4" stroke-width="2"/>
<text x="195" y="255" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Autorização — instância A</text>
<text x="195" y="274" font-size="10" fill="#6b7280" text-anchor="middle">grava direto, sem checar antes</text>

<rect x="400" y="230" width="250" height="62" rx="10" fill="#fdf1e6" stroke="#e07a1f" stroke-width="2"/>
<text x="525" y="255" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Autorização — instância B</text>
<text x="525" y="274" font-size="10" fill="#6b7280" text-anchor="middle">grava direto, sem checar antes</text>

<rect x="70" y="318" width="250" height="52" rx="8" fill="#eaf7f1" stroke="#2a9d78" stroke-width="1.5"/>
<text x="195" y="338" font-size="11" font-weight="700" fill="#2a9d78" text-anchor="middle">4.1  A: INSERT com a chave</text>
<text x="195" y="356" font-size="9.5" fill="#4b5563" text-anchor="middle">passou · captura R$ 250 · guarda resposta</text>

<rect x="400" y="318" width="250" height="52" rx="8" fill="#fdeaea" stroke="#d9534f" stroke-width="1.5"/>
<text x="525" y="338" font-size="11" font-weight="700" fill="#d9534f" text-anchor="middle">4.2  B: INSERT com a mesma chave</text>
<text x="525" y="356" font-size="9.5" fill="#4b5563" text-anchor="middle">violação de unicidade · não captura</text>

<path d="M 195 374 L 230 420" fill="none" stroke="#2a9d78" stroke-width="2.5" marker-end="url(#gg)"/>
<path d="M 525 374 L 490 420" fill="none" stroke="#d9534f" stroke-width="2.5" marker-end="url(#gr)"/>

<rect x="120" y="424" width="480" height="150" rx="10" fill="#eaf7f1" stroke="#2a9d78" stroke-width="2"/>
<rect x="120" y="424" width="480" height="34" rx="10" fill="#8fd6b8"/>
<rect x="120" y="444" width="480" height="14" fill="#8fd6b8"/>
<text x="360" y="446" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Postgres — tabela cobrancas</text>
<rect x="142" y="470" width="436" height="26" rx="6" fill="#ffffff" stroke="#2a9d78" stroke-width="1.5"/>
<text x="156" y="487" font-size="10.5" font-weight="600" fill="#1a1a1a">UNIQUE (idempotency_key) — o banco é quem garante</text>
<rect x="142" y="502" width="436" height="26" rx="6" fill="#ffffff" stroke="#2a9d78" stroke-width="1.5"/>
<text x="156" y="519" font-size="10.5" fill="#1a1a1a">id 9001 · chave 7f3a-9c · R$ 250 · CAPTURADO</text>
<text x="360" y="552" font-size="10" font-weight="600" fill="#2a9d78" text-anchor="middle">B lê essa linha e devolve exatamente a mesma resposta ao cliente</text>

<path d="M 360 578 L 360 606" fill="none" stroke="#2a9d78" stroke-width="2.5" marker-end="url(#gg)"/>

<rect x="120" y="610" width="480" height="52" rx="10" fill="#eaf7f1" stroke="#2a9d78" stroke-width="2"/>
<text x="360" y="632" font-size="13" font-weight="700" fill="#2a9d78" text-anchor="middle">Cliente cobrado 1× · R$ 250</text>
<text x="360" y="650" font-size="10" fill="#6b7280" text-anchor="middle">quantos retries vierem, a resposta é sempre a mesma</text>

<rect x="40" y="686" width="640" height="44" rx="10" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="62" y1="712" x2="96" y2="712" stroke="#2b7fc4" stroke-width="2.5" marker-end="url(#gb)"/>
<text x="106" y="716" font-size="10" fill="#4b5563">tentativa 1</text>
<line x1="240" y1="712" x2="274" y2="712" stroke="#e07a1f" stroke-width="2.5" marker-end="url(#go)"/>
<text x="284" y="716" font-size="10" fill="#4b5563">retry</text>
<line x1="420" y1="712" x2="454" y2="712" stroke="#2a9d78" stroke-width="2.5" marker-end="url(#gg)"/>
<text x="464" y="716" font-size="10" fill="#4b5563">caminho que vence</text>
<text x="40" y="750" font-size="9" fill="#9a9a9a">estilo inspirado em ByteByteGo</text>
</svg>
