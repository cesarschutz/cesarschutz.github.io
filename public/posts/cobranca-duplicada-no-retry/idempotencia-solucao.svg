<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 820" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="940" height="820" fill="#ffffff"/>
  <text x="40" y="44" font-size="21" font-weight="700" fill="#111827">Como a chave de idempotência resolve</text>

  <rect x="40" y="76" width="300" height="84" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
  <text x="190" y="102" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">App do cliente</text>
  <rect x="58" y="116" width="264" height="30" rx="8" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
  <text x="190" y="136" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Idempotency-Key: 5b0e7a52…</text>

  <rect x="600" y="76" width="300" height="84" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="750" y="110" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Load balancer</text>
  <text x="750" y="133" font-size="13" fill="#4b5563" text-anchor="middle">a chave vai nas duas tentativas</text>

  <line x1="342" y1="104" x2="592" y2="104" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
  <text x="470" y="95" font-size="13" font-weight="700" fill="#2b7fc4" text-anchor="middle">1. POST + chave</text>
  <line x1="342" y1="134" x2="592" y2="134" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
  <text x="470" y="152" font-size="13" font-weight="700" fill="#e07a1f" text-anchor="middle">2. reenvio, mesma chave</text>

  <line x1="690" y1="162" x2="258" y2="232" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
  <text x="490" y="184" font-size="13" font-weight="700" fill="#2b7fc4" text-anchor="end">3a. cai na instância A</text>
  <line x1="790" y1="162" x2="700" y2="232" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
  <text x="760" y="208" font-size="13" font-weight="700" fill="#e07a1f">3b. cai na B</text>

  <rect x="60" y="236" width="380" height="60" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
  <text x="250" y="261" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Instância A</text>
  <text x="250" y="283" font-size="13" fill="#4b5563" text-anchor="middle">grava a chave direto, sem consultar antes</text>
  <rect x="500" y="236" width="380" height="60" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2"/>
  <text x="690" y="261" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Instância B</text>
  <text x="690" y="283" font-size="13" fill="#4b5563" text-anchor="middle">grava a chave direto, sem consultar antes</text>

  <rect x="60" y="312" width="380" height="78" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="250" y="336" font-size="14" font-weight="700" fill="#2e9e5b" text-anchor="middle">4a. INSERT … ON CONFLICT DO NOTHING</text>
  <text x="250" y="357" font-size="13" fill="#111827" text-anchor="middle">1 linha: é a primeira tentativa</text>
  <text x="250" y="377" font-size="13" fill="#4b5563" text-anchor="middle">commit, captura R$ 250, guarda a resposta</text>
  <rect x="500" y="312" width="380" height="78" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
  <text x="690" y="336" font-size="14" font-weight="700" fill="#d9534f" text-anchor="middle">4b. o mesmo INSERT, a mesma chave</text>
  <text x="690" y="357" font-size="13" fill="#111827" text-anchor="middle">0 linhas: a chave já existe</text>
  <text x="690" y="377" font-size="13" fill="#4b5563" text-anchor="middle">não captura; lê o registro</text>

  <line x1="250" y1="392" x2="330" y2="432" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="690" y1="392" x2="610" y2="432" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="150" y="436" width="640" height="118" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
  <text x="470" y="464" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">PostgreSQL · tabela cobranca</text>
  <rect x="180" y="478" width="580" height="30" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="198" y="498" font-size="13" font-weight="700" fill="#111827">UNIQUE (idempotency_key): o banco decide sozinho</text>
  <rect x="180" y="514" width="580" height="30" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="198" y="534" font-size="13" fill="#111827">id 1 · chave 5b0e7a52… · R$ 250 · uma linha só</text>

  <line x1="470" y1="556" x2="470" y2="590" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
  <text x="482" y="578" font-size="13" font-weight="700" fill="#4b5563">o que B devolve</text>

  <rect x="60" y="596" width="390" height="72" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="255" y="624" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">status ainda PROCESSANDO</text>
  <text x="255" y="647" font-size="13" fill="#4b5563" text-anchor="middle">409 Conflict: tente de novo mais tarde</text>
  <rect x="490" y="596" width="390" height="72" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="685" y="624" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">resposta já guardada</text>
  <text x="685" y="647" font-size="13" fill="#4b5563" text-anchor="middle">devolve a mesma resposta da primeira vez</text>

  <line x1="470" y1="670" x2="470" y2="720" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="230" y="726" width="480" height="64" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
  <text x="470" y="753" font-size="17" font-weight="700" fill="#2e9e5b" text-anchor="middle">Cliente cobrado 1× · R$ 250</text>
  <text x="470" y="776" font-size="13" fill="#4b5563" text-anchor="middle">quantas tentativas vierem, o efeito é um só</text>
</svg>
