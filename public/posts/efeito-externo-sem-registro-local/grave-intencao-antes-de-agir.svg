<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 730" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="940" height="730" fill="#ffffff"/>

  <text x="40" y="44" font-size="21" font-weight="700" fill="#111827">Grave a intenção antes de agir</text>
  <text x="40" y="70" font-size="14" fill="#6b7280">O registro local nasce antes do efeito externo; relay e conciliação cuidam do resto</text>

  <text x="50" y="108" font-size="14" font-weight="700" fill="#2e9e5b">Dentro do request (síncrono)</text>
  <text x="580" y="108" font-size="14" font-weight="700" fill="#2b7fc4">Fora do request (assíncrono)</text>

  <!-- Serviço -->
  <rect x="50" y="124" width="460" height="60" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
  <text x="280" y="150" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Serviço de autorização</text>
  <text x="280" y="172" font-size="14" fill="#374151" text-anchor="middle">recebe o pedido com a chave de idempotência</text>

  <line x1="280" y1="184" x2="280" y2="208" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>

  <!-- 1. Transação -->
  <rect x="50" y="214" width="460" height="146" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
  <text x="280" y="240" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">1. Uma única transação no Postgres</text>
  <rect x="74" y="254" width="412" height="32" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="90" y="275" font-size="14" fill="#111827">cobranca · chave 7f3a-9c · status PENDENTE</text>
  <rect x="74" y="294" width="412" height="32" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="90" y="315" font-size="14" fill="#111827">outbox · evento CobrancaIniciada</text>
  <text x="280" y="348" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">um commit só: as duas linhas existem, ou nenhuma</text>

  <line x1="280" y1="360" x2="280" y2="394" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="294" y="383" font-size="14" font-weight="700" fill="#111827">2. captura com a mesma chave</text>

  <!-- Adquirente -->
  <rect x="50" y="400" width="460" height="60" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2"/>
  <text x="280" y="426" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Adquirente</text>
  <text x="280" y="448" font-size="14" fill="#374151" text-anchor="middle">o efeito externo acontece, já com registro local</text>

  <line x1="280" y1="460" x2="280" y2="494" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="294" y="483" font-size="14" font-weight="700" fill="#111827">3. grava o resultado</text>

  <!-- 3. UPDATE -->
  <rect x="50" y="500" width="460" height="70" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
  <text x="280" y="528" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">cobranca → CAPTURADO</text>
  <text x="280" y="552" font-size="14" fill="#374151" text-anchor="middle">na mesma transação: outbox · CobrancaCapturada</text>

  <!-- 4. Relay -->
  <rect x="580" y="214" width="320" height="100" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="740" y="244" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">4. Relay do outbox</text>
  <text x="740" y="268" font-size="14" fill="#374151" text-anchor="middle">lê os eventos novos, publica</text>
  <text x="740" y="290" font-size="14" fill="#374151" text-anchor="middle">no broker e marca como enviados</text>
  <line x1="510" y1="300" x2="574" y2="270" stroke="#4b5563" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#seta)"/>

  <!-- 5. Conciliação -->
  <rect x="580" y="380" width="320" height="120" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="740" y="410" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">5. Conciliação</text>
  <text x="740" y="434" font-size="14" fill="#374151" text-anchor="middle">varre PENDENTE antigo,</text>
  <text x="740" y="456" font-size="14" fill="#374151" text-anchor="middle">pergunta o status ao adquirente</text>
  <text x="740" y="478" font-size="14" fill="#374151" text-anchor="middle">e atualiza a linha</text>
  <line x1="578" y1="440" x2="516" y2="440" stroke="#4b5563" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#seta)"/>
  <text x="545" y="430" font-size="13" fill="#4b5563" text-anchor="middle">consulta</text>

  <!-- Resultado -->
  <rect x="40" y="604" width="860" height="66" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
  <text x="470" y="632" font-size="16" font-weight="700" fill="#2e9e5b" text-anchor="middle">Nunca existe efeito externo sem registro local</text>
  <text x="470" y="656" font-size="14" fill="#374151" text-anchor="middle">se o processo cair em qualquer ponto, sobra um PENDENTE contando o que faltou terminar</text>

  <!-- Legenda -->
  <line x1="50" y1="701" x2="94" y2="701" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="106" y="706" font-size="13" fill="#4b5563">passo síncrono, dentro do request</text>
  <line x1="360" y1="701" x2="404" y2="701" stroke="#4b5563" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#seta)"/>
  <text x="416" y="706" font-size="13" fill="#4b5563">processo separado, fora do request</text>
</svg>
