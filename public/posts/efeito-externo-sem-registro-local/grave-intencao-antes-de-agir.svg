<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 905" width="720" height="905" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="720" height="905" fill="#ffffff"/>
<defs>
<marker id="pg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2a9d78"/></marker>
<marker id="pb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b7fc4"/></marker>
</defs>

<rect x="24" y="22" width="6" height="26" fill="#2ec4a6"/>
<text x="42" y="43" font-size="20" font-weight="700" fill="#1a1a1a">Grave a intenção antes de agir</text>
<text x="696" y="41" font-size="11" fill="#9a9a9a" text-anchor="end">Sessão 01 · desenho corrigido</text>

<rect x="200" y="88" width="320" height="58" rx="10" fill="#eaf4fd" stroke="#2b7fc4" stroke-width="2"/>
<text x="360" y="112" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Serviço de autorização</text>
<text x="360" y="130" font-size="10" fill="#6b7280" text-anchor="middle">recebe a requisição com a chave</text>

<path d="M 360 150 L 360 186" fill="none" stroke="#2a9d78" stroke-width="2.5" marker-end="url(#pg)"/>

<rect x="120" y="190" width="480" height="126" rx="10" fill="#eaf7f1" stroke="#2a9d78" stroke-width="2"/>
<text x="360" y="214" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">1. Uma única transação no Postgres</text>
<rect x="142" y="228" width="436" height="30" rx="6" fill="#ffffff" stroke="#2a9d78" stroke-width="1.5"/>
<text x="156" y="248" font-size="10.5" fill="#1a1a1a">cobranca · chave 7f3a-9c · status PENDENTE</text>
<rect x="142" y="264" width="436" height="30" rx="6" fill="#ffffff" stroke="#2a9d78" stroke-width="1.5"/>
<text x="156" y="284" font-size="10.5" fill="#1a1a1a">outbox · evento CobrancaIniciada</text>
<text x="360" y="308" font-size="9.5" font-weight="600" fill="#2a9d78" text-anchor="middle">commit único: ou as duas linhas existem, ou nenhuma</text>

<path d="M 360 320 L 360 352" fill="none" stroke="#2a9d78" stroke-width="2.5" marker-end="url(#pg)"/>
<text x="374" y="341" font-size="11" font-weight="600" fill="#2a9d78">2. captura R$ 250 com a mesma chave</text>

<rect x="200" y="356" width="320" height="58" rx="10" fill="#eaf7f1" stroke="#2a9d78" stroke-width="2"/>
<text x="360" y="380" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Adquirente</text>
<text x="360" y="398" font-size="10" fill="#6b7280" text-anchor="middle">agora existe registro local do que foi pedido</text>

<path d="M 360 418 L 360 450" fill="none" stroke="#2a9d78" stroke-width="2.5" marker-end="url(#pg)"/>
<text x="374" y="439" font-size="11" font-weight="600" fill="#2a9d78">3. UPDATE do status</text>

<rect x="200" y="454" width="320" height="58" rx="10" fill="#ffffff" stroke="#2a9d78" stroke-width="2"/>
<text x="360" y="478" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">cobranca → CAPTURADO</text>
<text x="360" y="496" font-size="10" fill="#6b7280" text-anchor="middle">mesma linha, agora com o resultado</text>

<path d="M 360 516 L 360 548" fill="none" stroke="#2b7fc4" stroke-width="2.5" marker-end="url(#pb)"/>
<text x="374" y="537" font-size="11" font-weight="600" fill="#2b7fc4">4. em paralelo, fora do request</text>

<rect x="200" y="552" width="320" height="58" rx="10" fill="#f4f9ff" stroke="#2b7fc4" stroke-width="2" stroke-dasharray="7 5"/>
<text x="360" y="576" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Relay lê o outbox</text>
<text x="360" y="594" font-size="10" fill="#6b7280" text-anchor="middle">publica o evento e marca como enviado</text>

<path d="M 360 614 L 360 646" fill="none" stroke="#2b7fc4" stroke-width="2.5" marker-end="url(#pb)"/>

<rect x="120" y="650" width="480" height="62" rx="10" fill="#f4f9ff" stroke="#2b7fc4" stroke-width="2" stroke-dasharray="7 5"/>
<text x="360" y="674" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">5. Conciliação — rede de segurança</text>
<text x="360" y="693" font-size="10" fill="#6b7280" text-anchor="middle">varre PENDENTE antigo e pergunta o status ao adquirente</text>

<path d="M 360 716 L 360 736" fill="none" stroke="#2a9d78" stroke-width="2.5" marker-end="url(#pg)"/>

<rect x="120" y="740" width="480" height="56" rx="10" fill="#eaf7f1" stroke="#2a9d78" stroke-width="2"/>
<text x="360" y="762" font-size="13" font-weight="700" fill="#2a9d78" text-anchor="middle">Nunca existe efeito externo sem registro local</text>
<text x="360" y="780" font-size="10" fill="#6b7280" text-anchor="middle">se cair em qualquer ponto, o PENDENTE conta o que faltou</text>

<rect x="40" y="826" width="640" height="44" rx="10" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="62" y1="852" x2="96" y2="852" stroke="#2a9d78" stroke-width="2.5" marker-end="url(#pg)"/>
<text x="106" y="856" font-size="10" fill="#4b5563">caminho síncrono do request</text>
<line x1="330" y1="852" x2="364" y2="852" stroke="#2b7fc4" stroke-width="2.5" marker-end="url(#pb)"/>
<text x="374" y="856" font-size="10" fill="#4b5563">assíncrono, fora do request</text>
<text x="40" y="890" font-size="9" fill="#9a9a9a">estilo inspirado em ByteByteGo</text>
</svg>
