<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 790" width="720" height="790" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="720" height="790" fill="#ffffff"/>
<defs>
<marker id="dg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2a9d78"/></marker>
<marker id="dr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d9534f"/></marker>
</defs>

<rect x="24" y="22" width="6" height="26" fill="#2ec4a6"/>
<text x="42" y="43" font-size="20" font-weight="700" fill="#1a1a1a">Efeito externo sem registro local</text>
<text x="696" y="41" font-size="11" fill="#9a9a9a" text-anchor="end">Sessão 01 · desenho errado</text>

<rect x="200" y="88" width="320" height="64" rx="10" fill="#eaf4fd" stroke="#2b7fc4" stroke-width="2"/>
<text x="360" y="114" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Serviço de autorização</text>
<text x="360" y="133" font-size="10" fill="#6b7280" text-anchor="middle">chamada síncrona, dentro do request</text>

<path d="M 360 156 L 360 192" fill="none" stroke="#2a9d78" stroke-width="2.5" marker-end="url(#dg)"/>
<text x="374" y="179" font-size="11" font-weight="600" fill="#2a9d78">1. captura no adquirente</text>

<rect x="200" y="196" width="320" height="64" rx="10" fill="#eaf7f1" stroke="#2a9d78" stroke-width="2"/>
<text x="360" y="222" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Adquirente</text>
<text x="360" y="241" font-size="10" fill="#6b7280" text-anchor="middle">R$ 250 capturado · sucesso</text>

<rect x="120" y="272" width="480" height="132" rx="12" fill="none" stroke="#d9534f" stroke-width="2" stroke-dasharray="8 6"/>
<text x="128" y="265" font-size="11" font-weight="700" fill="#d9534f">janela de inconsistência</text>

<path d="M 360 264 L 360 306" fill="none" stroke="#d9534f" stroke-width="2.5" marker-end="url(#dr)"/>
<text x="374" y="292" font-size="11" font-weight="600" fill="#d9534f">2. INSERT no seu banco</text>

<rect x="200" y="310" width="320" height="64" rx="10" fill="#fdeaea" stroke="#d9534f" stroke-width="2"/>
<text x="360" y="336" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Postgres — tabela cobrancas</text>
<text x="360" y="355" font-size="10" fill="#6b7280" text-anchor="middle">falhou: timeout, deploy ou processo morto</text>

<text x="360" y="394" font-size="10" font-weight="600" fill="#d9534f" text-anchor="middle">o efeito externo já aconteceu, o registro local não</text>

<path d="M 360 408 L 360 442" fill="none" stroke="#d9534f" stroke-width="2.5" marker-end="url(#dr)"/>

<rect x="120" y="446" width="480" height="140" rx="10" fill="#fdeaea" stroke="#ee8b8b" stroke-width="2"/>
<rect x="120" y="446" width="480" height="34" rx="10" fill="#f4a6a6"/>
<rect x="120" y="466" width="480" height="14" fill="#f4a6a6"/>
<text x="360" y="468" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Estado depois da falha</text>
<rect x="142" y="492" width="436" height="28" rx="6" fill="#ffffff" stroke="#ee8b8b" stroke-width="1.5"/>
<text x="156" y="511" font-size="10.5" fill="#1a1a1a">Adquirente: R$ 250 capturado</text>
<rect x="142" y="528" width="436" height="28" rx="6" fill="#ffffff" stroke="#ee8b8b" stroke-width="1.5"/>
<text x="156" y="547" font-size="10.5" fill="#1a1a1a">Seu banco: nenhum registro, nenhuma chave</text>
<text x="360" y="576" font-size="10" font-weight="600" fill="#d9534f" text-anchor="middle">sem a chave gravada, a idempotência da sessão 00 não protege</text>

<path d="M 360 590 L 360 620" fill="none" stroke="#d9534f" stroke-width="2.5" marker-end="url(#dr)"/>

<rect x="120" y="624" width="480" height="56" rx="10" fill="#fdeaea" stroke="#d9534f" stroke-width="2"/>
<text x="360" y="646" font-size="13" font-weight="700" fill="#d9534f" text-anchor="middle">No retry, cobra de novo · R$ 500</text>
<text x="360" y="664" font-size="10" fill="#6b7280" text-anchor="middle">e você não tem registro para provar o contrário</text>

<rect x="40" y="710" width="640" height="44" rx="10" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="62" y1="736" x2="96" y2="736" stroke="#2a9d78" stroke-width="2.5" marker-end="url(#dg)"/>
<text x="106" y="740" font-size="10" fill="#4b5563">efeito externo concluído</text>
<line x1="290" y1="736" x2="324" y2="736" stroke="#d9534f" stroke-width="2.5" marker-end="url(#dr)"/>
<text x="334" y="740" font-size="10" fill="#4b5563">escrita local que falhou</text>
<rect x="500" y="730" width="34" height="12" rx="3" fill="none" stroke="#d9534f" stroke-width="2" stroke-dasharray="5 4"/>
<text x="542" y="740" font-size="10" fill="#4b5563">janela de inconsistência</text>
<text x="40" y="774" font-size="9" fill="#9a9a9a">estilo inspirado em ByteByteGo</text>
</svg>
