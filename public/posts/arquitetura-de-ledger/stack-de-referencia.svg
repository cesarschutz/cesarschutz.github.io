<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="540" fill="#ffffff"/>
<defs>
<marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#4b5563"/></marker>
</defs>
<text x="30" y="42" font-size="21" font-weight="700" fill="#111827">A stack de referência de um ledger de pagamentos</text>

<!-- posting engine -->
<rect x="60" y="90" width="250" height="80" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2.5"/>
<text x="185" y="123" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Posting engine</text>
<text x="185" y="147" font-size="13" fill="#6b7280" text-anchor="middle">valida double-entry · atômico</text>

<!-- postgres -->
<path d="M420 100 h220 v66 a110 15 0 0 1 -220 0 Z" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<ellipse cx="530" cy="100" rx="110" ry="15" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="530" y="142" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">PostgreSQL</text>
<text x="530" y="162" font-size="13" fill="#6b7280" text-anchor="middle">journal append-only</text>
<path d="M312 130 H408" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>

<!-- kafka -->
<rect x="60" y="240" width="250" height="70" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2.5"/>
<text x="185" y="269" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Kafka</text>
<text x="185" y="292" font-size="13" fill="#6b7280" text-anchor="middle">JournalEntryPosted</text>
<path d="M185 172 V228" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>

<!-- materializer -->
<rect x="400" y="235" width="260" height="80" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2.5"/>
<text x="530" y="267" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Balance materializer</text>
<text x="530" y="291" font-size="13" fill="#6b7280" text-anchor="middle">ledger · pending · available</text>
<path d="M312 275 H388" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>

<!-- redis -->
<path d="M730 242 h160 v58 a80 13 0 0 1 -160 0 Z" fill="#fdecea" stroke="#d9534f" stroke-width="2"/>
<ellipse cx="810" cy="242" rx="80" ry="13" fill="#fdecea" stroke="#d9534f" stroke-width="2"/>
<text x="810" y="280" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Redis</text>
<text x="810" y="299" font-size="13" fill="#6b7280" text-anchor="middle">contas quentes</text>
<path d="M662 275 H718" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>

<!-- journal -> conciliação (contorna pela direita) -->
<path d="M642 125 H915 V365 H600 V386" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#m)"/>
<text x="760" y="356" font-size="13" fill="#6b7280" text-anchor="middle">compara com o journal</text>

<!-- externos -->
<rect x="60" y="400" width="250" height="76" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="185" y="432" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Arquivos externos</text>
<text x="185" y="455" font-size="13" fill="#6b7280" text-anchor="middle">processadora · banco · bandeira</text>

<!-- reconciliation -->
<rect x="400" y="398" width="260" height="80" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2.5"/>
<text x="530" y="430" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Pipeline de conciliação</text>
<text x="530" y="454" font-size="13" fill="#6b7280" text-anchor="middle">jobs agendados · Airflow, Dagster</text>
<path d="M312 437 H388" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>

<!-- exceções -->
<rect x="720" y="408" width="190" height="60" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2.5"/>
<text x="815" y="434" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">exceções</text>
<text x="815" y="454" font-size="13" fill="#6b7280" text-anchor="middle">+ alertas</text>
<path d="M662 438 H708" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>
</svg>
