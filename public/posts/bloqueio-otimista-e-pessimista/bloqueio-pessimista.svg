<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 880" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="880" fill="#ffffff"/>
<defs>
<marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#4b5563"/></marker>
<marker id="mt" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#9ca3af"/></marker>
</defs>

<text x="40" y="42" font-size="21" font-weight="700" fill="#111827">Bloqueio pessimista: evitar o conflito antes que ele exista</text>
<text x="40" y="68" font-size="14" fill="#6b7280">quem chega primeiro trava a linha; os outros esperam o COMMIT</text>

<!-- raias -->
<g font-size="15" font-weight="700" text-anchor="middle">
<rect x="40" y="92" width="280" height="44" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="180" y="120" fill="#2b7fc4">Cliente A</text>
<rect x="360" y="92" width="220" height="44" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="470" y="120" fill="#374151">Banco · conta id 1</text>
<rect x="620" y="92" width="280" height="44" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2"/>
<text x="760" y="120" fill="#e07a1f">Cliente B</text>
</g>
<g stroke="#d1d5db" stroke-width="2" stroke-dasharray="4 6">
<path d="M180 136 V640"/><path d="M470 136 V640"/><path d="M760 136 V640"/>
</g>

<!-- eixo do tempo -->
<path d="M20 160 V630" stroke="#9ca3af" stroke-width="2" marker-end="url(#mt)"/>
<text x="0" y="0" font-size="13" fill="#6b7280" text-anchor="middle" transform="translate(14 395) rotate(-90)">tempo</text>

<!-- região travada -->
<text x="470" y="168" font-size="14" font-weight="700" fill="#e07a1f" text-anchor="middle">linha travada por A</text>
<rect x="360" y="178" width="220" height="330" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2" stroke-dasharray="8 6"/>

<!-- 1 -->
<rect x="40" y="190" width="280" height="84" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="56" y="216" font-size="15" font-weight="700" fill="#111827">1 · BEGIN e trava a linha</text>
<text x="56" y="238" font-size="13" fill="#4b5563" font-family="ui-monospace, Menlo, monospace">SELECT … FOR UPDATE</text>
<text x="56" y="260" font-size="13" font-weight="700" fill="#e07a1f">a trava vale até o COMMIT</text>
<path d="M322 232 H356" stroke="#4b5563" stroke-width="2.5" marker-end="url(#m)"/>

<!-- 2 -->
<rect x="620" y="294" width="280" height="84" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2"/>
<text x="636" y="320" font-size="15" font-weight="700" fill="#111827">2 · pede a mesma linha</text>
<text x="636" y="342" font-size="13" fill="#4b5563" font-family="ui-monospace, Menlo, monospace">SELECT … FOR UPDATE</text>
<text x="636" y="364" font-size="13" font-weight="700" fill="#e07a1f">não recebe erro: fica esperando</text>
<path d="M618 336 H570" stroke="#4b5563" stroke-width="2.5" marker-end="url(#m)"/>
<rect x="380" y="304" width="180" height="64" rx="12" fill="#ffffff" stroke="#e07a1f" stroke-width="2"/>
<text x="470" y="330" font-size="15" font-weight="700" fill="#e07a1f" text-anchor="middle">B na fila</text>
<text x="470" y="352" font-size="13" fill="#4b5563" text-anchor="middle">esperando a trava sair</text>

<!-- 3 -->
<rect x="40" y="398" width="280" height="84" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="56" y="424" font-size="15" font-weight="700" fill="#111827">3 · atualiza e faz COMMIT</text>
<text x="56" y="446" font-size="13" fill="#4b5563">saldo passa de 100 para 90</text>
<text x="56" y="468" font-size="13" font-weight="700" fill="#2e9e5b">a trava é liberada aqui</text>
<path d="M322 440 H356" stroke="#4b5563" stroke-width="2.5" marker-end="url(#m)"/>

<!-- 4 -->
<rect x="360" y="536" width="220" height="64" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="470" y="562" font-size="15" font-weight="700" fill="#2e9e5b" text-anchor="middle">saldo 90</text>
<text x="470" y="584" font-size="13" fill="#4b5563" text-anchor="middle">linha livre para B</text>
<path d="M582 568 H616" stroke="#4b5563" stroke-width="2.5" marker-end="url(#m)"/>
<rect x="620" y="526" width="280" height="84" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="636" y="552" font-size="15" font-weight="700" fill="#111827">4 · B recebe a trava e segue</text>
<text x="636" y="574" font-size="13" fill="#4b5563">lê saldo 90, já atualizado</text>
<text x="636" y="596" font-size="13" font-weight="700" fill="#2e9e5b">calcula em cima do dado certo</text>

<!-- resumo -->
<rect x="40" y="652" width="860" height="72" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="470" y="682" font-size="17" font-weight="700" fill="#2e9e5b" text-anchor="middle">Nenhuma escrita perdida, e nenhum conflito chegou a acontecer</text>
<text x="470" y="707" font-size="14" fill="#4b5563" text-anchor="middle">em troca, B ficou parado: o custo é cobrado mesmo quando não haveria conflito</text>

<!-- riscos -->
<rect x="40" y="740" width="860" height="100" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2"/>
<text x="470" y="768" font-size="16" font-weight="700" fill="#d9534f" text-anchor="middle">O que vem junto com a trava</text>
<text x="64" y="796" font-size="14" fill="#111827"><tspan font-weight="700">Contenção:</tspan> transação longa segura a linha e enfileira todos os outros</text>
<text x="64" y="822" font-size="14" fill="#111827"><tspan font-weight="700">Deadlock:</tspan> duas transações travam linhas em ordem invertida; trave sempre na mesma ordem</text>

<text x="470" y="864" font-size="13" fill="#6b7280" text-anchor="middle">NOWAIT falha na hora · SKIP LOCKED pula a linha travada · lock_timeout limita a espera</text>
</svg>
