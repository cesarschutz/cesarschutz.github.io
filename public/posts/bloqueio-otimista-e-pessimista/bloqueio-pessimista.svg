<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="720" height="650" fill="#ffffff"/>
<defs>
<marker id="pb" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#2b7fc4"/></marker>
<marker id="po" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#e07a1f"/></marker>
<marker id="pt" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#b9b9b9"/></marker>
</defs>

<rect x="24" y="22" width="6" height="26" fill="#2ec4a6"/>
<text x="42" y="42" font-size="19" font-weight="700" fill="#1a1a1a">Bloqueio pessimista</text>
<text x="228" y="42" font-size="13" fill="#8a8a8a">evitar o conflito antes de existir</text>
<text x="696" y="41" font-size="11" fill="#b0b0b0" text-anchor="end">Sessão 03</text>

<rect x="40" y="70" width="210" height="32" rx="16" fill="#eaf4fd"/>
<text x="145" y="91" font-size="12" font-weight="700" fill="#2b7fc4" text-anchor="middle">Cliente A</text>
<rect x="270" y="70" width="180" height="32" rx="16" fill="#f0f0ee"/>
<text x="360" y="91" font-size="12" font-weight="700" fill="#5b5b5b" text-anchor="middle">Banco · linha id 1</text>
<rect x="470" y="70" width="210" height="32" rx="16" fill="#fdf1e6"/>
<text x="575" y="91" font-size="12" font-weight="700" fill="#e07a1f" text-anchor="middle">Cliente B</text>

<line x1="145" y1="110" x2="145" y2="430" stroke="#e4e4e2" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="360" y1="110" x2="360" y2="430" stroke="#e4e4e2" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="575" y1="110" x2="575" y2="430" stroke="#e4e4e2" stroke-width="1.5" stroke-dasharray="4 5"/>

<line x1="22" y1="122" x2="22" y2="410" stroke="#d8d8d8" stroke-width="1.5" marker-end="url(#pt)"/>
<text x="16" y="270" font-size="9.5" fill="#b0b0b0" text-anchor="middle" transform="rotate(-90 16 270)">tempo</text>

<rect x="288" y="130" width="144" height="196" rx="12" fill="#fff8ec" stroke="#e8b964" stroke-width="2" stroke-dasharray="7 5"/>
<text x="360" y="122" font-size="10" font-weight="700" fill="#b07d15" text-anchor="middle">linha travada por A</text>

<rect x="40" y="134" width="210" height="52" rx="10" fill="#f7fbff" stroke="#cfe3f5" stroke-width="1.5"/>
<rect x="40" y="134" width="4" height="52" rx="2" fill="#2b7fc4"/>
<text x="58" y="154" font-size="11" font-weight="700" fill="#1a1a1a">1 · BEGIN e trava a linha</text>
<text x="58" y="170" font-size="9.5" fill="#6b7280">SELECT ... FOR UPDATE</text>
<text x="58" y="182" font-size="9.5" font-weight="600" fill="#b07d15">a trava vale até o COMMIT</text>
<line x1="252" y1="160" x2="284" y2="160" stroke="#2b7fc4" stroke-width="2" marker-end="url(#pb)"/>

<rect x="470" y="206" width="210" height="52" rx="10" fill="#fffaf5" stroke="#f5dcc2" stroke-width="1.5"/>
<rect x="676" y="206" width="4" height="52" rx="2" fill="#e07a1f"/>
<text x="662" y="226" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="end">2 · pede a mesma linha</text>
<text x="662" y="242" font-size="9.5" fill="#6b7280" text-anchor="end">SELECT ... FOR UPDATE</text>
<text x="662" y="254" font-size="9.5" font-weight="600" fill="#b07d15" text-anchor="end">não recebe erro — fica parado</text>
<line x1="466" y1="232" x2="438" y2="232" stroke="#e07a1f" stroke-width="2" marker-end="url(#po)"/>

<rect x="302" y="212" width="116" height="40" rx="10" fill="#ffffff" stroke="#e8b964" stroke-width="1.5"/>
<text x="360" y="229" font-size="10.5" font-weight="700" fill="#b07d15" text-anchor="middle">B na fila</text>
<text x="360" y="243" font-size="9" fill="#6b7280" text-anchor="middle">esperando a trava sair</text>

<rect x="40" y="274" width="210" height="52" rx="10" fill="#f7fbff" stroke="#cfe3f5" stroke-width="1.5"/>
<rect x="40" y="274" width="4" height="52" rx="2" fill="#2b7fc4"/>
<text x="58" y="294" font-size="11" font-weight="700" fill="#1a1a1a">3 · atualiza e faz COMMIT</text>
<text x="58" y="310" font-size="9.5" fill="#6b7280">saldo passa de 100 para 90</text>
<text x="58" y="322" font-size="9.5" font-weight="600" fill="#2a9d78">a trava é liberada aqui</text>
<line x1="252" y1="300" x2="284" y2="300" stroke="#2b7fc4" stroke-width="2" marker-end="url(#pb)"/>

<rect x="470" y="350" width="210" height="52" rx="10" fill="#eaf7f1" stroke="#8fd6b8" stroke-width="1.5"/>
<rect x="676" y="350" width="4" height="52" rx="2" fill="#2a9d78"/>
<text x="662" y="370" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="end">4 · B destrava e segue</text>
<text x="662" y="386" font-size="9.5" fill="#6b7280" text-anchor="end">lê saldo 90, já atualizado</text>
<text x="662" y="398" font-size="9.5" font-weight="600" fill="#2a9d78" text-anchor="end">grava em cima do dado correto</text>
<line x1="438" y1="376" x2="466" y2="376" stroke="#2a9d78" stroke-width="2" marker-end="url(#po)"/>

<rect x="290" y="356" width="140" height="40" rx="10" fill="#eaf7f1" stroke="#8fd6b8" stroke-width="1.5"/>
<text x="360" y="373" font-size="10.5" font-weight="700" fill="#2a9d78" text-anchor="middle">saldo 90</text>
<text x="360" y="387" font-size="9" fill="#6b7280" text-anchor="middle">linha livre de novo</text>

<rect x="40" y="450" width="640" height="54" rx="12" fill="#eaf7f1" stroke="#2a9d78" stroke-width="2"/>
<text x="360" y="473" font-size="13" font-weight="700" fill="#2a9d78" text-anchor="middle">Nenhuma escrita perdida e nenhum conflito aconteceu</text>
<text x="360" y="492" font-size="10" fill="#6b7280" text-anchor="middle">em troca, B ficou parado — o custo é cobrado mesmo sem conflito nenhum</text>

<rect x="40" y="524" width="640" height="86" rx="12" fill="#fdeaea" stroke="#d9534f" stroke-width="2"/>
<text x="360" y="546" font-size="12" font-weight="700" fill="#d9534f" text-anchor="middle">O que vem junto com a trava</text>
<rect x="60" y="556" width="600" height="22" rx="6" fill="#ffffff" stroke="#eec0c0" stroke-width="1.5"/>
<text x="72" y="571" font-size="9.5" fill="#1a1a1a">contenção: transação longa segura a linha e enfileira todo mundo — nunca chame serviço externo com a trava na mão</text>
<rect x="60" y="582" width="600" height="22" rx="6" fill="#ffffff" stroke="#eec0c0" stroke-width="1.5"/>
<text x="72" y="597" font-size="9.5" fill="#1a1a1a">deadlock: dois travam as mesmas linhas em ordem diferente — previna travando sempre na mesma ordem</text>

<text x="40" y="634" font-size="9" fill="#c0c0c0">estilo inspirado em ByteByteGo · NOWAIT falha na hora, SKIP LOCKED pula a linha travada, lock_timeout limita a espera</text>
</svg>
