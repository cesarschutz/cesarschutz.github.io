<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="600" fill="#ffffff"/>
<defs>
<marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#4b5563"/></marker>
</defs>

<text x="30" y="42" font-size="21" font-weight="700" fill="#111827">PermGen (Java 7) x Metaspace (Java 8)</text>
<text x="30" y="68" font-size="14" fill="#6b7280">JEP 122: metadados de classe vão para memória nativa e variáveis estáticas de classe vão para o heap</text>

<!-- ============ JAVA 7 ============ -->
<text x="30" y="108" font-size="17" font-weight="700" fill="#111827">Java 7 — HotSpot</text>

<rect x="30" y="122" width="400" height="176" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="48" y="150" font-size="15" font-weight="700" fill="#2b7fc4">Heap Java (-Xmx)</text>
<rect x="48" y="166" width="170" height="60" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="133" y="202" font-size="14" fill="#111827" text-anchor="middle">Young</text>
<rect x="242" y="166" width="170" height="60" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="327" y="202" font-size="14" fill="#111827" text-anchor="middle">Old</text>
<rect x="48" y="238" width="364" height="44" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="230" y="265" font-size="14" fill="#111827" text-anchor="middle">strings internadas (no heap desde o JDK 7)</text>

<rect x="30" y="314" width="400" height="150" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2"/>
<text x="48" y="342" font-size="15" font-weight="700" fill="#d9534f">Permanent Generation</text>
<text x="48" y="364" font-size="13" fill="#4b5563">tamanho máximo fixo: -XX:MaxPermSize</text>
<g font-size="14" fill="#111827">
<text x="48" y="392">• metadados de classes e métodos</text>
<text x="48" y="416">• variáveis estáticas de classe</text>
</g>
<text x="48" y="446" font-size="13" font-weight="700" fill="#d9534f">cheio → OutOfMemoryError: PermGen space</text>

<!-- seta central -->
<line x1="440" y1="300" x2="496" y2="300" stroke="#4b5563" stroke-width="2.5" marker-end="url(#seta)"/>
<text x="468" y="288" font-size="13" font-weight="700" fill="#4b5563" text-anchor="middle">JDK 8</text>

<!-- ============ JAVA 8 ============ -->
<text x="510" y="108" font-size="17" font-weight="700" fill="#111827">Java 8 — HotSpot</text>

<rect x="510" y="122" width="400" height="176" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="528" y="150" font-size="15" font-weight="700" fill="#2b7fc4">Heap Java (-Xmx)</text>
<rect x="528" y="166" width="170" height="60" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="613" y="202" font-size="14" fill="#111827" text-anchor="middle">Young</text>
<rect x="722" y="166" width="170" height="60" rx="12" fill="#ffffff" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="807" y="202" font-size="14" fill="#111827" text-anchor="middle">Old</text>
<rect x="528" y="238" width="364" height="44" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="710" y="265" font-size="14" fill="#111827" text-anchor="middle">strings internadas + estáticos de classe</text>

<rect x="510" y="314" width="400" height="240" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2"/>
<text x="528" y="342" font-size="15" font-weight="700" fill="#e07a1f">Memória nativa — Metaspace</text>
<text x="528" y="364" font-size="13" fill="#4b5563">metadados de classe, em chunks por class loader</text>
<rect x="528" y="378" width="170" height="52" rx="12" fill="#ffffff" stroke="#e07a1f" stroke-width="1.5"/>
<text x="613" y="409" font-size="14" fill="#111827" text-anchor="middle">class loader A</text>
<rect x="722" y="378" width="170" height="52" rx="12" fill="#ffffff" stroke="#e07a1f" stroke-width="1.5"/>
<text x="807" y="409" font-size="14" fill="#111827" text-anchor="middle">class loader B</text>
<g font-size="14" fill="#111827">
<text x="528" y="456">• sem limite por padrão</text>
<text x="528" y="480">• teto opcional: -XX:MaxMetaspaceSize</text>
<text x="528" y="504">• liberado quando o class loader morre</text>
</g>
<text x="528" y="536" font-size="13" font-weight="700" fill="#e07a1f">cheio → OutOfMemoryError: Metaspace</text>

<!-- rodapé -->
<rect x="30" y="480" width="400" height="74" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="48" y="510" font-size="14" fill="#111827">No JDK 8, -XX:PermSize e -XX:MaxPermSize</text>
<text x="48" y="534" font-size="14" fill="#111827">são ignorados com um aviso na inicialização.</text>

<text x="30" y="584" font-size="13" fill="#6b7280">Fontes: JEP 122, notas de release do JDK 7, guia de GC tuning do JDK 8 e Compatibility Guide for JDK 8.</text>
</svg>
