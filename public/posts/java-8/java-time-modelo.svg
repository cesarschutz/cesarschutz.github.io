<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="600" fill="#ffffff"/>
<defs>
<marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#4b5563"/></marker>
</defs>

<text x="30" y="42" font-size="21" font-weight="700" fill="#111827">Modelo de tipos do java.time</text>
<text x="30" y="68" font-size="14" fill="#6b7280">todas as classes são imutáveis e thread-safe; conversões sempre devolvem um novo objeto</text>

<!-- colunas -->
<text x="30" y="106" font-size="16" font-weight="700" fill="#2b7fc4">Tempo local (sem fuso)</text>
<text x="360" y="106" font-size="16" font-weight="700" fill="#e07a1f">Com offset ou fuso</text>
<text x="700" y="106" font-size="16" font-weight="700" fill="#2e9e5b">Tempo de máquina</text>

<!-- LocalDate / LocalTime -->
<rect x="30" y="122" width="126" height="70" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="93" y="150" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">LocalDate</text>
<text x="93" y="174" font-size="13" fill="#4b5563" text-anchor="middle">2024-03-10</text>
<rect x="170" y="122" width="126" height="70" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="233" y="150" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">LocalTime</text>
<text x="233" y="174" font-size="13" fill="#4b5563" text-anchor="middle">14:00</text>

<line x1="93" y1="194" x2="150" y2="248" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<line x1="233" y1="194" x2="176" y2="248" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<text x="163" y="212" font-size="13" fill="#4b5563" text-anchor="middle">atTime</text>

<!-- LocalDateTime -->
<rect x="30" y="252" width="266" height="70" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="163" y="280" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">LocalDateTime</text>
<text x="163" y="304" font-size="13" fill="#4b5563" text-anchor="middle">2024-03-10T14:00</text>

<!-- OffsetDateTime -->
<rect x="360" y="152" width="290" height="70" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2"/>
<text x="505" y="180" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">OffsetDateTime</text>
<text x="505" y="204" font-size="13" fill="#4b5563" text-anchor="middle">2024-03-10T14:00-03:00</text>

<!-- ZonedDateTime -->
<rect x="360" y="330" width="290" height="70" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2"/>
<text x="505" y="358" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">ZonedDateTime</text>
<text x="505" y="382" font-size="13" fill="#4b5563" text-anchor="middle">…T14:00-03:00[America/Sao_Paulo]</text>

<line x1="298" y1="276" x2="356" y2="200" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<text x="330" y="222" font-size="13" fill="#4b5563" text-anchor="end">atOffset</text>
<line x1="298" y1="300" x2="356" y2="354" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<text x="316" y="352" font-size="13" fill="#4b5563" text-anchor="end">atZone</text>

<!-- Instant -->
<rect x="700" y="240" width="210" height="70" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="805" y="268" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Instant</text>
<text x="805" y="292" font-size="13" fill="#4b5563" text-anchor="middle">2024-03-10T17:00:00Z</text>

<line x1="652" y1="198" x2="696" y2="254" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<line x1="652" y1="354" x2="696" y2="296" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<text x="666" y="244" font-size="13" fill="#4b5563" text-anchor="end">toInstant</text>
<text x="666" y="318" font-size="13" fill="#4b5563" text-anchor="end">toInstant</text>

<text x="805" y="336" font-size="13" fill="#4b5563" text-anchor="middle">segundos e nanos desde</text>
<text x="805" y="354" font-size="13" fill="#4b5563" text-anchor="middle">1970-01-01T00:00:00Z</text>

<!-- Suporte -->
<rect x="30" y="360" width="266" height="96" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="46" y="388" font-size="14" font-weight="700" fill="#111827">Fusos</text>
<text x="46" y="412" font-size="13" fill="#4b5563">ZoneId: regras (America/Sao_Paulo)</text>
<text x="46" y="434" font-size="13" fill="#4b5563">ZoneOffset: deslocamento fixo (-03:00)</text>

<!-- Quantidades -->
<rect x="30" y="476" width="430" height="96" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="46" y="504" font-size="14" font-weight="700" fill="#111827">Quantidades de tempo</text>
<text x="46" y="528" font-size="13" fill="#4b5563">Period — baseada em datas: P1Y2M3D</text>
<text x="46" y="550" font-size="13" fill="#4b5563">Duration — baseada em tempo: PT1M30S</text>

<rect x="480" y="476" width="430" height="96" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="496" y="504" font-size="14" font-weight="700" fill="#111827">Formatação e parsing</text>
<text x="496" y="528" font-size="13" fill="#4b5563">DateTimeFormatter — imutável e thread-safe,</text>
<text x="496" y="550" font-size="13" fill="#4b5563">substitui o SimpleDateFormat compartilhado</text>
</svg>
