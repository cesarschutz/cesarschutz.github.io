<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="600" fill="#ffffff"/>
<defs>
<marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#4b5563"/></marker>
</defs>

<text x="30" y="42" font-size="21" font-weight="700" fill="#111827">Pipeline de Stream: nada executa antes da operação terminal</text>
<text x="30" y="68" font-size="14" fill="#6b7280">nomes.stream().filter(n -&gt; n.length() &gt; 4).map(String::toUpperCase).findFirst()</text>

<!-- Estágios -->
<rect x="30" y="92" width="160" height="82" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="110" y="124" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Fonte</text>
<text x="110" y="148" font-size="13" fill="#4b5563" text-anchor="middle">List → stream()</text>

<rect x="240" y="92" width="190" height="82" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="335" y="124" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">filter</text>
<text x="335" y="148" font-size="13" fill="#2b7fc4" text-anchor="middle">intermediária · lazy</text>

<rect x="480" y="92" width="190" height="82" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="575" y="124" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">map</text>
<text x="575" y="148" font-size="13" fill="#2b7fc4" text-anchor="middle">intermediária · lazy</text>

<rect x="720" y="92" width="190" height="82" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="815" y="124" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">findFirst</text>
<text x="815" y="148" font-size="13" fill="#2e9e5b" text-anchor="middle">terminal · curto-circuito</text>

<line x1="192" y1="133" x2="236" y2="133" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<line x1="432" y1="133" x2="476" y2="133" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<line x1="672" y1="133" x2="716" y2="133" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>

<!-- Montagem -->
<rect x="30" y="196" width="880" height="44" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="50" y="224" font-size="14" fill="#111827"><tspan font-weight="700">1. Montagem:</tspan> filter e map só devolvem um novo Stream. Nenhum elemento é lido.</text>

<text x="30" y="276" font-size="15" font-weight="700" fill="#111827">2. Execução disparada por findFirst: um elemento de cada vez, na ordem da fonte</text>

<!-- ana -->
<text x="110" y="320" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">"ana"</text>
<rect x="240" y="296" width="190" height="40" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2"/>
<text x="335" y="321" font-size="14" fill="#111827" text-anchor="middle">reprovado (3 letras)</text>
<line x1="150" y1="316" x2="236" y2="316" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>

<!-- bruno -->
<text x="110" y="376" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">"bruno"</text>
<rect x="240" y="352" width="190" height="40" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="335" y="377" font-size="14" fill="#111827" text-anchor="middle">aprovado</text>
<rect x="480" y="352" width="190" height="40" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="575" y="377" font-size="14" fill="#111827" text-anchor="middle">"BRUNO"</text>
<rect x="720" y="352" width="190" height="40" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="815" y="377" font-size="14" fill="#111827" text-anchor="middle">achou: encerra</text>
<line x1="158" y1="372" x2="236" y2="372" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<line x1="432" y1="372" x2="476" y2="372" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<line x1="672" y1="372" x2="716" y2="372" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>

<!-- restantes -->
<text x="110" y="428" font-size="15" font-weight="700" fill="#6b7280" text-anchor="middle">"carla"</text>
<text x="110" y="452" font-size="15" font-weight="700" fill="#6b7280" text-anchor="middle">"daniel"</text>
<text x="110" y="476" font-size="15" font-weight="700" fill="#6b7280" text-anchor="middle">"eduarda"</text>
<rect x="240" y="408" width="670" height="80" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="575" y="443" font-size="14" font-weight="700" fill="#4b5563" text-anchor="middle">nunca avaliados</text>
<text x="575" y="466" font-size="14" fill="#4b5563" text-anchor="middle">a operação terminal já tem o resultado e interrompe a travessia</text>

<!-- rodapé -->
<rect x="30" y="512" width="880" height="64" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="50" y="539" font-size="14" fill="#111827">Operações intermediárias são sempre lazy. A terminal percorre a fonte e consome o Stream:</text>
<text x="50" y="561" font-size="14" fill="#111827">para processar os dados de novo, é preciso criar outro Stream a partir da fonte.</text>
</svg>
