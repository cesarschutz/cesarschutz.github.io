<text x="44" y="598" font-size="13" fill="#111827">Java 9: $MAJOR.$MINOR.$SECURITY (JEP 223)</text>
<text x="44" y="622" font-size="13" fill="#111827">Java 10+: $FEATURE.$INTERIM.$UPDATE.$PATCH</text>
<text x="44" y="646" font-size="13" fill="#111827">(JEP 322) — ex.: 11.0.2 = 2ª atualização do 11</text>
