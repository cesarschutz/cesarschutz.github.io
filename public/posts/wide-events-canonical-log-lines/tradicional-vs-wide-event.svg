<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="440" fill="#ffffff"/>
<defs>
<marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#4b5563"/></marker>
</defs>
<text x="30" y="42" font-size="21" font-weight="700" fill="#111827">Logging tradicional vs wide events</text>

<!-- painel tradicional -->
<rect x="30" y="70" width="430" height="340" rx="12" fill="#fdecea" fill-opacity="0.35" stroke="#d9534f" stroke-width="2" stroke-dasharray="8 6"/>
<text x="245" y="102" font-size="15" font-weight="700" fill="#d9534f" text-anchor="middle">tradicional</text>

<rect x="50" y="130" width="120" height="52" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="110" y="162" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">Requisição</text>
<path d="M172 156 H218" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>

<g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#4b5563">
<rect x="224" y="116" width="216" height="26" rx="6" fill="#ffffff" stroke="#d1d5db"/><text x="234" y="134">log.info("iniciando…")</text>
<rect x="224" y="148" width="216" height="26" rx="6" fill="#ffffff" stroke="#d1d5db"/><text x="234" y="166">log.info("validou…")</text>
<rect x="224" y="180" width="216" height="26" rx="6" fill="#ffffff" stroke="#d1d5db"/><text x="234" y="198">log.info("chamou…")</text>
</g>
<text x="332" y="228" font-size="13" fill="#6b7280" text-anchor="middle">… dezenas de linhas espalhadas</text>

<path d="M245 244 V272" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>
<rect x="90" y="278" width="310" height="70" rx="12" fill="#ffffff" stroke="#d9534f" stroke-width="2"/>
<text x="245" y="308" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">grep + regex frágil</text>
<text x="245" y="331" font-size="13" fill="#6b7280" text-anchor="middle">horas montando o quebra-cabeça</text>

<!-- painel wide -->
<rect x="480" y="70" width="430" height="340" rx="12" fill="#eaf7ef" fill-opacity="0.4" stroke="#2e9e5b" stroke-width="2"/>
<text x="695" y="102" font-size="15" font-weight="700" fill="#2e9e5b" text-anchor="middle">wide events</text>

<rect x="505" y="120" width="130" height="52" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="570" y="152" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">Requisição</text>
<path d="M637 146 H691" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>

<rect x="697" y="112" width="190" height="70" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="792" y="138" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">filtro / middleware</text>
<text x="792" y="158" font-size="13" fill="#6b7280" text-anchor="middle">acumula contexto</text>
<text x="792" y="175" font-size="13" fill="#6b7280" text-anchor="middle">durante a requisição</text>

<path d="M792 185 C792 215 740 225 705 232" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>
<rect x="520" y="238" width="350" height="88" rx="12" fill="#ffffff" stroke="#2e9e5b" stroke-width="2.5"/>
<text x="695" y="266" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">1 evento · dezenas de campos</text>
<text x="695" y="289" font-size="13" fill="#4b5563" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">{ user, cart, payment, error… }</text>
<text x="695" y="312" font-size="13" fill="#6b7280" text-anchor="middle">emitido uma vez, no final</text>

<path d="M695 330 V355" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>
<rect x="555" y="360" width="280" height="40" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="695" y="386" font-size="14" font-weight="700" fill="#2e9e5b" text-anchor="middle">uma consulta responde tudo ✓</text>
</svg>
