<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 742" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="742" fill="#ffffff"/>
<defs><marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4b5563"/></marker></defs>
<text x="24" y="40" font-size="21" font-weight="700" fill="#111827">Migração de versão do Java em cinco fases</text>
<text x="24" y="64" font-size="14" fill="#6b7280">As duas primeiras fases acontecem ainda na versão atual. O JDK só é trocado depois que o terreno está pronto.</text>
<text x="146" y="102" font-size="14" font-weight="700" fill="#6b7280" text-anchor="middle">Fase</text>
<text x="256" y="102" font-size="14" font-weight="700" fill="#6b7280">O que fazer</text>
<text x="668" y="102" font-size="14" font-weight="700" fill="#6b7280">Sai da fase com</text>
<rect x="24" y="116" width="22" height="210" rx="8" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="39.5" y="221.0" font-size="13" font-weight="700" fill="#2b7fc4" text-anchor="middle" transform="rotate(-90 39.5 221.0)">na versão atual</text>
<rect x="24" y="352" width="22" height="328" rx="8" fill="#fdf1e3" stroke="#e07a1f" stroke-width="1.5"/>
<text x="39.5" y="516.0" font-size="13" font-weight="700" fill="#e07a1f" text-anchor="middle" transform="rotate(-90 39.5 516.0)">na versão alvo</text>
<rect x="58" y="116" width="176" height="92" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="146" y="158.0" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">1. Análise</text>
<text x="146" y="180.0" font-size="13" fill="#2b7fc4" text-anchor="middle">medir antes de mexer</text>
<text x="256" y="147.0" font-size="14" fill="#111827">jdeps e jdeprscan com o JDK alvo, nos JARs</text>
<text x="256" y="167.0" font-size="14" fill="#111827">da aplicação e das dependências; inventário</text>
<text x="256" y="187.0" font-size="14" fill="#111827">de bibliotecas, agentes e flags de JVM</text>
<rect x="652" y="116" width="264" height="92" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="668" y="157.0" font-size="14" fill="#111827">backlog: bibliotecas a atualizar,</text>
<text x="668" y="177.0" font-size="14" fill="#111827">código a tocar, flags a revisar</text>
<line x1="146" y1="211" x2="146" y2="229" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<rect x="58" y="234" width="176" height="92" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="2"/>
<text x="146" y="276.0" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">2. Preparação</text>
<text x="146" y="298.0" font-size="13" fill="#2b7fc4" text-anchor="middle">reduzir o risco</text>
<text x="256" y="265.0" font-size="14" fill="#111827">atualizar dependências uma a uma, zerar</text>
<text x="256" y="285.0" font-size="14" fill="#111827">avisos de depreciação, medir a linha de base</text>
<text x="256" y="305.0" font-size="14" fill="#111827">e criar um job de CI com o JDK alvo</text>
<rect x="652" y="234" width="264" height="92" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="668" y="275.0" font-size="14" fill="#111827">build verde na versão atual, já</text>
<text x="668" y="295.0" font-size="14" fill="#111827">com bibliotecas compatíveis</text>
<line x1="146" y1="329" x2="146" y2="347" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<rect x="58" y="352" width="176" height="92" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2"/>
<text x="146" y="394.0" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">3. Migração</text>
<text x="146" y="416.0" font-size="13" fill="#e07a1f" text-anchor="middle">trocar o JDK do build</text>
<text x="256" y="383.0" font-size="14" fill="#111827">--release ou toolchain na versão alvo, imagem</text>
<text x="256" y="403.0" font-size="14" fill="#111827">base nova, revisão das flags de JVM;</text>
<text x="256" y="423.0" font-size="14" fill="#111827">--add-opens só como paliativo com prazo</text>
<rect x="652" y="352" width="264" height="92" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="668" y="393.0" font-size="14" fill="#111827">aplicação compila, sobe e passa</text>
<text x="668" y="413.0" font-size="14" fill="#111827">nos testes no JDK alvo</text>
<line x1="146" y1="447" x2="146" y2="465" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<rect x="58" y="470" width="176" height="92" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2"/>
<text x="146" y="512.0" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">4. Testes</text>
<text x="146" y="534.0" font-size="13" fill="#e07a1f" text-anchor="middle">provar que não piorou</text>
<text x="256" y="501.0" font-size="14" fill="#111827">suíte nas duas versões, carga comparada</text>
<text x="256" y="521.0" font-size="14" fill="#111827">com a linha de base (JFR e log de GC),</text>
<text x="256" y="541.0" font-size="14" fill="#111827">scan de vulnerabilidades e revisão de TLS</text>
<rect x="652" y="470" width="264" height="92" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="668" y="511.0" font-size="14" fill="#111827">evidência: sem regressão funcional,</text>
<text x="668" y="531.0" font-size="14" fill="#111827">de desempenho ou de segurança</text>
<line x1="146" y1="565" x2="146" y2="583" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<rect x="58" y="588" width="176" height="92" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="146" y="620.0" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">5. Implantação</text>
<text x="146" y="640.0" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">gradual</text>
<text x="146" y="662.0" font-size="13" fill="#2e9e5b" text-anchor="middle">ambiente por ambiente</text>
<text x="256" y="619.0" font-size="14" fill="#111827">homologação, canário e produção, com critérios</text>
<text x="256" y="639.0" font-size="14" fill="#111827">de avanço e gatilhos de rollback combinados</text>
<text x="256" y="659.0" font-size="14" fill="#111827">antes de começar</text>
<rect x="652" y="588" width="264" height="92" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
<text x="668" y="629.0" font-size="14" fill="#111827">frota inteira na versão alvo e</text>
<text x="668" y="649.0" font-size="14" fill="#111827">a imagem anterior guardada</text>
<rect x="58" y="696" width="858" height="34" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
<text x="487" y="718" font-size="14" fill="#111827" text-anchor="middle">Impedimento novo nas fases 3 a 5 volta para o backlog e é resolvido como na fase 2, antes de seguir.</text>
</svg>
