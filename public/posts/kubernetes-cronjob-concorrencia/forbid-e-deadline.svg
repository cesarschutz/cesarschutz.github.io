<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="450" fill="#ffffff"/>
<defs>
<marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#4b5563"/></marker>
<marker id="mg" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#2e9e5b"/></marker>
<marker id="mr" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#d9534f"/></marker>
</defs>
<text x="30" y="42" font-size="21" font-weight="700" fill="#111827">Forbid e activeDeadlineSeconds trabalhando juntos</text>

<!-- legenda: cadeado -->
<g stroke="#d9534f" stroke-width="4" fill="#fdecea">
<path d="M60 92 v-14 a20 20 0 0 1 40 0 v14" fill="none" stroke-linecap="round"/>
<rect x="50" y="92" width="60" height="46" rx="10"/>
</g>
<text x="126" y="110" font-size="14" font-weight="700" fill="#d9534f">concurrencyPolicy: Forbid</text>
<text x="126" y="130" font-size="13" fill="#4b5563">um Job por vez</text>

<rect x="330" y="72" width="280" height="56" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/>
<text x="470" y="106" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">chegou o horário do schedule</text>
<path d="M470 130 V158" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>

<!-- decisão -->
<polygon points="470,160 640,225 470,290 300,225" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2.5"/>
<text x="470" y="219" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Job anterior</text>
<text x="470" y="240" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">ainda ativo?</text>

<!-- sim/forbid -->
<path d="M642 225 H720" fill="none" stroke="#d9534f" stroke-width="2.5" marker-end="url(#mr)"/>
<text x="681" y="212" font-size="13" font-weight="700" fill="#d9534f" text-anchor="middle">sim</text>
<rect x="725" y="192" width="190" height="66" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2.5"/>
<text x="820" y="220" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">execução pulada</text>
<text x="820" y="242" font-size="13" fill="#4b5563" text-anchor="middle">sem execução paralela</text>

<!-- não -->
<path d="M470 292 V320" fill="none" stroke="#2e9e5b" stroke-width="2.5" marker-end="url(#mg)"/>
<text x="484" y="312" font-size="13" font-weight="700" fill="#2e9e5b">não</text>
<rect x="330" y="325" width="280" height="56" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2.5"/>
<text x="470" y="359" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">novo Job é criado</text>

<!-- deadline -->
<path d="M612 353 H662" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>
<rect x="668" y="306" width="247" height="124" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/>
<text x="791" y="334" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">activeDeadlineSeconds</text>
<text x="791" y="358" font-size="13" fill="#4b5563" text-anchor="middle">passou do limite? o Kubernetes</text>
<text x="791" y="377" font-size="13" fill="#4b5563" text-anchor="middle">encerra os Pods e marca o Job</text>
<text x="791" y="396" font-size="13" fill="#4b5563" text-anchor="middle">como falho: um Job travado</text>
<text x="791" y="415" font-size="13" fill="#4b5563" text-anchor="middle">não bloqueia os próximos ciclos</text>
</svg>
