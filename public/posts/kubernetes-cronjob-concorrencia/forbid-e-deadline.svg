<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="940" height="440" fill="#ffffff"/>
<defs>
<marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#4b5563"/></marker>
<marker id="mg" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#2e9e5b"/></marker>
<marker id="mr" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#d9534f"/></marker>
</defs>
<text x="30" y="42" font-size="21" font-weight="700" fill="#111827">Forbid e activeDeadlineSeconds trabalhando juntos</text>

<rect x="330" y="72" width="280" height="56" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/>
<text x="470" y="107" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">chegou o horário do schedule</text>
<path d="M470 130 V158" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>

<!-- decisão -->
<polygon points="470,160 640,225 470,290 300,225" fill="#fdf1e3" stroke="#e07a1f" stroke-width="2.5"/>
<text x="470" y="218" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="middle">execução anterior</text>
<text x="470" y="240" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="middle">ainda ativa?</text>

<!-- sim/forbid -->
<path d="M642 225 H720" fill="none" stroke="#d9534f" stroke-width="2.5" marker-end="url(#mr)"/>
<text x="681" y="212" font-size="12" font-weight="700" fill="#d9534f" text-anchor="middle">sim + Forbid</text>
<rect x="725" y="196" width="185" height="58" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="2.5"/>
<text x="817" y="222" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="middle">execução pulada</text>
<text x="817" y="243" font-size="12.5" fill="#6b7280" text-anchor="middle">sem duplicidade</text>

<!-- não -->
<path d="M470 292 V320" fill="none" stroke="#2e9e5b" stroke-width="2.5" marker-end="url(#mg)"/>
<text x="490" y="312" font-size="12.5" font-weight="700" fill="#2e9e5b">não</text>
<rect x="330" y="325" width="280" height="56" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2.5"/>
<text x="470" y="360" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">nova execução inicia</text>

<!-- deadline -->
<path d="M612 353 H680" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>
<rect x="686" y="318" width="224" height="100" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/>
<text x="798" y="346" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">activeDeadlineSeconds</text>
<text x="798" y="370" font-size="12.5" fill="#6b7280" text-anchor="middle">estourou? K8s encerra e marca falho —</text>
<text x="798" y="390" font-size="12.5" fill="#6b7280" text-anchor="middle">um job travado não bloqueia</text>
<text x="798" y="408" font-size="12.5" fill="#6b7280" text-anchor="middle">os próximos ciclos</text>

<!-- cadeado decorativo -->
<g stroke="#d9534f" stroke-width="4" fill="#fdecea">
<path d="M60 92 v-14 a20 20 0 0 1 40 0 v14" fill="none" stroke-linecap="round"/>
<rect x="50" y="92" width="60" height="46" rx="10"/>
</g>
<text x="140" y="112" font-size="13.5" font-weight="700" fill="#d9534f">concurrencyPolicy: Forbid</text>
<text x="140" y="132" font-size="12.5" fill="#6b7280">nunca duas ao mesmo tempo</text>
</svg>
