<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="640" fill="#ffffff"/>
<defs><marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4b5563"/></marker></defs>
<text x="24" y="40" font-size="21" font-weight="700" fill="#111827">Virtual thread bloqueada em synchronized: antes e depois da JEP 491</text>
<rect x="24" y="64" width="434" height="44" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="241.0" y="91.6" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Java 21 a 23</text>
<rect x="482" y="64" width="434" height="44" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="699.0" y="91.6" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Java 24 e Java 25</text>
<rect x="24" y="128" width="434" height="66" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="241.0" y="156.1" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">A virtual thread VT-1 bloqueia dentro de</text>
<text x="241.0" y="175.7" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">synchronized (I/O, wait(), monitor ocupado)</text>
<line x1="241.0" y1="196" x2="241.0" y2="222" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<rect x="482" y="128" width="434" height="66" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="699.0" y="156.1" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">A virtual thread VT-1 bloqueia dentro de</text>
<text x="699.0" y="175.7" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">synchronized (I/O, wait(), monitor ocupado)</text>
<line x1="699.0" y1="196" x2="699.0" y2="222" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<rect x="24" y="226" width="434" height="66" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
<text x="241.0" y="254.1" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">Não desmonta: a JVM registra a carrier como</text>
<text x="241.0" y="273.7" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">dona do monitor (pinning)</text>
<rect x="482" y="226" width="434" height="66" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="699.0" y="254.1" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">Desmonta: o monitor passa a ser associado à</text>
<text x="699.0" y="273.7" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">própria virtual thread, e não à carrier</text>
<line x1="241.0" y1="294" x2="241.0" y2="320" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<line x1="699.0" y1="294" x2="699.0" y2="320" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<rect x="24" y="324" width="434" height="110" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="241.0" y="346" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Carrier threads (threads da plataforma)</text>
<rect x="42" y="362" width="124" height="34" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
<text x="104.0" y="383.5" font-size="13" font-weight="400" fill="#111827" text-anchor="middle">presa: VT-1</text>
<rect x="176" y="362" width="124" height="34" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
<text x="238.0" y="383.5" font-size="13" font-weight="400" fill="#111827" text-anchor="middle">presa: VT-7</text>
<rect x="310" y="362" width="124" height="34" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
<text x="372.0" y="383.5" font-size="13" font-weight="400" fill="#111827" text-anchor="middle">presa: VT-9</text>
<text x="241.0" y="420" font-size="13" font-weight="400" fill="#d9534f" text-anchor="middle">novas tarefas esperam uma carrier livre</text>
<rect x="482" y="324" width="434" height="110" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="699.0" y="346" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Carrier threads (threads da plataforma)</text>
<rect x="500" y="362" width="124" height="34" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="562.0" y="383.5" font-size="13" font-weight="400" fill="#111827" text-anchor="middle">livre: roda VT-2</text>
<rect x="634" y="362" width="124" height="34" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="696.0" y="383.5" font-size="13" font-weight="400" fill="#111827" text-anchor="middle">livre: roda VT-3</text>
<rect x="768" y="362" width="124" height="34" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="830.0" y="383.5" font-size="13" font-weight="400" fill="#111827" text-anchor="middle">livre: roda VT-4</text>
<text x="699.0" y="420" font-size="13" font-weight="400" fill="#2e9e5b" text-anchor="middle">VT-1 aguarda fora de qualquer carrier</text>
<line x1="241.0" y1="436" x2="241.0" y2="462" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<line x1="699.0" y1="436" x2="699.0" y2="462" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<rect x="24" y="466" width="434" height="66" rx="12" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
<text x="241.0" y="494.1" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">Com várias VTs nessa situação o pool esgota:</text>
<text x="241.0" y="513.7" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">latência sobe ou a aplicação para</text>
<rect x="482" y="466" width="434" height="66" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="699.0" y="494.1" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">Monitor liberado: VT-1 volta ao scheduler e</text>
<text x="699.0" y="513.7" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">remonta, possivelmente em outra carrier</text>
<rect x="24" y="556" width="892" height="62" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="470.0" y="582.4" font-size="13" font-weight="400" fill="#111827" text-anchor="middle">Pinning que continua: código nativo que chama de volta código Java e bloqueia, e bloqueios durante</text>
<text x="470.0" y="600.6" font-size="13" font-weight="400" fill="#111827" text-anchor="middle">carregamento ou inicialização de classes. O evento JFR jdk.VirtualThreadPinned segue disponível.</text>
</svg>