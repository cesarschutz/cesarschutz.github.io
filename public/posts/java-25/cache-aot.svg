<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="Inter, system-ui, sans-serif">
<rect width="940" height="560" fill="#ffffff"/>
<defs><marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4b5563"/></marker></defs>
<text x="24" y="40" font-size="21" font-weight="700" fill="#111827">Cache AOT do Projeto Leyden: treino, criação e execução</text>
<text x="24" y="84" font-size="15" font-weight="700" fill="#374151" text-anchor="start">Java 24 (JEP 483): três passos explícitos</text>
<rect x="24" y="100" width="272" height="96" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="1.5"/>
<text x="160.0" y="133.3" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">1. Execução de treino</text>
<text x="160.0" y="152.9" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">-XX:AOTMode=record</text>
<text x="160.0" y="172.5" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">grava app.aotconf</text>
<rect x="334" y="100" width="272" height="96" rx="12" fill="#fdf1e3" stroke="#e07a1f" stroke-width="1.5"/>
<text x="470.0" y="133.3" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">2. Criação do cache</text>
<text x="470.0" y="152.9" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">-XX:AOTMode=create</text>
<text x="470.0" y="172.5" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">gera app.aot (não roda a app)</text>
<rect x="644" y="100" width="272" height="96" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="780.0" y="133.3" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">3. Produção</text>
<text x="780.0" y="152.9" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">-XX:AOTCache=app.aot</text>
<text x="780.0" y="172.5" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">classes já carregadas e linkadas</text>
<line x1="298" y1="148.0" x2="330" y2="148.0" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<line x1="608" y1="148.0" x2="640" y2="148.0" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<text x="24" y="250" font-size="15" font-weight="700" fill="#374151" text-anchor="start">Java 25 (JEP 514 e JEP 515): um comando cria o cache</text>
<rect x="24" y="266" width="582" height="96" rx="12" fill="#eaf3fb" stroke="#2b7fc4" stroke-width="1.5"/>
<text x="315.0" y="299.3" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">1. Treino e criação em um passo</text>
<text x="315.0" y="318.9" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">-XX:AOTCacheOutput=app.aot</text>
<text x="315.0" y="338.5" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">a JVM faz record + create e apaga a configuração temporária</text>
<rect x="644" y="266" width="272" height="96" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="780.0" y="299.3" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">2. Produção</text>
<text x="780.0" y="318.9" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">-XX:AOTCache=app.aot</text>
<text x="780.0" y="338.5" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">classes + perfis de métodos</text>
<line x1="608" y1="314.0" x2="640" y2="314.0" stroke="#4b5563" stroke-width="2" marker-end="url(#seta)"/>
<rect x="24" y="396" width="434" height="142" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="44" y="424" font-size="15" font-weight="700" fill="#111827" text-anchor="start">O que o cache traz</text>
<text x="44" y="456" font-size="14" font-weight="400" fill="#374151" text-anchor="start">• classes lidas, parseadas, carregadas e linkadas (Java 24)</text>
<text x="44" y="484" font-size="14" font-weight="400" fill="#374151" text-anchor="start">• perfis de métodos coletados no treino (Java 25)</text>
<text x="44" y="512" font-size="14" font-weight="400" fill="#374151" text-anchor="start">• o JIT otimiza mais cedo e segue perfilando</text>
<rect x="482" y="396" width="434" height="142" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="502" y="424" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Regras para reaproveitar o cache</text>
<text x="502" y="456" font-size="14" font-weight="400" fill="#374151" text-anchor="start">• mesma release do JDK, SO e arquitetura</text>
<text x="502" y="484" font-size="14" font-weight="400" fill="#374151" text-anchor="start">• class path compatível, somente JARs</text>
<text x="502" y="512" font-size="14" font-weight="400" fill="#374151" text-anchor="start">• mesmas opções de módulos na linha de comando</text>
</svg>